# The kagent runtime of the ATS agent round trips, layered over the scenario's
# base values file (tests/ats/scenarios.py): the smoke's declarative Agent and
# agent-manager's create_agent need the kagent controller, and
# on this line the controller needs Agent Substrate — every agent is a Substrate
# actor in a gVisor worker pod. The own-Flux scenario deploys an agent through
# the cluster's own Flux with the same file. Substrate comes from the chart under
# test (components.substrate and substrate-crds follow components.kagent), the
# way an installation gets it; what the cluster must bring — Kubernetes 1.35 or
# newer with the ClusterTrustBundle, ClusterTrustBundleProjection and
# PodCertificateRequest feature gates and certificates.k8s.io/v1beta1 — the CI
# job's kind cluster gets from .ats/kind-config.yaml (the render refuses a
# cluster without the API).
#
# Sized for the CI executor (the `large` class, one 4-vCPU / 15 GB node): one
# gVisor worker with modest requests — one worker hosts one actor at a time and
# the smoke's Agents boot in turn — under the Substrate control plane the
# chart renders (single replicas, ate-api-server two), its bundled Postgres at a
# fraction of the chart's 1-CPU request, the bundled RustFS as the snapshot
# store (a lab's shape; an installation names its own bucket), the kagent UI at
# zero replicas (nothing in the smoke reaches it, and its image is the largest
# pull of the install — the chart has no ui.enabled switch, zero replicas keeps
# the Deployment without a pod) and the controller's database on the platform's
# CloudNativePG Cluster, the one supported shape since the kagent chart deploys
# no PostgreSQL (agent-platform.validateKagentDatabase): one instance with
# pgvector, the operator from components.cloudnative-pg (an installation's
# cluster brings its own). tests/ats/README.md carries the measured timings.
components:
  kagent:
    enabled: true
  cloudnative-pg:
    enabled: true
postgres:
  enabled: true
  instances: 1
  storage:
    size: 1Gi
  image:
    name: gsoci.azurecr.io/giantswarm/postgresql-cnpg:18.3
  vector:
    enabled: true
    extensionImage:
      reference: gsoci.azurecr.io/giantswarm/pgvector:0.8.2-18-bookworm
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
kagent:
  controller:
    resources:
      requests:
        cpu: 50m
  ui:
    replicas: 0
  harness:
    # The actors' snapshot store: the bundled RustFS below, s3://<bucket>/<prefix>.
    snapshotLocation: s3://ate-snapshots/kagent
  substrateWorkerPool:
    replicas: 1
    template:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi

substrate:
  # The in-cluster S3 store (the chart's static lab credentials) the snapshot
  # location above names. The control plane's Postgres is a database of the
  # platform's CNPG Cluster above: substrate.postgres.enabled `auto` resolves to it.
  rustfs:
    enabled: true

# The engine's helm-controller re-checks a HelmRelease's dependsOn on a fixed
# timer (--requeue-dependency, 30 s upstream; Flux 2.9 watches no dependency),
# so the roster's chain — CRDs and muster, then connectivity, Substrate, kagent,
# then agent-manager — idles up to 30 s at every level. 5 s here: the install's
# wall clock on the executor, not its order (dependsOn still gates every step).
# Ten workers (--concurrent, 4 upstream): an install with --wait holds a worker
# for as long as the release takes, and with four the roster's ten releases
# queue behind the slow ones while their dependents cannot even check. The
# own-Flux scenario gives the cluster's helm-controller the same args
# (conftest.helm_controller_args reads this block), so both scenarios install
# the chain on one setting.
flux-engine:
  instance:
    kustomizePatches:
      - target:
          kind: Deployment
          name: helm-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=10
