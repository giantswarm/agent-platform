# The kagent runtime for the ATS agent round trips, layered over
# tests/test-values.yaml (tests/ats/conftest.py): the kind smoke's declarative
# Agent and agent-manager's create_agent need the controller; the own-Flux
# scenario deploys a declarative agent through the cluster's own Flux with the
# same file. Sized for the CI executor (two cores): modest CPU requests so the
# controller and its bundled Postgres schedule next to the engine and the
# platform pods; the kagent UI stays off (nothing in the smoke reaches it, and
# its image is the largest pull of the install — the chart has no ui.enabled
# switch, zero replicas keeps the Deployment without a pod).
#
# kagent is OFF here. The platform's kagent is the kagent line (kagent API v2,
# kagent.dev/v1alpha3), and it cannot run on the ATS kind cluster as the job
# creates it: agents are Agent Substrate actors, so the controller needs
# Substrate in ate-system and the apiserver feature gates ClusterTrustBundle,
# ClusterTrustBundleProjection, PodCertificateRequest (+
# certificates.k8s.io/v1beta1), none of which the cluster has — feature gates
# are fixed at `kind create`, which the generated CI job owns
# (giantswarm/agent-platform#343 and the CI-tooling chain it depends on bring
# them). The agent round trips are skipped with that reason
# (tests/ats/conftest.py KAGENT_ON); agentlab, with the gates and Substrate,
# proves them. The sizing below is inert while off and is what the smoke gets
# back when kagent returns.
components:
  kagent:
    enabled: false

kagent:
  controller:
    resources:
      requests:
        cpu: 50m
  ui:
    replicas: 0
  database:
    postgres:
      bundled:
        resources:
          requests:
            cpu: 50m
