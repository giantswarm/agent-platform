            "content": "The **Giant Swarm Agent Platform** runs AI agents on your own infrastructure and gives them governed access to curated tools.\n\nThis board is the entry point: is the platform healthy, and what is it doing. Every health panel reads the same series as the alert that pages for it, so a panel and a page cannot disagree.\n\n| Board | What it covers |\n|---|---|\n| **LLM usage** | tokens, cost and latency per agent and per model |\n| **Usage by person** | the same, per signed-in person |\n| **Agentgateway** | the gateway itself: requests, MCP tool calls, control-plane config distribution, runtime |\n| **Muster / MCP Gateway** | the MCP server fleet, tool calls and workflows |\n| **Klaus Gateway** | the channel front door: requests, turns and their phases, Slack streaming |\n| **Valkey** | the platform's key-value stores: memory against the limit, evictions, traffic |\n| **mcp-kubernetes** (administrator, security, cluster operator) | the Kubernetes MCP server, where that component is on |\n\nPostgres has no board of its own: its row is below. The full CloudNativePG board lives in the Giant Swarm organization, for Giant Swarm staff.",
            "mode": "markdown"
          },
          "pluginVersion": "12.1.0",
          "title": "",
          "transparent": true,
          "type": "text"
        },
