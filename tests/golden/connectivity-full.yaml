                            "editorMode": "code",
                            "expr": "sum by (user) (rate(agentgateway_response_bytes_total{gateway=~\"$gateway\", route=~\"$route\", agent=~\"$caller\", user=~\"$user\"}[$__rate_interval]))",
                            "instant": false,
