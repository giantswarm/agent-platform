# Source: agent-platform-connectivity/templates/model-serving/presets.yaml
# Serving preset gemma-4-12b (shipped): the published ServingPreset
# the portal's serve flow turns into an LLMInferenceService. Schema:
# files/model-serving/serving-preset.schema.json. List all presets with
#   kubectl -n default get configmap -l agent-platform.giantswarm.io/serving-preset=true
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-serving-preset-gemma-4-12b
  namespace: default
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
    app.kubernetes.io/component: model-serving
    agent-platform.giantswarm.io/serving-preset: "true"
    agent-platform.giantswarm.io/preset: "gemma-4-12b"
    agent-platform.giantswarm.io/preset-source: "shipped"
  annotations:
    agent-platform.giantswarm.io/chart-version: "1.1.35"
data:
  preset.yaml: |
    apiVersion: agent-platform.giantswarm.io/v1alpha1
    kind: ServingPreset
    metadata:
      name: gemma-4-12b
    spec:
      args:
      - --gpu-memory-utilization=0.90
      - --max-model-len=32768
      - --max-num-seqs=4
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - '--limit-mm-per-prompt=''{"image": 1, "audio": 0}'''
      - --no-enable-log-requests
      - --reasoning-parser=gemma4
      - --enable-auto-tool-choice
      - --tool-call-parser=gemma4
      description: |
        Gemma 4 12B: Google DeepMind's dense 12B model with tool calling,
        thinking (off unless a request turns it on with enable_thinking or a
        reasoning_effort) and image understanding, Apache 2.0. Served as the
        official quantization-aware-trained W4A16 checkpoint in the
        compressed-tensors format (9.6 GiB of weights — 4-bit weights trained
        to keep the bf16 quality, not a post-hoc quantization) on one 24 GB GPU
        of the L4 class, whose hybrid attention (sliding windows of 1024 tokens,
        one global layer in six) keeps the KV cache small. 32k of the model's
        256k context, four concurrent requests, chunked prefill and prefix
        caching; --gpu-memory-utilization=0.90 leaves about 10 GiB to the KV
        cache next to the weights — 10 + 8 GiB on the fit check. One image per
        request, no audio (the 12B understands speech, this recipe does not
        serve it: --limit-mm-per-prompt); reasoning with the gemma4 parser,
        tools on with the gemma4 parser (agents always send tools, and vLLM
        answers 400 without --enable-auto-tool-choice).
        Weights: an OCI model image, giantswarm/models/gemma-4-12b-qat-w4a16 at
        the checkpoint revision, pulled onto the node by containerd like any
        image (KServe's modelcar path: no download, no cache claim, every
        serving node a target); an installation serves it from a registry of
        its own that holds the same path by setting
        modelServing.modelImages.registry. The modelcar path runs the runtime as
        a non-root uid on a read-only image, so HOME, HF_HOME and
        VLLM_CACHE_ROOT live under /tmp.
        Sized for the smallest L4 instance, a g6.xlarge (4 vCPU, 16 GiB): the
        node's kubelet keeps about 0.6 vCPU and 2.6 GiB and the daemonsets that
        follow the pool's taint another 0.4 vCPU and 1.5 GiB, so the predictor
        requests 2 vCPU and 10 GiB and may burst to the node (4 vCPU, 12 GiB) —
        its host memory is the runtime and the weights passing through the page
        cache; the KV cache lives on the GPU. A 16 GB T4 does not host it
        (10 + 8 GiB, and the card predates bf16).
      displayName: Gemma 4 12B (QAT W4A16, one 24 GB GPU)
      env:
      - name: HOME
        value: /tmp
      - name: HF_HOME
        value: /tmp/hf
      - name: VLLM_CACHE_ROOT
        value: /tmp/vllm-cache
      - name: USER
        value: vllm
      - name: LOGNAME
        value: vllm
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/torchinductor
      model:
        capabilities:
        - chat
        - tools
        - reasoning
        - vision
        contextLength: 32768
        format: vLLM
        id: google/gemma-4-12B-it-qat-w4a16-ct
        license: apache-2.0
        storageUri: oci://gsoci.azurecr.io/giantswarm/models/gemma-4-12b-qat-w4a16:1d2c2d7f2466
      requirements:
        minComputeCapability: "8.0"
        overheadGiB: 8
        weightsGiB: 10
      resources:
        gpus: 1
        limits:
          cpu: "4"
          memory: 12Gi
        requests:
          cpu: "2"
          memory: 10Gi
      scheduling:
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
