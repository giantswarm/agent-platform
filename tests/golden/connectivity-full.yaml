# Source: agent-platform-connectivity/templates/model-serving/presets.yaml
# Serving preset qwen3-8-27b (shipped): the published ServingPreset
# the portal's serve flow turns into an LLMInferenceService. Schema:
# files/model-serving/serving-preset.schema.json. List all presets with
#   kubectl -n default get configmap -l agent-platform.giantswarm.io/serving-preset=true
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-serving-preset-qwen3-8-27b
  namespace: default
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
    app.kubernetes.io/component: model-serving
    agent-platform.giantswarm.io/serving-preset: "true"
    agent-platform.giantswarm.io/preset: "qwen3-8-27b"
    agent-platform.giantswarm.io/preset-source: "shipped"
  annotations:
    agent-platform.giantswarm.io/chart-version: "1.1.35"
data:
  preset.yaml: |
    apiVersion: agent-platform.giantswarm.io/v1alpha1
    kind: ServingPreset
    metadata:
      name: qwen3-8-27b
    spec:
      args:
      - --gpu-memory-utilization=0.60
      - --max-model-len=262144
      - --max-num-seqs=4
      - --max-num-batched-tokens=16384
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - '--limit-mm-per-prompt=''{"image": 1, "video": 0}'''
      - --speculative-config='{"method":"dflash","model":"z-lab/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
      - --no-enable-log-requests
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - '--default-chat-template-kwargs=''{"enable_thinking": true}'''
      - --chat-template=/mnt/chat-template/chat-template.jinja
      chatTemplate:
        configMap: agent-platform-chat-template-qwen3-8-27b
        key: chat-template.jinja
        mountPath: /mnt/chat-template
      description: |
        Dense 27B coding and agent model with 256k native context, tool calling
        (Claude Code compatible) and vision. Served as the Inferact NVFP4 repack
        (BF16 lm_head, required by the DFlash2 draft model), which cuts the
        weights from ~52 GiB to ~25 GiB (six shards plus the MTP experts file)
        and, with the 1.9B DFlash2 draft proposing 7 tokens per target pass,
        lifts single-request decode from ~4 to ~29 tok/s on a bandwidth-bound
        node. Target hardware: a single-GPU 128 GB unified-memory Blackwell node
        (the CUTE_DSL_ARCH pin, --gpu-memory-utilization=0.60 and the 30 GiB of
        overhead belong to that hardware; adjust all three elsewhere). As tuned,
        the recipe needs 55 GiB (25 GiB of weights + 30 GiB of overhead): no
        size of the curated AWS accelerator families (24 GiB L4/A10G, 16 GiB T4,
        48 GiB L40S) hosts it. The chat template maps the Anthropic reasoning effort
        "high" to the model's "xhigh", which the stock template rejects.
        Known ceiling: the DFlash kernel can wedge at >100k-token prefill with
        concurrency >= 2, hence --max-num-seqs=4.
      displayName: Qwen3.8 27B (NVFP4, speculative decoding)
      env:
      - name: CUTE_DSL_ARCH
        value: sm_121a
      model:
        capabilities:
        - chat
        - tools
        - reasoning
        - vision
        - coding
        contextLength: 262144
        format: vLLM
        id: Inferact/Qwen3.8-27B-NVFP4
        license: apache-2.0
        storageUri: hf://Inferact/Qwen3.8-27B-NVFP4
      requirements:
        minComputeCapability: "10.0"
        overheadGiB: 30
        weightsGiB: 25
      resources:
        gpus: 1
        limits:
          cpu: "8"
          memory: 64Gi
        requests:
          cpu: "4"
          memory: 48Gi
      scheduling:
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
