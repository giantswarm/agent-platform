apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: t
  namespace: default
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
spec:
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/agentgateway-upstream/agentgateway
    tag: 2.0.0
  service:
    spec:
      type: ClusterIP
  podDisruptionBudget:
    spec:
      maxUnavailable: 1
  deployment:
    spec:
      replicas: 2
      template:
        spec:
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: agentgateway
              matchLabelKeys:
                - pod-template-hash
          containers:
            - name: agentgateway
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                limits:
                  cpu: 2000m
                  ephemeral-storage: 512Mi
                  memory: 512Mi
                requests:
                  cpu: 100m
                  ephemeral-storage: 50Mi
                  memory: 128Mi
              env:
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: http://otlp-gateway.kube-system.svc:4317
                - name: OTEL_EXPORTER_OTLP_PROTOCOL
                  value: grpc
