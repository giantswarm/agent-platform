---
# Source: agent-platform-connectivity/templates/namespace.yaml
# The kagent namespace, adopted where the cluster created it (a management
# cluster's bases, the bundled engine's kagent HelmRelease with
# install.createNamespace) and created here otherwise. It is KEPT
# (helm.sh/resource-policy: keep): Helm never deletes it — not on `helm
# uninstall` of the platform, whose agents' workloads and Helm storage stay
# behind orphaned in it (README "Uninstalling"), and not as the install
# remediation of a failed first install of this release, which used to take the
# namespace and every kagent object in it down with the release (measured on
# the ATS kind smoke: a PolicyException without its namespace failed the
# install, the remediation deleted the kagent namespace, kagent's pods with it).
apiVersion: v1
kind: Namespace
metadata:
  name: kagent
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: "Helm"
    application.giantswarm.io/team: "bumblebee"
---
# Source: agent-platform-connectivity/templates/kagent/workerpool-pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "kagent-default"
  namespace: kagent
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
    app.kubernetes.io/component: substrate-worker-pool
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      ate.dev/worker-pool: "kagent-default"
---
