              "editorMode": "code",
              "expr": "count(gotk_resource_info{job=\"flux-ksm\", ready=\"False\", customresource_kind=\"HelmRelease\", cluster_type=\"management_cluster\", exported_namespace=\"flux-giantswarm\", team=\"bumblebee\", cluster_id=~\"$cluster\"}) or vector(0)",
