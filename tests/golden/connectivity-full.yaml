data:
  preset.yaml: |
    apiVersion: agent-platform.giantswarm.io/v1alpha1
    kind: ServingPreset
    metadata:
      name: gemma-4-31b
    spec:
      args:
      - --gpu-memory-utilization=0.92
      - --max-model-len=32768
      - --kv-cache-dtype=fp8
      - --max-num-seqs=4
      - --max-num-batched-tokens=8192
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - '--limit-mm-per-prompt=''{"image": 1, "audio": 0}'''
      - --no-enable-log-requests
      - --reasoning-parser=gemma4
      - --enable-auto-tool-choice
      - --tool-call-parser=gemma4
      - --chat-template=/mnt/chat-template/chat-template.jinja
      chatTemplate:
        configMap: agent-platform-chat-template-gemma-4-31b
        key: chat-template.jinja
        mountPath: /mnt/chat-template
      description: |
        Google's dense 31B instruction-tuned model with tool calling, thinking
        and vision (the model also takes audio; this recipe switches it off),
        served as Red Hat's FP8-dynamic quantization (31 GiB of weights) on one
        48 GB GPU of the L40S family: g6e.2xlarge or g6e.4xlarge (g6e.xlarge
        leaves a predictor 3 vCPU / 27 GiB, less than the 4 vCPU / 32 GiB
        requested here). The model's own window is 262,144 tokens; the preset
        serves 32k with an fp8 KV cache, what a 48 GB card holds beside 31 GiB
        of weights at --gpu-memory-utilization=0.92 (four concurrent requests,
        one image per prompt, no audio). Tool calls and thinking use Gemma 4's own
        token protocol, parsed with vLLM's gemma4 tool and reasoning parsers
        under vLLM's Gemma 4 chat template — the template the model card's vLLM
        instructions and vLLM's Gemma 4 recipe both serve the model with,
        shipped as chat-templates/gemma-4-31b.jinja from vLLM v0.23.0's
        examples (the vLLM inside llm-d v0.8.0, the platform's runtime image).
        Thinking is off by default; a request turns it on with enable_thinking.
        Weights: an OCI model image, giantswarm/models/gemma-4-31b-fp8 at the
        checkpoint revision, pulled onto the node by containerd (KServe's
        modelcar path: no download, no cache claim); the runtime runs as a
        non-root uid on the read-only image, so HOME, HF_HOME and
        VLLM_CACHE_ROOT live under /tmp. 31 + 13 GiB exceed a 24 GB L4/A10G and
        a 16 GB T4.
      displayName: Gemma 4 31B (FP8, one 48 GB GPU)
      env:
      - name: HOME
        value: /tmp
      - name: HF_HOME
        value: /tmp/hf
      - name: VLLM_CACHE_ROOT
        value: /tmp/vllm-cache
      - name: USER
        value: vllm
      - name: LOGNAME
        value: vllm
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/torchinductor
      model:
        capabilities:
        - chat
        - tools
        - reasoning
        - vision
        - coding
        contextLength: 32768
        format: vLLM
        id: RedHatAI/gemma-4-31B-it-FP8-dynamic
        license: apache-2.0
        storageUri: oci://gsoci.azurecr.io/giantswarm/models/gemma-4-31b-fp8:d4ab4f579dd3
      requirements:
        minComputeCapability: "8.9"
        overheadGiB: 13
        weightsGiB: 31
      resources:
        gpus: 1
        limits:
          cpu: "8"
          memory: 48Gi
        requests:
          cpu: "4"
          memory: 32Gi
      scheduling:
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
