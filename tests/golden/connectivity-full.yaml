# Source: agent-platform-connectivity/templates/model-serving/presets.yaml
# Serving preset muse-glimmer-30b (shipped): the published ServingPreset
# the portal's serve flow turns into an LLMInferenceService. Schema:
# files/model-serving/serving-preset.schema.json. List all presets with
#   kubectl -n default get configmap -l agent-platform.giantswarm.io/serving-preset=true
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-serving-preset-muse-glimmer-30b
  namespace: default
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
    app.kubernetes.io/component: model-serving
    agent-platform.giantswarm.io/serving-preset: "true"
    agent-platform.giantswarm.io/preset: "muse-glimmer-30b"
    agent-platform.giantswarm.io/preset-source: "shipped"
  annotations:
    agent-platform.giantswarm.io/chart-version: "1.1.35"
data:
  preset.yaml: |
    apiVersion: agent-platform.giantswarm.io/v1alpha1
    kind: ServingPreset
    metadata:
      name: muse-glimmer-30b
    spec:
      args:
      - --gpu-memory-utilization=0.92
      - --max-model-len=32768
      - --max-num-seqs=4
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - '--limit-mm-per-prompt=''{"image": 1}'''
      - --no-enable-log-requests
      - --reasoning-parser=muse_glimmer
      - --enable-auto-tool-choice
      - --tool-call-parser=muse_glimmer
      - --chat-template=/mnt/chat-template/chat-template.jinja
      chatTemplate:
        configMap: agent-platform-chat-template-muse-glimmer-30b
        key: chat-template.jinja
        mountPath: /mnt/chat-template
      description: |
        Meta's dense 30B instruction-tuned model with tool calling, reasoning
        and vision, served as Red Hat AI's FP8 block quantization (32 GiB of
        weights, compressed-tensors) on one 48 GB GPU of the L40S family:
        g6e.2xlarge or g6e.4xlarge (g6e.xlarge leaves a predictor 3 vCPU /
        27 GiB, less than the 4 vCPU / 32 GiB requested here). 32k of the
        model's 128k context, four concurrent requests, one image per prompt:
        52 layers with 2 KV heads of 128 dimensions keep a token's KV cache at
        52 KiB, so four 32k sequences take 6.5 GiB beside the weights at
        --gpu-memory-utilization=0.92. Tool calls and reasoning use the model's
        own ATEM protocol, parsed with vLLM's muse_glimmer tool and reasoning
        parsers under vLLM's Muse Glimmer chat template, shipped as
        chat-templates/muse-glimmer-30b.jinja from vLLM v0.30.0's examples.
        Runtime: vLLM's own server image, vllm/vllm-openai v0.30.0, from its
        signed gsoci copy (giantswarm/vllm-openai, pinned by digest in
        retagger). The model's architecture (MuseGlimmerForConditionalGeneration)
        and its parsers first ship in vLLM 0.28.0, and the platform's llm-d
        runtime carries vLLM 0.23 (llm-d v0.9.0 ships 0.26); this preset names
        its image for that reason only, and moves to the well-known runtime once
        an llm-d release carries vLLM 0.28 or later.
        Weights: an OCI model image, giantswarm/models/muse-glimmer-30b-fp8 at
        the checkpoint revision, pulled onto the node by containerd (KServe's
        modelcar path: no download, no cache claim); the runtime runs as a
        non-root uid on the read-only image, so HOME, HF_HOME and
        VLLM_CACHE_ROOT live under /tmp. 33 + 11 GiB exceed a 24 GB L4/A10G and
        a 16 GB T4.
      displayName: Muse Glimmer 30B (FP8, one 48 GB GPU)
      env:
      - name: HOME
        value: /tmp
      - name: HF_HOME
        value: /tmp/hf
      - name: VLLM_CACHE_ROOT
        value: /tmp/vllm-cache
      - name: USER
        value: vllm
      - name: LOGNAME
        value: vllm
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/torchinductor
      model:
        capabilities:
        - chat
        - tools
        - reasoning
        - vision
        - coding
        contextLength: 32768
        format: vLLM
        id: RedHatAI/Muse-Glimmer-30B-FP8-block
        license: apache-2.0
        storageUri: oci://gsoci.azurecr.io/giantswarm/models/muse-glimmer-30b-fp8:1deb4641ff84
      requirements:
        minComputeCapability: "8.9"
        overheadGiB: 11
        weightsGiB: 33
      resources:
        gpus: 1
        limits:
          cpu: "8"
          memory: 48Gi
        requests:
          cpu: "4"
          memory: 32Gi
      scheduling:
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      template:
        containers:
        - image: gsoci.azurecr.io/giantswarm/vllm-openai:v0.30.0
          name: main
