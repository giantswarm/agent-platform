          "panel-7": {
            "kind": "Panel",
            "spec": {
              "id": 7,
              "title": "Unattributed share",
              "description": "Share of the requests on the selected routes that carry no person (`user=\"unknown\"`): a route whose JWT policy is `Optional`, or a call that reached the route without a bearer. Should stay at zero on the controller route, whose policy is `Strict`.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
