data:
  preset.yaml: |
    apiVersion: agent-platform.giantswarm.io/v1alpha1
    kind: ServingPreset
    metadata:
      name: qwen3-5-4b
    spec:
      args:
      - --gpu-memory-utilization=0.90
      - --max-model-len=32768
      - --max-num-seqs=4
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - '--limit-mm-per-prompt=''{"image": 1, "video": 0}'''
      - --no-enable-log-requests
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - '--default-chat-template-kwargs=''{"enable_thinking": false}'''
      description: |
        Qwen3.5 4B: the dense 4B general model of the Qwen3.5 lineage (hybrid
        Gated DeltaNet and gated attention, 262k native context) with tool
        calling, thinking and image and video understanding, Apache 2.0. Served
        as published, BF16 (8.7 GiB of weights, nothing quantized), on one 24 GB
        GPU of the L4 class: the smallest of the curated presets and the one
        with the most room — --gpu-memory-utilization=0.90 leaves about 12 GiB
        to the KV cache next to the weights (the linear-attention layers keep no
        KV cache) — 9 + 6 GiB on the fit check. 32k context, four concurrent
        requests, chunked prefill and prefix caching. Thinking is off by default
        (a request turns it on with enable_thinking), reasoning with the qwen3
        parser, tools on with the qwen3_coder parser the model card names for
        vLLM (agents always send tools, and vLLM answers 400 without
        --enable-auto-tool-choice), one image and no video per request
        (--limit-mm-per-prompt), the model's own chat template.
        Weights: an OCI model image, giantswarm/models/qwen3-5-4b at the
        checkpoint revision, pulled onto the node by containerd like any image
        (KServe's modelcar path: no download, no cache claim, every serving node
        a target); an installation serves it from a registry of its own that
        holds the same path by setting modelServing.modelImages.registry. The
        modelcar path runs the runtime as a non-root uid on a read-only image,
        so HOME, HF_HOME and VLLM_CACHE_ROOT live under /tmp.
        Sized for the smallest L4 instance, a g6.xlarge (4 vCPU, 16 GiB): the
        node's kubelet keeps about 0.6 vCPU and 2.6 GiB and the daemonsets that
        follow the pool's taint another 0.4 vCPU and 1.5 GiB, so the predictor
        requests 2 vCPU and 10 GiB and may burst to the node (4 vCPU, 12 GiB) —
        its host memory is the runtime and the weights passing through the page
        cache; the KV cache lives on the GPU. A 16 GB T4 would hold 9 + 6 GiB
        but does not host it: the card predates bf16, the checkpoint's dtype
        and what vLLM serves the Qwen3.5 hybrid layers in, and this recipe
        carries no --dtype=half — it is an L4 (and A10G) recipe.
      displayName: Qwen3.5 4B (BF16, one 24 GB GPU)
      env:
      - name: HOME
        value: /tmp
      - name: HF_HOME
        value: /tmp/hf
      - name: VLLM_CACHE_ROOT
        value: /tmp/vllm-cache
      - name: USER
        value: vllm
      - name: LOGNAME
        value: vllm
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/torchinductor
      model:
        capabilities:
        - chat
        - tools
        - reasoning
        - vision
        contextLength: 32768
        format: vLLM
        id: Qwen/Qwen3.5-4B
        license: apache-2.0
        storageUri: oci://gsoci.azurecr.io/giantswarm/models/qwen3-5-4b:851bf6e806ef
      requirements:
        minComputeCapability: "8.0"
        overheadGiB: 6
        weightsGiB: 9
      resources:
        gpus: 1
        limits:
          cpu: "4"
          memory: 12Gi
        requests:
          cpu: "2"
          memory: 10Gi
      scheduling:
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
