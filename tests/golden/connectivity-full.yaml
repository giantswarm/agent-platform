                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum by (user) (rate(agentgateway_requests_total{gateway=~\"$gateway\", route=~\"$route\", agent=~\"$caller\", user=~\"$user\"}[$__rate_interval]))",
                            "instant": false,
                            "legendFormat": "{{user}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
