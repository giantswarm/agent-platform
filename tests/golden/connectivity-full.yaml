# Source: agent-platform-connectivity/templates/kagent/flux-service-account.yaml
# Namespace-scoped admin: a RoleBinding to the built-in cluster-admin ClusterRole
# grants full control of every resource (custom resources included) within the
# kagent namespace only — an agent HelmRelease installs its Agent, the shared
# OCIRepository and the Helm release Secret there and nothing anywhere else. The
# built-in `admin` role would not do: it covers only the CRDs that aggregate
# into it, and the kagent.dev kinds do not.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kagent-flux
  namespace: kagent
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kagent-flux
    namespace: kagent
