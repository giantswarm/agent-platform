          "panel-13": {
            "kind": "Panel",
            "spec": {
              "id": 13,
              "title": "Requests, errors and time by person, over the window",
              "description": "Totals for the selected time range, per person. `Time in requests` is the sum of request durations: on the controller route, the time people spent waiting on turns.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
