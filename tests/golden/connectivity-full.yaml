    agent-platform.giantswarm.io/preset-source: "shipped"
  annotations:
    agent-platform.giantswarm.io/chart-version: "1.1.35"
data:
  preset.yaml: |
    apiVersion: agent-platform.giantswarm.io/v1alpha1
    kind: ServingPreset
    metadata:
      name: kolibri-1
    spec:
      args:
      - --gpu-memory-utilization=0.60
      - --max-model-len=262144
      - --max-num-seqs=8
      - --kv-cache-dtype=fp8
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --no-enable-log-requests
      - --reasoning-parser=kolibri1
      - --enable-auto-tool-choice
      - --tool-call-parser=kolibri1
      description: |
        Aleph Alpha's mixture of experts for German and English: 78B
        parameters, 3.5B active per token, tool calling and a reasoning mode
        (on at effort high unless a request passes reasoning_effort low, medium
        or none in chat_template_kwargs), served as Aleph Alpha's own FP8
        checkpoint (73.4 GiB of weights, 128x128 blocks, an FP8 KV cache).
        Sized for a split across two 128 GB unified-memory Blackwell nodes
        (GB10) on a fast link, tensor parallel 2: each node holds 36.9 GiB of
        weights at --gpu-memory-utilization=0.60 and a 34.8 GiB FP8 KV cache of
        6.8M tokens, about 26 full 256k contexts (40 of its 50 layers are
        sliding-window). Serve it split: on one such node the weights alone
        exceed the 0.60 share. The model's own window is 1M tokens; the preset serves 256k,
        Aleph Alpha's recommendation for serving efficiency. Tools are parsed
        with the plugin's kolibri1 parser (Hermes-style tool_call tags),
        reasoning with its kolibri1 reasoning parser, under the checkpoint's own
        chat template. Runtime: giantswarm/vllm-aleph-alpha, vLLM's own server
        image v0.29.0 with the aleph-alpha-inference plugin, the one vLLM minor
        the plugin supports; this preset names its image for that reason only.
        Weights: an OCI model image, giantswarm/models/kolibri-1 at the
        checkpoint revision, pulled onto each node by containerd (KServe's
        modelcar path: no download, no cache claim); the runtime runs as a
        non-root uid on the read-only image, so HOME, HF_HOME and
        VLLM_CACHE_ROOT live under /tmp.
      displayName: Kolibri-1 (FP8 MoE, two 128 GB GB10 nodes)
      env:
      - name: HOME
        value: /tmp
      - name: HF_HOME
        value: /tmp/hf
      - name: VLLM_CACHE_ROOT
        value: /tmp/vllm-cache
      - name: USER
        value: vllm
      - name: LOGNAME
        value: vllm
      - name: TORCHINDUCTOR_CACHE_DIR
        value: /tmp/torchinductor
      model:
        capabilities:
        - chat
        - tools
        - reasoning
        - coding
        contextLength: 262144
        format: vLLM
        id: Aleph-Alpha/Kolibri-1
        license: apache-2.0
        storageUri: oci://gsoci.azurecr.io/giantswarm/models/kolibri-1:e52eb4627d11
      requirements:
        minComputeCapability: "8.9"
        overheadGiB: 34
        weightsGiB: 74
      resources:
        gpus: 1
        limits:
          cpu: "8"
          memory: 64Gi
        requests:
          cpu: "4"
          memory: 32Gi
      scheduling:
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      template:
        containers:
        - image: gsoci.azurecr.io/giantswarm/vllm-aleph-alpha:0.5.0
