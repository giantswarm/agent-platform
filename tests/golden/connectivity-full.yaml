apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-platform-connectivity-controller
  namespace: default
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
spec:
  endpointSelector:
    # agentgateway runs as its own release; `agentgateway: agentgateway` is
    # unique to the controller, so do not scope by the connectivity release name.
    matchLabels:
      agentgateway: agentgateway
      app.kubernetes.io/name: agentgateway
  ingress:
    # xDS from data-plane pods spawned by this controller. The provisioned
    # data-plane pods carry `gateway.networking.k8s.io/gateway-name`; only the
    # controller itself carries `agentgateway: agentgateway`, so the source
    # selector here must use the gateway-name label to match the data plane.
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: agentgateway
        # Every other data plane this controller provisions — a Gateway of the
        # platform's class in any namespace, such as the serving slice's models
        # Gateway in the cluster's org namespace (#495). A namespaced policy
        # matches its own namespace only unless the namespace label is named.
        - matchLabels:
            gateway.networking.k8s.io/gateway-class-name: agentgateway
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "9978"
              protocol: TCP
    # Prometheus / health scrape from cluster monitoring.
    - fromEntities: ["cluster"]
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
            - port: "9093"
              protocol: TCP
  egress:
    - toEntities: ["kube-apiserver"]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: muster
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: coredns
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: k8s-dns-node-cache
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
