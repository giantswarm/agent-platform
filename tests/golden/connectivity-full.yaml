    app.giantswarm.io/kind: dashboard
  annotations:
    observability.giantswarm.io/organization: "Shared Org"
    observability.giantswarm.io/folder: "Agent Platform"
data:
  overview.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [
            "topic:agents"
          ],
          "targetBlank": false,
          "title": "Agent Platform boards",
          "tooltip": "",
          "type": "dashboards",
          "url": ""
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "What this is",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "The **Giant Swarm Agent Platform** runs AI agents on your own infrastructure and gives them governed access to curated tools.\n\nThis board is the entry point: is the platform healthy, and what is it doing. Every health panel reads the same series as the alert that pages for it, so a panel and a page cannot disagree.\n\n| Board | What it covers |\n|---|---|\n| **LLM usage** | tokens, cost and latency per agent and per model |\n| **Usage by person** | the same, per signed-in person |\n| **Agentgateway** | the gateway itself: requests, MCP tool calls, control-plane config distribution, runtime |\n| **Muster / MCP Gateway** | the MCP server fleet, tool calls and workflows |\n| **Klaus Gateway** | the channel front door: requests, turns and their phases, Slack streaming |\n| **Valkey** | the platform's key-value stores: memory against the limit, evictions, traffic |\n| **kagent Controller** | the kagent control plane: gRPC/A2A API surface, its reconcile loops, the controller process |\n| **mcp-kubernetes** (administrator, security, cluster operator) | the Kubernetes MCP server, where that component is on |\n\nPostgres has no board of its own: its row is below. The full CloudNativePG board lives in the Giant Swarm organization, for Giant Swarm staff.",
            "mode": "markdown"
          },
          "pluginVersion": "12.1.0",
          "title": "",
          "transparent": true,
          "type": "text"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 3,
          "panels": [],
          "title": "Component health",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Platform HelmReleases that have not been Ready. AgentPlatformHelmReleaseNotReady pages after an hour on the same series.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 10
          },
          "id": 4,
          "options": {
            "colorMode": "value",
