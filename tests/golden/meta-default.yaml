                              fi
                              sleep 2
                            done
                        env:
                          - name: HOME
                            value: /tmp
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop:
                              - ALL
