apiVersion: batch/v1
kind: Job
metadata:
  name: t-flux-operator-crds
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    agent-platform.giantswarm.io/about: "server-side apply the four Flux Operator CRDs of this chart, which Helm never upgrades from crds/"
spec:
  # kubectl waits up to 5 minutes for the deletions it requested; the Job gives
  # up after 10 and Helm's --timeout bounds the whole event. Two retries cover a
  # transient API error; a hook that still fails aborts the operation before
  # Helm deletes anything (a failed pre-delete hook leaves the release
  # `uninstalling` and the platform untouched).
  backoffLimit: 2
  activeDeadlineSeconds: 600
  # hook-succeeded removes a finished Job; a failed one is kept for an hour.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: "agent-platform"
        app.kubernetes.io/name: "agent-platform"
        app.kubernetes.io/instance: "t"
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/version: "0.1.0"
        application.giantswarm.io/team: "bumblebee"
        helm.sh/chart: "agent-platform-1.1.35"
        app.kubernetes.io/component: hooks
    spec:
      serviceAccountName: t-hooks
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubectl
          image: "gsoci.azurecr.io/giantswarm/kubectl:v1.37.1"
          args:
            - "apply"
            - "--server-side"
            - "--force-conflicts"
            - "--field-manager=agent-platform"
            - "--filename=/manifests/flux-operator.yaml"
          env:
            # kubectl keeps its discovery cache and helm its cache and config
            # under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The requests stay small: a hook is a burst of kubectl runs. The limit
          # is headroom, not a budget — one kubectl run peaks near 50 MiB, the
          # Helm CLI near 80 MiB, the decode of one release Secret near 35 MiB,
          # and nothing a hook does scales with the cluster. A hook pod was OOM-killed at
          # 128Mi three seconds into its first kubectl calls on a busy node
          # (giantswarm/agent-platform#593); 512Mi is four times that pod's
          # whole budget and is never approached in a normal run.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: manifests
              mountPath: /manifests
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: manifests
          configMap:
            name: t-flux-operator-crds
