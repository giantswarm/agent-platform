apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
spec:
  interval: 10m
  releaseName: agentgateway
  targetNamespace: default
  serviceAccountName: agent-platform-flux
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: default
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    controller:
      image:
        registry: gsoci.azurecr.io
        repository: giantswarm/agentgateway-upstream/controller
        tag: 2.3.0
      replicaCount: 2
    fullnameOverride: agentgateway-controller
    global:
      domain: ""
      gatewayApi:
        parentRefs: []
      identity:
        clientId: ""
        existingSecret: ""
        issuerUrl: ""
      imagePullSecrets: []
      observability:
        metrics:
          serviceMonitor:
            enabled: false
            interval: ""
            labels: {}
        traces:
          otlp:
            endpoint: http://otlp-gateway.kube-system.svc:4317
            headers: {}
            protocol: grpc
            tenant: giantswarm
      registry: gsoci.azurecr.io
    image:
      registry: gsoci.azurecr.io
    inferenceExtension:
      enabled: true
    monitoring:
      enabled: false
      grafanaDashboard:
        annotations:
          observability.giantswarm.io/folder: Agent Platform
          observability.giantswarm.io/organization: Shared Org
        enabled: true
        labels:
          app.giantswarm.io/kind: dashboard
      serviceMonitor:
        enabled: true
        extraLabels:
          observability.giantswarm.io/tenant: giantswarm
        interval: 60s
    podAnnotations:
      application.giantswarm.io/team: bumblebee
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    proxy:
      image:
        registry: gsoci.azurecr.io
        repository: giantswarm/agentgateway-upstream/agentgateway
        tag: 2.3.0
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
