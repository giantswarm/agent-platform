              # only after the releases whose objects are its CRs); kubectl waits for
              # helm-controller to uninstall a wave before the next one starts.
              echo "wave 1: agent-platform-connectivity dicebear model-manager valkey"
              kubectl delete helmreleases.helm.toolkit.fluxcd.io --namespace default --ignore-not-found --wait --timeout=5m agent-platform-connectivity dicebear model-manager valkey
              echo "wave 2: muster"
              kubectl delete helmreleases.helm.toolkit.fluxcd.io --namespace default --ignore-not-found --wait --timeout=5m muster
          env:
            # kubectl keeps its discovery cache and helm its cache and config
            # under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The requests stay small: a hook is a burst of kubectl runs. The limit
          # is headroom, not a budget — one kubectl run peaks near 50 MiB, the
          # Helm CLI near 80 MiB, the decode of one release Secret near 35 MiB,
          # and nothing a hook does scales with the cluster (the storage-version
          # backup reads the release Secrets one at a time and parses only a
          # manifest that names a v1alpha2 object). A hook pod was OOM-killed at
          # 128Mi three seconds into its first kubectl calls on a busy node
          # (giantswarm/agent-platform#593); 512Mi is four times that pod's
          # whole budget and is never approached in a normal run.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
