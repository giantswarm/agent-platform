  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    agent-platform.giantswarm.io/about: "write the user-supplied values of this release into the values Secret the self HelmRelease reads, and resume the self HelmRelease once the release is deployed"
spec:
  # kubectl waits up to 5 minutes for the deletions it requested; the Job gives
  # up after 10 and Helm's --timeout bounds the whole event. Two retries cover a
  # transient API error; a hook that still fails aborts the operation before
  # Helm deletes anything (a failed pre-delete hook leaves the release
  # `uninstalling` and the platform untouched).
  backoffLimit: 2
  activeDeadlineSeconds: 600
  # hook-succeeded removes a finished Job; a failed one is kept for an hour.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: "agent-platform"
        app.kubernetes.io/name: "agent-platform"
        app.kubernetes.io/instance: "t"
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/version: "0.1.0"
        application.giantswarm.io/team: "bumblebee"
        helm.sh/chart: "agent-platform-1.1.35"
        app.kubernetes.io/component: hooks
    spec:
      serviceAccountName: t-self
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sh
          image: "gsoci.azurecr.io/giantswarm/alpine-k8s:1.37.1"
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              ns="default"
              rel="t"
              secret="agent-platform-values"
              # the USER-SUPPLIED values of the revision in flight — never the merged tree
              helm get values "$rel" -n "$ns" -o yaml > /tmp/values.yaml
              if [ "$(tr -d '[:space:]' < /tmp/values.yaml)" = "null" ]; then printf '{}\n' > /tmp/values.yaml; fi
              rev=$(helm history "$rel" -n "$ns" -o json | jq -r 'map(.revision) | max')
              echo "release $ns/$rel revision $rev: writing its user-supplied values ($(wc -c < /tmp/values.yaml | tr -d ' ') bytes) into Secret $ns/$secret"
              kubectl create secret generic "$secret" -n "$ns" --from-file=values.yaml=/tmp/values.yaml --dry-run=client -o json \
                | jq --arg rel "$rel" '.metadata.labels = {"reconcile.fluxcd.io/watch": "Enabled", "app.kubernetes.io/instance": $rel, "app.kubernetes.io/component": "self-management", "app.kubernetes.io/managed-by": "agent-platform-hooks"}' \
