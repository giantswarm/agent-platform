                | kubectl apply --server-side --field-manager agent-platform-self-values --force-conflicts -f -
              # the resumer: only while the self HelmRelease is suspended (the install, the
              # upgrade into self-management); a controller-driven upgrade needs none
              suspended=$(kubectl get helmreleases.helm.toolkit.fluxcd.io "$rel" -n "$ns" -o jsonpath='{.spec.suspend}' 2>/dev/null || echo "absent")
              if [ "$suspended" = "true" ]; then
                kubectl delete jobs.batch "$rel-self-resume" -n "$ns" --ignore-not-found
                kubectl create -f - <<'EOF'
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: t-self-resume
                namespace: default
                labels:
                  app: "agent-platform"
                  app.kubernetes.io/name: "agent-platform"
                  app.kubernetes.io/instance: "t"
                  app.kubernetes.io/managed-by: "Helm"
                  app.kubernetes.io/version: "0.1.0"
                  application.giantswarm.io/team: "bumblebee"
                  helm.sh/chart: "agent-platform-1.1.35"
                  app.kubernetes.io/component: self-management
                annotations:
                  agent-platform.giantswarm.io/about: "resume the chart's own HelmRelease once the Helm release is deployed (started by the values hook)"
              spec:
                backoffLimit: 0
                activeDeadlineSeconds: 420
                ttlSecondsAfterFinished: 3600
                template:
                  metadata:
                    labels:
                      app: "agent-platform"
                      app.kubernetes.io/name: "agent-platform"
                      app.kubernetes.io/instance: "t"
                      app.kubernetes.io/managed-by: "Helm"
                      app.kubernetes.io/version: "0.1.0"
                      application.giantswarm.io/team: "bumblebee"
                      helm.sh/chart: "agent-platform-1.1.35"
                      app.kubernetes.io/component: self-management
                  spec:
                    serviceAccountName: t-self
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: sh
                        image: "gsoci.azurecr.io/giantswarm/alpine-k8s:1.37.0"
                        command: ["/bin/sh", "-eu", "-c"]
                        args:
                          - |
                            ns="default"
                            rel="t"
                            deadline=$(( $(date +%s) + 300 ))
                            while :; do
                              status=$(helm status "$rel" -n "$ns" -o json 2>/dev/null | jq -r '.info.status // "unknown"')
                              echo "$(date -u +%FT%TZ) release $ns/$rel: $status"
                              case "$status" in
                                deployed|failed)
                                  kubectl patch helmreleases.helm.toolkit.fluxcd.io "$rel" -n "$ns" --type merge -p '{"spec":{"suspend":false}}'
                                  echo "self HelmRelease $ns/$rel resumed (release $status): helm-controller adopts the release"
                                  exit 0;;
                              esac
                              if [ "$(date +%s)" -ge "$deadline" ]; then
                                echo "release $ns/$rel is still $status after 300 s: NOT resuming the self HelmRelease. Once the release is deployed, resume it by hand: kubectl -n $ns patch helmrelease $rel --type merge -p '{\"spec\":{\"suspend\":false}}'" >&2
                                exit 1
                              fi
                              sleep 2
                            done
                        env:
                          - name: HOME
                            value: /tmp
                        securityContext:
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                          capabilities:
                            drop:
                              - ALL
                        # The requests stay small: a hook is a burst of kubectl runs. The limit
                        # is headroom, not a budget — one kubectl run peaks near 50 MiB, the
                        # Helm CLI near 80 MiB, the decode of one release Secret near 35 MiB,
                        # and nothing a hook does scales with the cluster (the storage-version
                        # backup reads the release Secrets one at a time and parses only a
                        # manifest that names a v1alpha2 object). A hook pod was OOM-killed at
                        # 128Mi three seconds into its first kubectl calls on a busy node
                        # (giantswarm/agent-platform#593); 512Mi is four times that pod's
                        # whole budget and is never approached in a normal run.
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 512Mi
                        volumeMounts:
                          - name: tmp
                            mountPath: /tmp
                    volumes:
                      - name: tmp
                        emptyDir: {}
              EOF
                echo "self HelmRelease $ns/$rel is suspended: resumer Job $ns/$rel-self-resume started"
              else
                echo "self HelmRelease $ns/$rel: suspend=$suspended, no resumer needed"
              fi
          env:
            # kubectl keeps its discovery cache and helm its cache and config
            # under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The requests stay small: a hook is a burst of kubectl runs. The limit
          # is headroom, not a budget — one kubectl run peaks near 50 MiB, the
          # Helm CLI near 80 MiB, the decode of one release Secret near 35 MiB,
          # and nothing a hook does scales with the cluster (the storage-version
          # backup reads the release Secrets one at a time and parses only a
          # manifest that names a v1alpha2 object). A hook pod was OOM-killed at
          # 128Mi three seconds into its first kubectl calls on a busy node
          # (giantswarm/agent-platform#593); 512Mi is four times that pod's
          # whole budget and is never approached in a normal run.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
