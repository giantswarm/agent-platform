apiVersion: batch/v1
kind: Job
metadata:
  name: t-teardown-releases
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    agent-platform.giantswarm.io/about: "delete the platform HelmReleases in reverse dependency order while helm-controller still runs, waiting for each wave's releases to be uninstalled"
spec:
  # kubectl waits up to 5 minutes for the deletions it requested; the Job gives
  # up after 10 and Helm's --timeout bounds the whole event. Two retries cover a
  # transient API error; a hook that still fails aborts the operation before
  # Helm deletes anything (a failed pre-delete hook leaves the release
  # `uninstalling` and the platform untouched).
  backoffLimit: 2
  activeDeadlineSeconds: 600
  # hook-succeeded removes a finished Job; a failed one is kept for an hour.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: "agent-platform"
        app.kubernetes.io/name: "agent-platform"
        app.kubernetes.io/instance: "t"
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/version: "0.1.0"
        application.giantswarm.io/team: "bumblebee"
        helm.sh/chart: "agent-platform-1.1.35"
        app.kubernetes.io/component: hooks
    spec:
      serviceAccountName: t-hooks
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sh
          image: "gsoci.azurecr.io/giantswarm/alpine-k8s:1.37.0"
          command: ["/bin/sh", "-eu", "-c"]
