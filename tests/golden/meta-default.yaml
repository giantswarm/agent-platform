# Source: agent-platform/charts/flux-engine/templates/operator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-operator
  namespace: default
  labels:
    app.kubernetes.io/name: "flux-engine"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/part-of: agent-platform
    app.kubernetes.io/version: "v0.61.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "flux-engine-0.1.0"
  annotations:
    helm.sh/resource-policy: keep
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/instance: "t"
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: flux-operator
        app.kubernetes.io/instance: "t"
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/part-of: agent-platform
        app.kubernetes.io/version: "v0.61.0"
        application.giantswarm.io/team: "bumblebee"
        helm.sh/chart: "flux-engine-0.1.0"
    spec:
      serviceAccountName: flux-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "gsoci.azurecr.io/giantswarm/flux-operator:v0.61.0"
          imagePullPolicy: IfNotPresent
          args:
            - --log-level=info
          env:
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REPORTING_INTERVAL
              value: "5m"
            # 0 disables the Flux Status web server (the upstream chart's web.enabled=false).
            - name: WEB_SERVER_PORT
              value: "0"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 2000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
