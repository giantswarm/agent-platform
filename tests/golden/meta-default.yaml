      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: helm-storage-of-this-release
      expression: >-
        object.type == 'helm.sh/release.v1' && has(object.metadata.labels) &&
        'name' in object.metadata.labels && object.metadata.labels['name'] == "t"
  variables:
    - name: handBack
      expression: >-
        has(namespaceObject.metadata.annotations) &&
        "agent-platform.giantswarm.io/helm-cli" in namespaceObject.metadata.annotations &&
        namespaceObject.metadata.annotations["agent-platform.giantswarm.io/helm-cli"] == 'allow'
  validations:
    - expression: >-
        request.userInfo.username == "system:serviceaccount:default:agent-platform-flux" || variables.handBack
      reason: Forbidden
      message: >-
        release t manages itself through its bundled Flux: change values by rewriting
        Secret agent-platform-values in namespace default (key values.yaml),
        or hand the release back to the Helm CLI — annotate the namespace agent-platform.giantswarm.io/helm-cli=allow, then
        helm upgrade --set gitops.self.enabled=false --force-conflicts
