                                  echo "self HelmRelease $ns/$rel resumed (release $status): helm-controller adopts the release"
                                  exit 0;;
                              esac
                              if [ "$(date +%s)" -ge "$deadline" ]; then
                                echo "release $ns/$rel is still $status after 300 s: NOT resuming the self HelmRelease. Once the release is deployed, resume it by hand: kubectl -n $ns patch helmrelease $rel --type merge -p '{\"spec\":{\"suspend\":false}}'" >&2
