# Source: agent-platform-connectivity/templates/backstage/networkpolicy-app-cilium.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-platform-connectivity-backstage
  namespace: agent-platform
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
    app.kubernetes.io/component: backstage
spec:
  # The backstage chart labels its pods `app: <backstage.name>` and
  # `component: backstage`; `app` alone is not unique in the namespace.
  endpointSelector:
    matchLabels:
      app: backstage
      component: backstage
  ingress:
    # The route attaches to the platform's front Gateway (the Envoy edge), which
    # proxies straight to the portal's Service: agentgateway is not in this path.
    # The namespaces are the route's own parents (backstage.parentRefs, else
    # global.gatewayApi.parentRefs); `app.kubernetes.io/name: envoy` is the
    # label Envoy Gateway stamps on the proxy pods it runs for a Gateway, as
    # the oauth2-proxy policy selects them.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "7007"
              protocol: TCP
    # The kubelet's liveness and readiness probes arrive from the host entity.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "7007"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: coredns
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: k8s-dns-node-cache
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # The Kubernetes API: the portal's Clusters and Kubernetes pages, and the
    # Agent Platform pages' Flux writes, act as the caller.
    - toEntities:
        - kube-apiserver
    # The login identity provider: OIDC discovery, JWKS, userinfo and token.
    # The backend exits when discovery times out. The include also renders the
    # `cluster` entity on 443 and 10443, which is what carries the portal's
    # calls to the edge: keep both legs when it is narrowed.
    - toFQDNs:
        - matchName: dex.ci.example.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # The scaffolder catalog location (backstage.catalogs.version): the URL is on
    # github.com and the reader dials the API or the raw host, by integration.
    # Without this leg the agent create flow answers 404.
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # muster's MCP endpoint. The app-config addresses muster, the kagent
    # controller and the model manager by their public hostnames, which resolve
    # to the edge; Cilium translates that address to the edge pods, which are
    # `cluster` on 443 and 10443 — the entity leg the idpEgress include above
    # renders, and the only leg those three calls have. This leg covers a direct
    # in-cluster address for muster.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: muster
            io.kubernetes.pod.namespace: agent-platform
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
