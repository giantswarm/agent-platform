  annotations:
    observability.giantswarm.io/organization: "Shared Org"
    observability.giantswarm.io/folder: "Agent Platform"
data:
  klaus-gateway.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "klaus-gateway, the channel front door of the Agent Platform: HTTP requests, channel turns and their phases, Slack streaming.",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [
            "topic:agents"
          ],
          "targetBlank": false,
          "title": "Agent Platform boards",
          "tooltip": "",
          "type": "dashboards",
          "url": ""
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "What this is",
          "type": "row"
        },
        {
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "**klaus-gateway** is the channel front door of the Agent Platform: a message from Slack (or another channel) becomes one *turn* against a kagent agent, streamed back to the thread.\n\nEvery panel reads the `klaus_gateway_*` series the gateway's admin port serves. **Requests** is the public HTTP mux (webhooks, OBO landings, the review endpoint). **Turns** is the agent side: how many end, how they end, and how long each phase takes from the moment the message arrived. **Slack** is the streamed-reply lifecycle and the Web API's rate limiting.\n\nA turn ends `completed` or `input_required` on the happy path. Every other outcome (`failed`, `timeout`, `canceled`, `shutdown`, `*_failed`) is a turn the person did not get an answer to. The rows stay hidden on an installation without klaus-gateway.",
            "mode": "markdown"
          },
          "pluginVersion": "12.1.0",
          "title": "",
          "type": "text"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 3,
          "panels": [],
          "title": "Requests",
          "type": "row",
          "repeat": "klaus_present",
          "repeatDirection": "v"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Every request on the public mux.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": 0
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 7
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "12.1.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(rate(klaus_gateway_requests_total{cluster_id=~\"$cluster\"}[$__rate_interval]))",
              "instant": false,
              "legendFormat": "",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Requests / s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Share of 5xx answers on the public mux.",
          "fieldConfig": {
            "defaults": {
