# Source: agent-platform-connectivity/templates/backstage/app-config.yaml
# Backstage app-config layered on the image's own: the login provider from
# global.identity, one installation (backstage.installationName, default the
# release name), the matching in-cluster Kubernetes entry (the frontend mints
# the kagent token from it), the muster installation, the pg database block
# when the Backstage chart's postgresql engine is on, app.extensions limited to
# the Agent Platform pages, and the Agent Platform plugin's own block (the
# tenant identity of the agents' HelmReleases, the skill repositories, the
# kagent and model-manager API routes). The backstage chart mounts it through
# backstage.extraAppConfig; the ConfigMap name and the file name are fixed
# there. The Backstage release's pod checksums never see this ConfigMap —
# changes here reach the running pod through the config-reload hook
# (config-reload-hook.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-backstage-app-config
  namespace: agent-platform
  labels:
    app: "agent-platform-connectivity"
    app.kubernetes.io/name: "agent-platform-connectivity"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-connectivity-1.1.35"
    app.kubernetes.io/component: backstage
data:
  app-config.agent-platform.yaml: |
    app:
      title: Agent Platform
      baseUrl: https://backstage.ci.example.com
      rootRedirect: /agent-platform
      extensions:
        - page:agent-platform
        - nav-item:agent-platform
        - page:gs/clusters: false
        - nav-item:gs/clusters: false
        - page:gs/deployments: false
        - nav-item:gs/deployments: false
        - page:gs/installations: false
        - nav-item:gs/installations: false
        - page:flux: false
        - nav-item:flux: false
        - page:ai-chat: false
        - api:ai-chat/service: false
        - api:ai-chat/drawer: false
        - app-root-element:ai-chat/drawer: false
    backend:
      baseUrl: https://backstage.ci.example.com
      cors:
        origin: https://backstage.ci.example.com
      csp:
        img-src:
          - "'self'"
          - "data:"
          - https://s.giantswarm.io
          - https://avatars.ci.example.com
    catalog:
      locations:
        - type: url
          target: https://github.com/giantswarm/backstage-catalogs/blob/v0.6.0/templates/agent-deployment/template.yaml
    auth:
      environment: production
      session:
        secret: ${AUTH_SESSION_SECRET}
      providers:
        oidc-agent-platform:
          production:
            metadataUrl: https://dex.ci.example.com/.well-known/openid-configuration
            clientId: agent-platform
            clientSecret: ${AGENT_PLATFORM_OIDC_CLIENT_SECRET}
            prompt: auto
    gs:
      authProvider: oidc-agent-platform
      auth:
        extraScopes:
          - federated:id
          - audience:server:client_id:dex-k8s-authenticator
      installations:
        agent-platform:
          authProvider: oidc
          oidcTokenProvider: oidc-agent-platform
          pipeline: stable
          baseDomain: ci.example.com
          mimirEnabled: false
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: agent-platform
              url: https://kubernetes.default.svc
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              authProvider: oidc
              oidcTokenProvider: oidc-agent-platform
    muster:
      installations:
        - name: agent-platform
          url: https://muster.ci.example.com/mcp
          authProvider: oidc-agent-platform
    agentPlatform:
      skills:
        repositories:
          - https://github.com/giantswarm/agent-skills
