  annotations:
    observability.giantswarm.io/organization: "Shared Org"
    observability.giantswarm.io/folder: "Agent Platform"
data:
  usage-by-person.json: |-
    {
      "apiVersion": "dashboard.grafana.app/v2",
      "kind": "Dashboard",
      "metadata": {
        "name": "agent-platform-usage-by-person",
        "namespace": "default",
        "uid": "agent-platform-usage-by-person",
        "labels": {},
        "annotations": {
          "grafana.app/folder": ""
        }
      },
      "spec": {
        "annotations": [
          {
            "kind": "AnnotationQuery",
            "spec": {
              "query": {
                "kind": "DataQuery",
                "group": "grafana",
                "version": "v0",
                "datasource": {
                  "name": "-- Grafana --"
                },
                "spec": {}
              },
              "enable": true,
              "hide": true,
              "iconColor": "rgba(0, 211, 255, 1)",
              "name": "Annotations & Alerts",
              "builtIn": true
            }
          }
        ],
        "cursorSync": "Crosshair",
        "description": "Who uses the Agent Platform's agents, and how it goes for them: requests, errors, duration and response bytes per person on the routes agentgateway verifies a bearer on — the kagent controller route first, where one request is one agent turn (klaus-gateway for Slack, the Dev Portal, a CLI). The person is the `user` label the data plane's metrics policy adds from the verified JWT (agent-platform-connectivity, gateway.userMetricLabel). Tokens per person are not possible: the model calls carry no person, so the last row shows the models' tokens for every person together — total, cached input, uncached input, cache writes, output — and LLM usage has them by agent and model, with cost.",
        "editable": false,
        "elements": {
          "panel-10": {
            "kind": "Panel",
            "spec": {
              "id": 10,
              "title": "Errors per second by person",
              "description": "Non-2xx answers per person: an expired link or token shows up here as 401s for one person.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "sum by (user) (rate(agentgateway_requests_total{gateway=~\"$gateway\", route=~\"$route\", agent=~\"$caller\", user=~\"$user\", status!~\"2..\"}[$__rate_interval]))",
                            "instant": false,
                            "legendFormat": "{{user}}",
                            "range": true
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "timeseries",
                "version": "",
                "spec": {
                  "options": {
                    "legend": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "displayMode": "table",
                      "placement": "bottom",
                      "showLegend": true
                    },
                    "tooltip": {
                      "hideZeros": false,
                      "mode": "multi",
                      "sort": "desc"
                    }
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "reqps",
                      "decimals": 2,
                      "min": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": 0,
                            "color": "green"
                          }
                        ]
                      },
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "axisBorderShow": false,
                        "axisCenteredZero": false,
                        "axisColorMode": "text",
                        "axisLabel": "",
                        "axisPlacement": "auto",
                        "barAlignment": 0,
                        "barWidthFactor": 0.6,
                        "drawStyle": "line",
                        "fillOpacity": 30,
                        "gradientMode": "none",
                        "hideFrom": {
                          "legend": false,
                          "tooltip": false,
                          "viz": false
                        },
                        "insertNulls": false,
                        "lineInterpolation": "linear",
                        "lineWidth": 1,
                        "pointSize": 5,
                        "scaleDistribution": {
                          "type": "linear"
                        },
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "group": "A",
                          "mode": "normal"
                        },
                        "thresholdsStyle": {
                          "mode": "off"
                        }
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-11": {
            "kind": "Panel",
            "spec": {
              "id": 11,
              "title": "Request duration by person (p95)",
              "description": "The slowest turns per person. Not stacked.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
