                            "name": "${datasource}"
                          },
                          "spec": {
                            "editorMode": "code",
                            "expr": "histogram_quantile(0.95, sum by (le, user) (rate(agentgateway_request_duration_seconds_bucket{gateway=~\"$gateway\", route=~\"$route\", agent=~\"$caller\", user=~\"$user\"}[$__rate_interval])))",
