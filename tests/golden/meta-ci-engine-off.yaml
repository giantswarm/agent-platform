apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
  annotations:
    application.giantswarm.io/team: "bumblebee"
spec:
  interval: 10m
  timeout: 15m
  releaseName: substrate
  targetNamespace: ate-system
  storageNamespace: ate-system
  chartRef:
    kind: OCIRepository
    name: substrate
    namespace: default
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  dependsOn:
    - name: substrate-crds
    - name: agent-platform-connectivity
  valuesFrom:
    - kind: ConfigMap
      name: kagent-images
      optional: true
      valuesKey: substrate-values.yaml
  values:
    ateController:
      busyWorker:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      gvisorWorker:
        followRelease: true
    atelet:
      affinity: {}
      extraEnv: []
      nodeSelector: {}
      priorityClass:
        preemptionPolicy: PreemptLowerPriority
      resources:
        limits:
          cpu: "2"
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 128Mi
      storageBackend: s3
      tolerations: []
    atenetEgress:
      drainSignal:
        sizeLimit: 16Mi
      extProc:
        resources:
          limits:
            ephemeral-storage: 256Mi
          requests:
            ephemeral-storage: 16Mi
      resources:
        limits:
          ephemeral-storage: 256Mi
        requests:
          ephemeral-storage: 16Mi
    createNamespace: false
    credentialProvider:
      additionalProviders:
      - host: muster.agent-platform.svc:50051
        uriAuthority: muster.giantswarm.io
      - host: google-access-token-credential-provider.ate-system.svc:50051
        uriAuthority: google-access-token.k8s.io
      namespacePolicies:
      - allowedNamespaces:
        - kagent
        atespace: kagent
      - allowedNamespaces:
        - kagent
        atespace: ate-golden
      rbac:
        namespaces:
        - kagent
    image:
      registry: gsoci.azurecr.io
      repository: giantswarm/substrate
    images:
      awsCli: gsoci.azurecr.io/giantswarm/aws-cli:2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73
      pause: gsoci.azurecr.io/giantswarm/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
      postgres: gsoci.azurecr.io/giantswarm/postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
      rustfs: gsoci.azurecr.io/giantswarm/rustfs:1.0.0-beta.3@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358
    metrics:
      podMonitor:
        enabled: false
        labels:
          observability.giantswarm.io/tenant: giantswarm
    otel:
      endpoint: http://otlp-gateway.kube-system.svc:4317
      metrics:
        enabled: false
    podLabels:
      observability.giantswarm.io/tenant: giantswarm
    postgres:
      enabled: true
      readWriteConnectionString: ""
      schema: public
    rustfs:
      enabled: false
