            lf.a2a.v1.A2AService: []
        hostname: ""
        jwtAuthentication:
          enabled: true
          issuer: ""
          jwks:
            host: dex.giantswarm.svc.cluster.local
            path: /keys
            port: 5556
            tls:
              caSecretName: ""
              enabled: false
          mode: Strict
        mcp:
          enabled: true
          pathPrefix: /kagent/mcp
          timeout: 300
        parentRef:
          name: giantswarm-default
          namespace: envoy-gateway-system
      database:
        postgres:
          bundled:
            image:
              name: pgvector
              repository: pgvector
              tag: pg18-trixie
