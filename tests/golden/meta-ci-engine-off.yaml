        - name: KAGENT_EXTENSIONS_MACHINE_CALLER
          value: ""
        - name: KAGENT_EXTENSIONS_SESSION_READER
          value: ""
        image:
          repository: giantswarm/kagent/controller-extensions
        metrics:
          bindAddress: :8080
          enabled: true
          secureServing: false
          service:
            port: 8080
          serviceMonitor:
            enabled: false
            interval: 60s
            labels:
              observability.giantswarm.io/tenant: giantswarm
        pdb:
          enabled: true
          unhealthyPodEvictionPolicy: AlwaysAllow
        podAnnotations:
          karpenter.sh/do-not-disrupt: "true"
        resources:
          limits:
            cpu: 2
            memory: 1536Mi
          requests:
            cpu: 100m
            memory: 128Mi
        sessionIdleTTL: 336h
        substrate:
          ateApiEndpoint: dns:///api.ate-system.svc:443
          atenetRouterURL: http://atenet-router.ate-system.svc:80
          enabled: true
        vpa:
          controlledValues: RequestsOnly
          enabled: false
          maxAllowed:
            cpu: 1900m
            memory: 1280Mi
          minAllowed:
            cpu: 100m
            memory: 128Mi
          updateMode: InPlaceOrRecreate
      controllerRoute:
        enabled: false
        grpc:
          services:
            kagent.api.v1alpha1.AgentService: []
            kagent.api.v1alpha1.AgentTemplateService: []
            kagent.api.v1alpha1.HarnessService: []
            kagent.api.v1alpha1.ModelService: []
            kagent.api.v1alpha1.SessionService: []
            kagent.api.v1alpha1.SystemService: []
            lf.a2a.v1.A2AService: []
        hostname: ""
        jwtAuthentication:
          enabled: true
          issuer: ""
          jwks:
            host: dex.giantswarm.svc.cluster.local
            path: /keys
            port: 5556
            tls:
              caSecretName: ""
              enabled: false
          mode: Strict
        mcp:
          description: 'Your agent sessions on this installation, as the signed-in person:
            list them, send one a message, and checkpoint or fork them'
          displayName: Kagent
          enabled: true
          pathPrefix: /kagent/mcp
          timeout: 300
        parentRef:
          name: giantswarm-default
          namespace: envoy-gateway-system
      database:
        postgres:
          urlFile: /etc/kagent-db/uri
          vectorEnabled: true
          vectorSchema: public
      fluxServiceAccountName: kagent-flux
      fullnameOverride: kagent
      grafana-mcp:
        enabled: false
      harness:
        compaction:
          eventRetentionSize: 4
          tokenThreshold: 600000
        create: true
        env: []
        image: ""
        snapshotLocation: s3://ci-agent-snapshots/agents
        snapshotStore:
          crossplane:
            aws:
              accountId: ""
              bucketName: ""
              oidcProvider: ""
              roleName: ""
            capz:
              containerName: ""
              replicationType: LRS
              resourceGroup: ""
              storageAccountName: ""
              subscriptionId: ""
              workloadIdentity:
                identityName: ""
                oidcIssuerUrl: ""
                providerKubernetes:
                  providerConfigRef: ""
                  serviceAccount:
                    name: ""
                    namespace: crossplane
            enabled: false
            observeOnly: false
            provider: aws
            providerConfigRef: ""
            region: ""
            tags: {}
          prefix: kagent
          s3proxy:
            azure:
              account: ""
              accountKeySecretRef:
                key: ""
                name: ""
              container: ""
              endpoint: ""
            enabled: false
            image:
              repository: gsoci.azurecr.io/giantswarm/s3proxy
              tag: 4.1.1
            javaOpts: -XX:MaxRAMPercentage=70
            replicas: 2
            resources:
              limits:
                ephemeral-storage: 1Gi
                memory: 1Gi
              requests:
                cpu: 250m
                ephemeral-storage: 256Mi
                memory: 1Gi
      harnesses: []
      namespaceOverride: kagent
      oauth2-proxy:
        config:
          clientID: ""
          clientSecret: ""
          cookieSecret: ""
          existingSecret: ""
        enabled: false
        extraArgs:
          approval-prompt: auto
          cookie-refresh: 10m
          cookie-samesite: lax
          cookie-secure: true
          custom-templates-dir: /templates
          email-domain: '*'
          oidc-issuer-url: $(OIDC_ISSUER_URL)
          pass-authorization-header: true
          provider: oidc
          redirect-url: $(OIDC_REDIRECT_URL)
          reverse-proxy: true
          scope: openid profile email groups offline_access
          set-authorization-header: true
          skip-auth-regex: ^/(login|env-config\.js|favicon\.svg|assets/[^/]+\.(js|css|svg|png|woff2?))$
          skip-auth-route: ^/(health|login)$
          skip-jwt-bearer-tokens: true
          upstream: $(UPSTREAM_URL)
        extraEnv:
        - name: OIDC_ISSUER_URL
          value: ""
        - name: OIDC_REDIRECT_URL
          value: ""
        - name: UPSTREAM_URL
          value: http://kagent-ui:8080
        extraVolumeMounts:
        - mountPath: /templates
          name: custom-templates
          readOnly: true
        extraVolumes:
        - configMap:
            name: kagent-oauth2-proxy-templates
          name: custom-templates
        fullnameOverride: kagent-oauth2-proxy
        image:
          registry: gsoci.azurecr.io
          repository: giantswarm/oauth2-proxy
          tag: v7.15.5
        metrics:
          enabled: true
          serviceMonitor:
            enabled: false
            interval: 60s
            labels:
              observability.giantswarm.io/tenant: giantswarm
        namespaceOverride: kagent
        redis:
          enabled: false
        service:
          portNumber: 4180
          type: ClusterIP
        sessionStorage:
          type: cookie
      otel:
        exporter:
          otlp:
            endpoint: http://otlp-gateway.kube-system.svc:4317
            protocol: grpc
            timeout: "500"
        logs:
          enabled: false
        traces:
          enabled: false
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      registry: gsoci.azurecr.io
      remoteMcpServers: []
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
      substrateWorkerPool:
        create: true
        name: kagent-default
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
          minAvailable: null
          unhealthyPodEvictionPolicy: AlwaysAllow
        priorityClass:
          enabled: true
          name: agent-platform-worker-pool
          value: 1000000
        replicas: 4
        sandboxClass: gvisor
        template:
          nodeSelector:
            kubernetes.io/arch: amd64
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
        workerImage: ""
      ui:
        image:
          repository: giantswarm/kagent/ui
      uiRoute:
        backendTrafficPolicy:
          annotations: {}
          enabled: true
          labels: {}
          timeout: 60s
        enabled: false
        hostname: ""
        parentRef:
          name: giantswarm-default
          namespace: envoy-gateway-system
    kagent-crds:
      kmcp:
        enabled: false
      substrate:
