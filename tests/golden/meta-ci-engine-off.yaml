apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-platform-connectivity
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
spec:
  interval: 10m
  releaseName: agent-platform-connectivity
  targetNamespace: default
  chartRef:
    kind: OCIRepository
    name: agent-platform-connectivity
    namespace: default
  install:
    createNamespace: true
    disableWaitForJobs: true
    remediation:
      retries: 5
  upgrade:
    disableWaitForJobs: true
    remediation:
      retries: 5
  dependsOn:
    - name: muster
    - name: agentgateway
    - name: substrate-crds
    - name: kagent-crds
  values:
    agent-manager:
      agentChart:
        ociUrl: oci://gsoci.azurecr.io/charts/giantswarm/agent
        semver: 1.x
      fullnameOverride: agent-manager
      kagent:
        apiVersion: v1alpha3
        namespace: kagent
      mcp:
        enabled: true
      muster:
        mcpServer:
          auth:
            forwardToken: true
            requiredAudiences:
            - dex-k8s-authenticator
          enabled: true
      networkPolicy:
        enabled: false
      oauth:
        dex:
          allowPrivateURLs: true
        downstream:
          enabled: true
        enabled: true
        provider: dex
        sso:
          allowPrivateIPs: true
      skills:
        repositories:
        - https://github.com/giantswarm/agent-skills
    agent-platform-mcps:
      agentgateway:
        enabled: true
        musterUrl: http://muster.agent-platform.svc.cluster.local:8090/mcp
        viaMuster: false
      mcpServers: []
    agentManager:
      flux:
        requireApi: false
      migration:
        dryRun: false
        enabled: true
        githubToken:
          key: token
          secretName: kagent-skills-token
        gitopsNamespaces: []
        image:
          registry: gsoci.azurecr.io
          repository: giantswarm/agent-manager
          tag: 1.1.7
      networkPolicy:
        egress:
          cidrs: []
          fqdns:
          - matchPattern: '*.blob.core.windows.net'
          - matchName: api.github.com
        ingress:
          additionalPeers: []
      podDisruptionBudget:
        enabled: true
        maxUnavailable: null
        minAvailable: 1
        unhealthyPodEvictionPolicy: AlwaysAllow
      route:
        enabled: false
        hostname: ""
        jwtAuthentication:
          enabled: false
          issuer: ""
          jwks:
            host: dex.giantswarm.svc.cluster.local
            path: /keys
            port: 5556
            tls:
              caSecretName: ""
              enabled: false
          mode: Strict
        parentRef:
          name: giantswarm-default
          namespace: envoy-gateway-system
        pathPrefix: /agent-manager
    agentSandbox:
      podSecurity:
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        enabled: false
        namespace: agent-sandbox-system
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
    agentgateway:
      controller:
        image:
          repository: giantswarm/agentgateway-upstream/controller
          tag: 2.0.0
        replicaCount: 2
      fullnameOverride: agentgateway-controller
      image:
        registry: gsoci.azurecr.io
      monitoring:
        enabled: false
        grafanaDashboard:
          annotations:
            observability.giantswarm.io/folder: Agent Platform
            observability.giantswarm.io/organization: Shared Org
          enabled: true
          labels:
            app.giantswarm.io/kind: dashboard
        serviceMonitor:
          enabled: true
          extraLabels:
            observability.giantswarm.io/tenant: giantswarm
          interval: 60s
      podAnnotations:
        application.giantswarm.io/team: bumblebee
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      proxy:
        image:
          registry: gsoci.azurecr.io
          repository: giantswarm/agentgateway-upstream/agentgateway
          tag: 2.0.0
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    backstage:
      backstage:
        args:
        - --config
        - app-config.yaml
        - --config
        - app-config.production.yaml
        extraAppConfig:
        - configMapRef: agent-platform-backstage-app-config
          filename: app-config.agent-platform.yaml
        extraEnvVars:
        - name: AUTH_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              key: backstage-session-secret
              name: '{{ .Values.global.identity.existingSecret }}'
        - name: AGENT_PLATFORM_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: dex-client-secret
              name: '{{ .Values.global.identity.existingSecret }}'
        - name: NODE_EXTRA_CA_CERTS
          value: '{{ with (dig "identity" "ca" "secretName" "" .Values.global) }}/etc/agent-platform/idp-ca/{{
            dig "identity" "ca" "key" "ca.crt" $.Values.global }}{{ end }}'
        extraVolumeMounts:
        - mountPath: /etc/agent-platform/idp-ca
          name: idp-ca
          readOnly: true
        extraVolumes:
        - name: idp-ca
          secret:
            optional: true
            secretName: '{{ dig "identity" "ca" "secretName" "" .Values.global | default
              "agent-platform-idp-ca" }}'
      catalogs:
        version: v0.6.0
      configReload:
        enabled: true
        image:
          name: giantswarm/kubectl
          registry: gsoci.azurecr.io
          version: v1.37.0
      disabledExtensions:
      - page:gs/clusters
      - nav-item:gs/clusters
      - page:gs/deployments
      - nav-item:gs/deployments
      - page:gs/installations
      - nav-item:gs/installations
      - page:flux
      - nav-item:flux
      - page:ai-chat
      - api:ai-chat/service
      - api:ai-chat/drawer
      - app-root-element:ai-chat/drawer
      enabledExtensions: []
      extraScopes:
      - federated:id
      - audience:server:client_id:dex-k8s-authenticator
      hostname: ""
      ingress:
        enabled: false
      installationName: agent-platform
      parentRefs: []
      resources:
        verticalPodAutoscaler:
          enabled: false
      skillsRepositories:
      - https://github.com/giantswarm/agent-skills
      startUrlSearchParams: {}
    cloudnative-pg: {}
    components:
      agent-manager:
        enabled: true
      agent-platform-connectivity:
        enabled: true
      agent-platform-mcps:
        enabled: true
      agent-sandbox:
        enabled: true
      agentgateway:
        enabled: true
      backstage:
