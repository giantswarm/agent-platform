        value: agent-platform.giantswarm.io/organization
      - name: KAGENT_EXTENSIONS_INCLUDE_NAMESPACE
        value: kagent
      - name: KAGENT_EXTENSIONS_MACHINE_AUDIENCE
        value: kagent
      - name: KAGENT_EXTENSIONS_MACHINE_CALLER
        value: ""
      - name: KAGENT_EXTENSIONS_SESSION_READER
        value: ""
      image:
        repository: giantswarm/kagent/controller-extensions
      metrics:
        bindAddress: :8080
        enabled: true
        secureServing: false
        service:
          port: 8080
        serviceMonitor:
          enabled: false
          interval: 60s
          labels:
            observability.giantswarm.io/tenant: giantswarm
      networkPolicy:
        enabled: true
        from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: agentgateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atenet-egress
      pdb:
        enabled: true
        unhealthyPodEvictionPolicy: AlwaysAllow
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      resources:
        limits:
          cpu: 2
          memory: 1536Mi
        requests:
          cpu: 100m
          memory: 128Mi
      sessionIdleTTL: 336h
      substrate:
        ateApiEndpoint: dns:///api.ate-system.svc:443
        atenetRouterURL: http://atenet-router.ate-system.svc:80
        enabled: true
    database:
      postgres:
        urlFile: /etc/kagent-db/uri
        vectorEnabled: true
        vectorSchema: public
    fullnameOverride: kagent
    global:
      domain: ""
      gatewayApi:
        parentRefs: []
      identity:
        clientId: ""
        existingSecret: ""
        issuerUrl: https://dex.ci.example.com
      imagePullSecrets: []
      observability:
        metrics:
          serviceMonitor:
            enabled: false
            interval: ""
            labels: {}
        traces:
          otlp:
            endpoint: http://otlp-gateway.kube-system.svc:4317
            headers: {}
            protocol: grpc
            tenant: giantswarm
      registry: gsoci.azurecr.io
    grafana-mcp:
      enabled: false
    harness:
      compaction:
        eventRetentionSize: 4
        tokenThreshold: 600000
      create: true
      env: []
      snapshotLocation: s3://ci-agent-snapshots/agents
    harnesses: []
    namespaceOverride: kagent
    oauth2-proxy:
      config:
        clientID: ""
        clientSecret: ""
        cookieSecret: ""
        existingSecret: ""
      enabled: false
      extraArgs:
        approval-prompt: auto
        cookie-refresh: 10m
        cookie-samesite: lax
        cookie-secure: true
        custom-templates-dir: /templates
        email-domain: '*'
        oidc-issuer-url: $(OIDC_ISSUER_URL)
        pass-authorization-header: true
        provider: oidc
        redirect-url: $(OIDC_REDIRECT_URL)
        reverse-proxy: true
        scope: openid profile email groups offline_access
        set-authorization-header: true
        skip-auth-regex: ^/(login|env-config\.js|favicon\.svg|assets/[^/]+\.(js|css|svg|png|woff2?))$
        skip-auth-route: ^/(health|login)$
        skip-jwt-bearer-tokens: true
        upstream: $(UPSTREAM_URL)
      extraEnv:
      - name: OIDC_ISSUER_URL
        value: ""
      - name: OIDC_REDIRECT_URL
        value: ""
      - name: UPSTREAM_URL
        value: http://kagent-ui:8080
      extraVolumeMounts:
      - mountPath: /templates
        name: custom-templates
        readOnly: true
      extraVolumes:
      - configMap:
          name: kagent-oauth2-proxy-templates
        name: custom-templates
      fullnameOverride: kagent-oauth2-proxy
      image:
        registry: gsoci.azurecr.io
        repository: giantswarm/oauth2-proxy
        tag: v7.15.5
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
          interval: 60s
          labels:
            observability.giantswarm.io/tenant: giantswarm
      namespaceOverride: kagent
      redis:
        enabled: false
      service:
        portNumber: 4180
        type: ClusterIP
      sessionStorage:
        type: cookie
    otel:
      exporter:
        otlp:
          endpoint: http://otlp-gateway.kube-system.svc:4317
          protocol: grpc
          timeout: "500"
      logs:
        enabled: false
      traces:
        enabled: false
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    providers: false
    registry: gsoci.azurecr.io
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    substrateWorkerPool:
      create: true
      name: kagent-default
      replicas: 4
      sandboxClass: gvisor
      template:
        nodeSelector:
          kubernetes.io/arch: amd64
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: atelet
              namespaces:
              - ate-system
              topologyKey: kubernetes.io/hostname
            weight: 100
        priorityClassName: agent-platform-worker-pool
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
      workerImage: gsoci.azurecr.io/giantswarm/substrate/ateom-gvisor:1.18.0
    ui:
      image:
        repository: giantswarm/kagent/ui
