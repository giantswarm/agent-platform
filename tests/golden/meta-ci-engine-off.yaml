apiVersion: batch/v1
kind: Job
metadata:
  name: t-kagent-storage-version-restore
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    agent-platform.giantswarm.io/about: "re-create the recorded ModelConfigs no Helm release owned at kagent.dev/v1alpha3 once kagent-crds serves it; the chart-rendered ones come back from their releases"
spec:
  # kubectl waits up to 5 minutes for the deletions it requested; the Job gives
  # up after 10 and Helm's --timeout bounds the whole event. Two retries cover a
  # transient API error; a hook that still fails aborts the operation before
  # Helm deletes anything (a failed pre-delete hook leaves the release
  # `uninstalling` and the platform untouched).
  backoffLimit: 2
  activeDeadlineSeconds: 600
  # hook-succeeded removes a finished Job; a failed one is kept for an hour.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: "agent-platform"
        app.kubernetes.io/name: "agent-platform"
        app.kubernetes.io/instance: "t"
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/version: "0.1.0"
        application.giantswarm.io/team: "bumblebee"
        helm.sh/chart: "agent-platform-1.1.35"
        app.kubernetes.io/component: hooks
    spec:
      serviceAccountName: t-hooks
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sh
          image: "gsoci.azurecr.io/giantswarm/alpine-k8s:1.37.0"
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              ns="kagent"
              cm="kagent-storage-version-migration"
              crd="modelconfigs.kagent.dev"
              version="v1alpha3"
              kubectl get configmap "$cm" -n "$ns" -o json --ignore-not-found > /tmp/cm.json
              if [ ! -s /tmp/cm.json ]; then
                echo "no ConfigMap $ns/$cm: nothing was recorded, nothing to restore"
                exit 0
              fi
              restored="$(jq -r '.data["restored-at"] // ""' /tmp/cm.json)"
              if [ -n "$restored" ]; then
                echo "ConfigMap $ns/$cm: restored at $restored; nothing to do (the record stays until it is deleted)"
                exit 0
              fi
              for k in remotemcpservers modelproviderconfigs; do
                n="$(jq -r --arg k "$k.json" '.data[$k] // "[]" | fromjson | length' /tmp/cm.json)"
                [ "$n" = 0 ] || echo "recorded, not restored: $n $k (the 4.x charts render their own; the record is $ns/$cm)"
              done
              jq -r '.data["modelconfigs.json"] // "[]"' /tmp/cm.json > /tmp/modelconfigs.json
              jq -c '[.[] | select(.metadata.annotations["meta.helm.sh/release-name"] == null)]' /tmp/modelconfigs.json > /tmp/unowned.json
              total="$(jq length /tmp/modelconfigs.json)"
              n="$(jq length /tmp/unowned.json)"
              echo "$total ModelConfigs recorded, $n owned by no Helm release (the other $((total - n)) come back from their releases)"
              if [ "$n" -gt 0 ]; then
                deadline=$(( $(date +%s) + 480 ))
                while :; do
                  state="$(kubectl get customresourcedefinitions.apiextensions.k8s.io "$crd" -o jsonpath='{.status.conditions[?(@.type=="Established")].status} {.spec.versions[*].name}' --ignore-not-found)"
                  case "$state" in True*"$version"*) break ;; esac
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "$crd is not Established serving $version after 480 s (${state:-absent}): the kagent-crds release has not installed it; the record stays, the next upgrade retries" >&2
                    exit 1
                  fi
                  echo "$(date -u +%FT%TZ) waiting for $crd to be Established serving $version (${state:-absent})"
                  sleep 10
                done
              fi
              i=0; created=0; present=0
              while [ "$i" -lt "$n" ]; do
                jq -c --arg v "kagent.dev/$version" --argjson i "$i" '.[$i] | {apiVersion: $v, kind, metadata: (.metadata | {name, namespace, labels, annotations} | with_entries(select(.value != null))), spec}' /tmp/unowned.json > /tmp/obj.json
                ref="$(jq -r '"\(.metadata.namespace)/\(.metadata.name)"' /tmp/obj.json)"
                if out="$(kubectl create -f /tmp/obj.json 2>&1)"; then
                  echo "ModelConfig $ref: re-created at kagent.dev/$version"; created=$((created + 1))
                else
                  case "$out" in
                    *AlreadyExists*) echo "ModelConfig $ref: already present (re-created by its owner)"; present=$((present + 1)) ;;
                    *) echo "ModelConfig $ref: $out" >&2; exit 1 ;;
                  esac
                fi
                i=$((i + 1))
              done
              kubectl patch configmap "$cm" -n "$ns" --type merge -p "{\"data\":{\"restored-at\":\"$(date -u +%FT%TZ)\"}}"
              echo "restored: $created re-created, $present already present, $((total - n)) chart-owned left to their releases; the record $ns/$cm stays (UPGRADE.md says when to delete it)"
          env:
            # kubectl keeps its discovery cache and helm its cache and config
            # under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The requests stay small: a hook is a burst of kubectl runs. The limit
          # is headroom, not a budget — one kubectl run peaks near 50 MiB, the
          # Helm CLI near 80 MiB, the decode of one release Secret near 35 MiB,
          # and nothing a hook does scales with the cluster (the storage-version
          # backup reads the release Secrets one at a time and parses only a
          # manifest that names a v1alpha2 object). A hook pod was OOM-killed at
          # 128Mi three seconds into its first kubectl calls on a busy node
          # (giantswarm/agent-platform#593); 512Mi is four times that pod's
          # whole budget and is never approached in a normal run.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
