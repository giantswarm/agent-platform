apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-manager
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
spec:
  interval: 10m
  releaseName: agent-manager
  targetNamespace: default
  chartRef:
    kind: OCIRepository
    name: agent-manager
    namespace: default
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: muster
    - name: kagent
  values:
    agentChart:
      ociUrl: oci://gsoci.azurecr.io/charts/giantswarm/agent
      semver: '>=2.0.0 <3.0.0'
    flux:
      helmReleaseServiceAccount: kagent-flux
    fullnameOverride: agent-manager
    global:
      domain: ""
      gatewayApi:
        parentRefs: []
      identity:
        clientId: ""
        existingSecret: ""
        issuerUrl: ""
      imagePullSecrets: []
      observability:
        metrics:
          serviceMonitor:
            enabled: false
            interval: ""
            labels: {}
        traces:
          otlp:
            endpoint: http://otlp-gateway.kube-system.svc:4317
            headers: {}
            protocol: grpc
            tenant: giantswarm
      registry: gsoci.azurecr.io
    kagent:
      apiVersion: v1alpha3
      controllerTarget: ""
      namespace: kagent
    mcp:
      enabled: true
    muster:
      mcpServer:
        auth:
          forwardToken: true
          requiredAudiences:
          - dex-k8s-authenticator
        enabled: true
      url: http://muster.default.svc.cluster.local:8090/mcp
    networkPolicy:
      enabled: false
    oauth:
      dex:
        allowPrivateURLs: true
      downstream:
        enabled: true
      enabled: true
      provider: dex
      sso:
        allowPrivateIPs: true
    observability:
      otel:
        endpoint: http://otlp-gateway.kube-system.svc:4317
        headers: X-Scope-OrgID=giantswarm
        protocol: grpc
    serviceMonitor:
      enabled: false
      interval: 60s
      labels:
        observability.giantswarm.io/tenant: giantswarm
    skills:
      repositories:
      - https://github.com/giantswarm/agent-skills
