              replicationType: LRS
              resourceGroup: ""
              storageAccountName: ""
              subscriptionId: ""
              workloadIdentity:
                identityName: ""
                oidcIssuerUrl: ""
                providerKubernetes:
                  providerConfigRef: ""
                  serviceAccount:
                    name: ""
                    namespace: crossplane
            enabled: false
            observeOnly: false
            provider: aws
            providerConfigRef: ""
            region: ""
            tags: {}
          prefix: kagent
          s3proxy:
            azure:
              account: ""
              accountKeySecretRef:
                key: ""
                name: ""
              container: ""
              endpoint: ""
            enabled: false
            image:
              repository: gsoci.azurecr.io/giantswarm/s3proxy
              tag: 4.1.1
            javaOpts: -XX:MaxRAMPercentage=70
            replicas: 2
            resources:
              limits:
                ephemeral-storage: 1Gi
                memory: 1Gi
              requests:
                cpu: 250m
                ephemeral-storage: 256Mi
                memory: 1Gi
      harnesses: []
      kagent-tools:
        enabled: false
        namespaceOverride: kagent
      kmcp:
        enabled: false
        namespaceOverride: kagent
      modelConfigs: []
      namespaceOverride: kagent
      oauth2-proxy:
