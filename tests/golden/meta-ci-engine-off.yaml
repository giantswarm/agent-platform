# Source: agent-platform/templates/hooks/kagent-crds-storage-version.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: t-kagent-storage-version-backup
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-7"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    agent-platform.giantswarm.io/about: "record the objects of the kagent CRDs still stored at v1alpha2 (modelconfigs, modelproviderconfigs, remotemcpservers) into the migration ConfigMap, stop the HelmRelease that applied them from applying them again (crds: Skip) and delete those CRDs, so kagent-crds installs them at v1alpha3"
spec:
  # kubectl waits up to 5 minutes for the deletions it requested; the Job gives
  # up after 10 and Helm's --timeout bounds the whole event. Two retries cover a
  # transient API error; a hook that still fails aborts the operation before
  # Helm deletes anything (a failed pre-delete hook leaves the release
  # `uninstalling` and the platform untouched).
  backoffLimit: 2
  activeDeadlineSeconds: 600
  # hook-succeeded removes a finished Job; a failed one is kept for an hour.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: "agent-platform"
        app.kubernetes.io/name: "agent-platform"
        app.kubernetes.io/instance: "t"
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/version: "0.1.0"
        application.giantswarm.io/team: "bumblebee"
        helm.sh/chart: "agent-platform-1.1.35"
        app.kubernetes.io/component: hooks
    spec:
      serviceAccountName: t-hooks
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sh
          image: "gsoci.azurecr.io/giantswarm/alpine-k8s:1.37.0"
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              ns="kagent"
              cm="kagent-storage-version-migration"
              rel="t"
              stale="v1alpha2"
              mkdir -p /tmp/record
              recorded=0
              for crd in modelconfigs.kagent.dev modelproviderconfigs.kagent.dev remotemcpservers.kagent.dev; do
                stored="$(kubectl get customresourcedefinitions.apiextensions.k8s.io "$crd" -o jsonpath='{.status.storedVersions}' --ignore-not-found)"
                case "$stored" in
                  "") echo "$crd: absent; nothing to migrate"; continue ;;
                  *"\"$stale\""*) ;;
                  *) echo "$crd: stores $stored, no $stale; left as it is"; continue ;;
                esac
                kubectl get "$crd" -A -o json > /tmp/raw.json
                jq -c '[.items[] | del(.status, .metadata.managedFields, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation)]' /tmp/raw.json > "/tmp/record/${crd%%.*}.json"
                echo "$crd: stores $stored: $(jq length "/tmp/record/${crd%%.*}.json") objects recorded"
                recorded=$((recorded + 1))
              done
              if [ "$recorded" -eq 0 ]; then
                echo "no kagent CRD stores $stale: nothing to migrate"
              else
                # the record, written before anything is deleted: one ConfigMap in the kagent
                # namespace, replaced whole on every run that records (a fresh record per
                # migration; a run that finds nothing at v1alpha2 leaves it alone)
                kubectl create configmap "$cm" -n "$ns" --from-file=/tmp/record --dry-run=client -o json > /tmp/cm-raw.json
                jq --arg at "$(date -u +%FT%TZ)" --arg rel "$rel" '.data["recorded-at"] = $at | .metadata.labels = {"app.kubernetes.io/instance": $rel, "app.kubernetes.io/component": "kagent-storage-version-migration", "app.kubernetes.io/managed-by": "agent-platform-hooks"}' /tmp/cm-raw.json > /tmp/cm.json
                kubectl delete configmap "$cm" -n "$ns" --ignore-not-found
                kubectl create -f /tmp/cm.json
                echo "recorded into ConfigMap $ns/$cm ($(wc -c < /tmp/cm.json | tr -d ' ') bytes)"
                # the owners first (giantswarm/agent-platform#416): the HelmRelease a CRD's
                # helm.toolkit.fluxcd.io labels name applied it through its crds policy and
                # re-applies its chart's crds/ on every retry — Skip on both events, before
                # the CRD goes; the meta upgrade's manifest carries no crds policy for the
                # kagent release: a client-side apply (helm-controller) drops the patch, a
                # server-side one leaves it on a release whose 4.x chart has no crds/
                : > /tmp/owners.txt
                for f in /tmp/record/*.json; do
                  crd="$(basename "$f" .json).kagent.dev"
                  kubectl get customresourcedefinitions.apiextensions.k8s.io "$crd" -o jsonpath='{.metadata.labels.helm\.toolkit\.fluxcd\.io/namespace}|{.metadata.labels.helm\.toolkit\.fluxcd\.io/name}{"\n"}' >> /tmp/owners.txt
                done
                sort -u /tmp/owners.txt | while IFS='|' read -r ons oname; do
                  [ -n "$oname" ] || continue
                  if [ -z "$ons" ]; then echo "HelmRelease $oname (no helm.toolkit.fluxcd.io/namespace label): cannot be reached; the watch below catches a re-creation"; continue; fi
                  policy="$(kubectl get helmreleases.helm.toolkit.fluxcd.io -n "$ons" "$oname" -o jsonpath='{.spec.install.crds}/{.spec.upgrade.crds}' --ignore-not-found)"
                  if [ -z "$policy" ]; then echo "HelmRelease $ons/$oname (named by the CRDs' labels) is gone; nothing to stop"; continue; fi
                  kubectl patch helmreleases.helm.toolkit.fluxcd.io -n "$ons" "$oname" --type merge -p '{"spec":{"install":{"crds":"Skip"},"upgrade":{"crds":"Skip"}}}' >/dev/null
                  echo "HelmRelease $ons/$oname applied the CRDs (install/upgrade crds policy $policy): set to Skip/Skip so it cannot re-apply them; this upgrade's manifest carries no crds policy for it (inert on the 4.x chart if the apply keeps the patch)"
                done
                for f in /tmp/record/*.json; do
                  crd="$(basename "$f" .json).kagent.dev"
                  kubectl delete customresourcedefinitions.apiextensions.k8s.io "$crd" --wait --timeout=3m
                  echo "$crd deleted, its objects with it; kagent-crds installs it at v1alpha3"
                done
                # they stay gone: 60 s of checks (a reconcile of the owner in flight when
                # the patch landed applies its crds/ once more); one that comes back is
                # deleted again and fails the hook naming the owner — Flux retries the
                # upgrade, the next backup finds the CRDs absent
                deadline=$(( $(date +%s) + 60 ))
                while :; do
                  back=""
                  for f in /tmp/record/*.json; do
                    crd="$(basename "$f" .json).kagent.dev"
                    state="$(kubectl get customresourcedefinitions.apiextensions.k8s.io "$crd" -o jsonpath='{.metadata.creationTimestamp} by HelmRelease {.metadata.labels.helm\.toolkit\.fluxcd\.io/namespace}/{.metadata.labels.helm\.toolkit\.fluxcd\.io/name} (labels {.metadata.labels})' --ignore-not-found)"
                    [ -n "$state" ] || continue
                    back="$back $crd"
                    echo "$crd re-created at $state" >&2
                    kubectl delete customresourcedefinitions.apiextensions.k8s.io "$crd" --wait --timeout=3m
                  done
                  if [ -n "$back" ]; then
                    echo "re-created after the backup deleted them:$back — deleted again; something still applies the 0.x kagent CRDs (the HelmRelease named above: suspend it or fix its values), then reconcile this release again — the record $ns/$cm is kept and the next backup finds the CRDs absent" >&2
                    exit 1
                  fi
                  [ "$(date +%s)" -lt "$deadline" ] || break
                  sleep 5
                done
                echo "the deleted CRDs stayed absent for 60 s"
              fi
              # on every run: the Helm release manifests that still name the three kinds at v1alpha2
              kinds='(^|\n)kind: (ModelConfig|ModelProviderConfig|RemoteMCPServer)\n'
              rewritten=0
              # the server-side Table (NAMESPACE NAME TYPE DATA AGE): names only, no payload
              kubectl get secrets -A -l owner=helm --field-selector type=helm.sh/release.v1 --no-headers --chunk-size=100 | awk '{print $1, $2}' > /tmp/releases.txt
              while read -r sns sname; do
                [ -n "$sname" ] || continue
                kubectl get secret -n "$sns" "$sname" -o jsonpath='{.data.release}' > /tmp/release.b64
                base64 -d < /tmp/release.b64 | base64 -d | gzip -dc > /tmp/release.json
                # a manifest that names an object at v1alpha2, not a release that merely
                # mentions the version (this chart's own hook script, stored under .hooks[])
                grep -qF 'apiVersion: kagent.dev/v1alpha2\n' /tmp/release.json || continue
                n="$(jq -r --arg k "$kinds" '[.manifest | split("\n---\n")[] | select(test($k) and test("apiVersion: kagent.dev/v1alpha2\n"))] | length' /tmp/release.json)"
                [ "$n" -gt 0 ] || continue
                jq --arg k "$kinds" '.manifest |= (split("\n---\n") | map(if test($k) then gsub("apiVersion: kagent.dev/v1alpha2\n"; "apiVersion: kagent.dev/v1alpha3\n") else . end) | join("\n---\n"))' /tmp/release.json > /tmp/release-new.json
                printf '{"data":{"release":"%s"}}' "$(gzip -c /tmp/release-new.json | base64 | tr -d '\n' | base64 | tr -d '\n')" > /tmp/release-patch.json
                kubectl patch secret -n "$sns" "$sname" --type merge --patch-file /tmp/release-patch.json >/dev/null
                echo "release $sns/$(jq -r .name /tmp/release.json) revision $(jq -r .version /tmp/release.json): $n objects re-pointed to kagent.dev/v1alpha3 in Helm's stored manifest (Helm reads it back through a served version on the next upgrade)"
                rewritten=$((rewritten + 1))
              done < /tmp/releases.txt
              echo "$(wc -l < /tmp/releases.txt | tr -d ' ') Helm release Secrets scanned, $rewritten re-pointed"
          env:
            # kubectl keeps its discovery cache and helm its cache and config
            # under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The requests stay small: a hook is a burst of kubectl runs. The limit
          # is headroom, not a budget — one kubectl run peaks near 50 MiB, the
          # Helm CLI near 80 MiB, the decode of one release Secret near 35 MiB,
          # and nothing a hook does scales with the cluster (the storage-version
          # backup reads the release Secrets one at a time and parses only a
          # manifest that names a v1alpha2 object). A hook pod was OOM-killed at
          # 128Mi three seconds into its first kubectl calls on a busy node
          # (giantswarm/agent-platform#593); 512Mi is four times that pod's
          # whole budget and is never approached in a normal run.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
