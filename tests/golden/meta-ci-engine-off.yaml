apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-platform-mcps
  namespace: default
  labels:
    app: "agent-platform"
    app.kubernetes.io/name: "agent-platform"
    app.kubernetes.io/instance: "t"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/version: "0.1.0"
    application.giantswarm.io/team: "bumblebee"
    helm.sh/chart: "agent-platform-1.1.35"
spec:
  interval: 10m
  releaseName: agent-platform-mcps
  targetNamespace: default
  chartRef:
    kind: OCIRepository
    name: agent-platform-mcps
    namespace: default
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  dependsOn:
    - name: muster
    - name: agentgateway
  values:
    agentgateway:
      enabled: true
      musterUrl: http://muster.agent-platform.svc.cluster.local:8090/mcp
      viaMuster: true
    mcpServers: []
