        repository: giantswarm/kagent/golang-adk
      auth:
        issuer: https://dex.ci.example.com
        jwksAllowHTTP: true
        jwksURL: http://dex.giantswarm.svc.cluster.local:5556/keys
        mode: trusted-proxy
        userIdClaim: email
      authorization:
        groupsClaim: groups
        groupsPrefix: ""
        includeNamespaces:
        - kagent
        mode: kubernetes
        namespaceSelector: agent-platform.giantswarm.io/organization
        usernamePrefix: ""
      env:
      - name: KAGENT_EXTENSIONS_OIDC_ISSUERS
        value: '[{"issuer":"https://dex.ci.example.com","jwksURL":"http://dex.giantswarm.svc.cluster.local:5556/keys"}]'
      - name: KAGENT_EXTENSIONS_OIDC_USERNAME_CLAIM
        value: email
      - name: KAGENT_EXTENSIONS_OIDC_GROUPS_CLAIM
        value: groups
      - name: KAGENT_EXTENSIONS_OIDC_USERNAME_PREFIX
