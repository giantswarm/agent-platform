# The predictor pod KServe's InferenceService controller (raw deployment mode)
# creates in the serving namespace for the preset qwen3-8b-fp8: the label
# serving.kserve.io/inferenceservice=<name> every classic predictor carries,
# the runtime container `kserve-container`, and the storage-initializer KServe
# injects for an hf:// storageUri, downloading into the kserve-provision-location
# emptyDir at /mnt/models, where the runtime reads it read-only, at KServe's
# default 1Gi memory limit. Reduced to what the model-serving policies read and
# patch (tests/verify-model-serving-policies.py).
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-8b-fp8-predictor-6c8d9b7f4c-p7m2z
  namespace: model-serving
  labels:
    app: isvc.qwen3-8b-fp8-predictor
    component: predictor
    serving.kserve.io/inferenceservice: qwen3-8b-fp8
    pod-template-hash: 6c8d9b7f4c
spec:
  runtimeClassName: nvidia
  initContainers:
    - name: storage-initializer
      image: gsoci.azurecr.io/giantswarm/kserve-storage-initializer:v0.20.0
      args:
        - hf://Qwen/Qwen3-8B-FP8
        - /mnt/models
      env:
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        - name: HF_XET_HIGH_PERFORMANCE
          value: "1"
        - name: HF_XET_NUM_CONCURRENT_RANGE_GETS
          value: "8"
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 100Mi
      volumeMounts:
        - name: kserve-provision-location
          mountPath: /mnt/models
  containers:
    - name: kserve-container
      image: docker.io/vllm/vllm-openai:v0.11.0
      command:
        - /bin/sh
        - -c
        - 'eval "exec vllm serve $@"'
        - "--"
      args:
        - --model=/mnt/models
        - --served-model-name=qwen3-8b-fp8
        - --port=8080
      env:
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        - name: VLLM_CONFIG_ROOT
          value: /tmp
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        limits:
          cpu: "4"
          memory: 12Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 10Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: kserve-provision-location
          mountPath: /mnt/models
          readOnly: true
  volumes:
    - name: kserve-provision-location
      emptyDir: {}
