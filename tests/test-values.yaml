# Values of the ATS kind smoke (tests/ats/test_smoke.py; .ats/main.yaml) — the
# shape the chart installs on a bare kind cluster with `helm install --wait`:
# the bundled Flux engine on (the default) and the minimal component set that
# needs nothing but the Gateway API CRDs the smoke pre-applies — muster, dicebear
# and the connectivity wiring, the bundled valkey off, muster without its own
# OAuth server, no network policies (Cilium is environment infra). The
# cluster-shape knobs left at `auto` resolve the rest on kind: no Kyverno
# objects, no monitor objects, no Envoy-only avatar route. The routes name a
# Gateway that does not exist on kind — an unattached HTTPRoute is fine, the
# releases are Ready without it. Also the third fleet-render shape of the fleet
# diff (BRIEF (c)), so keep the component set and every key here deliberate.
#
# Self-management is OFF here (the lab shape): the chart under test is an
# UNRELEASED archive, and a self HelmRelease following the published range would
# replace it with the published chart mid-test. agentlab installs the same way.
# The smoke asserts the shape renders none of it (no self OCIRepository /
# HelmRelease, no values Secret, no admission policy); self-management against a
# published chart is a separate scenario.
gitops:
  self:
    enabled: false

ingress:
  mode: muster-direct
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

networkPolicy:
  enabled: false

# The kagent API v2 cut-over Job (agentManager.migration, on by default with
# kagent and agent-manager on) runs `agent-manager migrate` (agent-manager
# 1.1.0). Off here: the bare smoke serves no live kagent API v2 for migrate to
# act on, so the Job would only report "v2 not served"; the migration rehearsal
# (agentlab#143) is the Job's proof, not this smoke.
agentManager:
  migration:
    enabled: false

components:
  valkey:
    enabled: false

muster:
  networkPolicy:
    enabled: false
  muster:
    oauth:
      server:
        enabled: false
