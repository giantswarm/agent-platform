# app-test-suite (ATS >= 1.0) config, consumed by the generated
# `run-tests-with-ats` CircleCI job (execute-chart-tests). The job creates the
# kind cluster and hands ATS its kubeconfig; helm and kubectl come with the ATS
# image; the chart archive under test is copied to the working directory.
#
# The smoke (tests/ats/test_smoke.py) installs the chart itself: the chart
# needs the Gateway API CRDs first, so ATS's own pre-test deploy is skipped and
# the test runs `helm install --wait` of the candidate archive with
# tests/test-values.yaml after applying them — the quick start's order and the
# quick start's Helm CLI path. The values are the kind shape: the bundled Flux
# engine on (the default), muster + dicebear + the connectivity wiring, valkey
# and everything that needs a CRD family kind does not have off. The smoke
# asserts what `helm install --wait` promises — the release `deployed`, the
# FluxInstance Ready, every component HelmRelease Ready, one Helm revision —
# then the ordered teardown (`helm uninstall --wait` clean in under a minute,
# no Flux CRD left, the operator CRDs still there) and a clean reinstall.
#
# functional and upgrade stay skipped: there is no second scenario yet (the
# agent round trips arrive with the self-management slice), and the upgrade
# from the last published chart is not a kind smoke's job here.
app-tests-app-config-file: tests/test-values.yaml
app-tests-deploy-namespace: agent-platform
app-tests-skip-app-deploy: true

skip-steps: [functional,upgrade]
