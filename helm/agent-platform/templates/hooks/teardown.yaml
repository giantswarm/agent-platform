{{- /*
The ordered teardown (only with the bundled engine). Helm deletes a release's
objects in one kind-sorted pass, and it builds every object of that pass before
deleting any: a manifest whose kind is no longer served fails the whole delete,
leaving the release `uninstalling` (giantswarm/agent-platform#708). The engine's
controllers and Flux's CRDs therefore stay until Helm's pass is over:
  pre-delete, weight 0   delete the platform HelmReleases this chart rendered —
            by name, in gitops.namespace (the release namespace with the engine
            on), in reverse dependency order: waves computed from the roster's
            dependsOn (agent-platform.teardownWaves), each wave's releases
            concurrently, the next wave once helm-controller has uninstalled
            the last of them — so a CRD chart's release (kagent-crds,
            substrate-crds) goes only after the releases whose objects are its
            CRs; a Helm uninstall cannot delete an object whose kind is already
            gone and helm-controller would retry it until this hook times out;
  Helm's pass  removes the rest of the release — the OCIRepositories (source-
            controller still runs and clears their finalizers), the tenant
            identity, the operator's Service — but not the FluxInstance and the
            operator's Deployment, ServiceAccount and ClusterRoleBinding: they
            carry helm.sh/resource-policy: keep (the flux-engine subchart), so
            Helm neither builds nor deletes them;
  post-delete, weight 0  delete the FluxInstance and wait for the operator to
            uninstall Flux, CRDs included, which takes every remaining
            HelmRelease object (the agents' included) with it; their workloads
            and Helm storage stay;
  post-delete, weight 5  delete the operator's Deployment, ServiceAccount and
            ClusterRoleBinding.
Every step tolerates objects that are already gone (--ignore-not-found), so a
retried uninstall completes. Without the engine (a cluster's own Flux) none of
this applies: that Flux finalizes the platform HelmReleases, and this chart
never touches it.
*/ -}}
{{- if eq (include "agent-platform.engineEnabled" .) "true" }}
{{- $ns := .Values.gitops.namespace | default .Release.Namespace }}
{{ include "agent-platform.hooks.job" (dict "root" . "name" "teardown-releases" "hook" "pre-delete" "weight" 0
      "image" (include "agent-platform.hooks.helmImage" .)
      "about" "delete the platform HelmReleases in reverse dependency order while helm-controller still runs, waiting for each wave's releases to be uninstalled"
      "script" (include "agent-platform.teardownScript" .)) }}
---
{{ include "agent-platform.hooks.job" (dict "root" . "name" "teardown-engine" "hook" "post-delete" "weight" 0
      "about" "delete the FluxInstance, kept through Helm's pass, while the operator still runs, and wait for it to uninstall Flux and its CRDs"
      "args" (list "delete" "fluxinstances.fluxcd.controlplane.io" "--namespace" .Release.Namespace "flux" "--ignore-not-found" "--wait" "--timeout=5m")) }}
---
{{ include "agent-platform.hooks.job" (dict "root" . "name" "teardown-operator" "hook" "post-delete" "weight" 5
      "about" "delete the Flux Operator, kept through Helm's pass, once it has uninstalled Flux"
      "args" (list "delete" "--namespace" .Release.Namespace "deployments.apps/flux-operator" "serviceaccounts/flux-operator" "clusterrolebindings.rbac.authorization.k8s.io/agent-platform-flux-operator" "--ignore-not-found" "--wait" "--timeout=2m")) }}
{{- end }}
