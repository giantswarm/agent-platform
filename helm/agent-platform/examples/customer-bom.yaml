# =============================================================================
# Customer bill-of-materials (example overlay).
#
# Every component version pinned to an exact, dogfood-tested version. Overlays
# values.yaml: `helm install ... -f examples/customer-bom.yaml`. This file IS the
# "product release" — generated by snapshotting the versions resolved from a
# known-good internal dev state. Upgrades are a deliberate edit here; nothing
# auto-updates. (Not under ci/ on purpose, so chart-testing does not treat it as
# an install test case.)
#
# Snapshot of the internal dogfooding track on 2026-09-07. The muster pin is the
# floor of components.muster.versionRange: the toolset presets in values.yaml
# select by the tool-group label, which a muster before 5.12.0 does not know
# (it refuses to start), and which agent-platform-mcps, agent-manager and
# model-manager stamp on their MCPServer CRs from the versions below. The
# model-manager pin is a floor for the same reason: values.yaml forwards the
# whole model-manager block, `lmstudio` included, to every release, and that
# key only exists from 0.19.0 — a chart before it rejects the values outright
# (its schema is additionalProperties: false), whether or not the
# installation uses LM Studio. The agent-platform-connectivity pin has to
# move for the same reason and further: values.yaml forwards `llmRouting` and
# the seven ported extras (backstage, mcp-kubernetes, cloudnative-pg, the four
# kserve charts) to the connectivity release, and no chart before 3.21.0 has
# those keys — every pin from 3.10.0 to 3.20.2 is rejected outright by its
# schema, whatever the installation enables. 3.21.0 also carries the lmstudio
# render guard and its egress arm (3.12.0), so `backend: lmstudio` renders
# with this snapshot. tests/verify-bom-charts.py is what now holds this true:
# it renders every chart this file pins with the values the meta chart
# forwards to it.
# =============================================================================

gitops:
  engine: flux
  interval: 30m

components:
  muster:                        { versionRange: "5.12.0" }
  agentgateway:                  { versionRange: "2.0.7" }
  valkey:                        { versionRange: "0.1.4" }
  agent-platform-mcps:         { versionRange: "0.9.0" }
  kagent:                        { versionRange: "0.2.0" }
  klaus-gateway:                 { versionRange: "0.39.0" }
  agent-sandbox:                 { versionRange: "0.2.31" }
  dicebear:                      { versionRange: "0.3.10" }
  model-manager:                 { versionRange: "0.19.0" }
  agent-manager:                 { versionRange: "0.4.0" }
  agent-platform-connectivity: { versionRange: "3.21.0" }
  # The standalone chart's extras (off by default; the pins apply when an
  # installation turns them on). Snapshot of the agent-platform-standalone
  # chart's tested pins on 2026-09-08; the three kserve charts and the two
  # llmisvc charts move together (one upstream repository).
  backstage:                     { versionRange: "0.243.0" }
  mcp-kubernetes:                { versionRange: "1.1.8" }
  cloudnative-pg:                { versionRange: "0.29.0" }
  kserve-crd:                    { versionRange: "0.2.2" }
  kserve-resources:              { versionRange: "0.2.2" }
  kserve-llmisvc-crd:            { versionRange: "0.2.2" }
  kserve-llmisvc-resources:      { versionRange: "0.2.2" }
