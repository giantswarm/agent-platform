# =============================================================================
# Customer bill-of-materials (example overlay).
#
# Every component version pinned to an exact, dogfood-tested version. Overlays
# values.yaml: `helm install ... -f examples/customer-bom.yaml`. This file IS the
# "product release" — generated by snapshotting the versions resolved from a
# known-good internal dev state. Upgrades are a deliberate edit here; nothing
# auto-updates. (Not under ci/ on purpose, so chart-testing does not treat it as
# an install test case.)
#
# Snapshot of the internal dogfooding track for the 4.0 line (kagent API v2).
# Every component whose components.<name>.versionRange in values.yaml has a
# `>=` floor is pinned at that floor: values.yaml is the one place a floor is
# declared, and `make golden-update` writes these pins from it
# (tests/floors.py; `make verify-meta` fails on a pin that differs). Why a
# floor is where it is lives beside the range in values.yaml. The components
# on an x-range (valkey, agent-platform-mcps, agent-sandbox, dicebear, the
# CloudNativePG and KServe charts, gpu-operator) are pinned here by hand.
# kagent and kagent-crds pin the SAME release of the kagent line (one build;
# the chart carries its own image tag and Go ADK digest, nothing in values.yaml
# names them). substrate and substrate-crds pin the SAME release of the
# Substrate line; the pin is also the worker image the kagent WorkerPool runs:
# the meta chart derives ateom-gvisor:<this pin> for the kagent release, so the
# kagent pin may move on its own — the worker never follows a kagent build's
# stamp (giantswarm/agent-platform#466).
# agent-platform-connectivity is NOT pinned here and must not be: it is
# released off the same tag as the meta chart and follows the meta chart's own
# version (components.agent-platform-connectivity.releasedWithChart) — a pin
# here lags the moment the meta chart moves, and a lagging connectivity
# refuses the keys the meta chart forwards on every installation (#431, #441,
# #339; UPGRADE.md "4.7.x → 4.8.0" for the Harness it renders twice). The
# render refuses such a pin.
# =============================================================================

gitops:
  engine: flux
  interval: 30m

components:
  muster:                        { versionRange: "5.48.0" }
  agentgateway:                  { versionRange: "2.8.0" }
  valkey:                        { versionRange: "0.1.4" }
  agent-platform-mcps:         { versionRange: "0.9.0" }
  kagent:                        { versionRange: "1.21.0" }
  kagent-crds:                   { versionRange: "1.21.0" }
  substrate:                     { versionRange: "1.17.0" }
  substrate-crds:                { versionRange: "1.17.0" }
  google-access-token-credential-provider: { versionRange: "0.2.0" }
  klaus-gateway:                 { versionRange: "4.11.0" }
  agent-sandbox:                 { versionRange: "0.2.31" }
  dicebear:                      { versionRange: "0.3.10" }
  model-manager:                 { versionRange: "1.14.0" }
  agent-manager:                 { versionRange: "2.3.0" }
  vm-manager:                    { versionRange: "0.24.0" }
  # The cluster write surface (components.cluster-manager, off by default).
  cluster-manager:               { versionRange: "0.22.0" }
  # The workspace surface (components.workspace-manager, follows
  # workspaces.enabled, off by default).
  workspace-manager:             { versionRange: "0.11.0" }
  # The standalone chart's extras (off by default; the pins apply when an
  # installation turns them on). Snapshot of the agent-platform-standalone
  # chart's tested pins on 2026-09-08; the kserve charts move together (one
  # upstream repository).
  backstage:                     { versionRange: "2.68.0" }
  mcp-kubernetes:                { versionRange: "1.3.0" }
  cloudnative-pg:                { versionRange: "0.29.0" }
  kserve-llmisvc-crd:            { versionRange: "0.7.1" }
  kserve-llmisvc-resources:      { versionRange: "0.7.1" }
  kserve-runtime-configs:        { versionRange: "0.7.1" }
  # The GPU operator (components.gpu-operator, off by default): the catalog's
  # gpu-operator wrapper chart, 1.3.0 = operator 26.3.1.
  gpu-operator:                  { versionRange: "1.3.0" }
  # The Gateway API CRDs (components.gateway-api-crds, off by default): the
  # fleet's gateway-api-crds chart.
  gateway-api-crds:              { versionRange: "1.9.1" }

# The s3proxy façade in front of Azure Blob (kagent.harness.snapshotStore.s3proxy,
# the CAPZ snapshot store): an image, not a chart — pinned here like the
# components; the gsoci mirror of gaul/s3proxy (giantswarm/retagger), the same
# default in the chart. It applies where the façade is on.
kagent:
  harness:
    snapshotStore:
      s3proxy:
        image:
          tag: 4.1.1
