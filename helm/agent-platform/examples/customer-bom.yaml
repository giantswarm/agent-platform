# =============================================================================
# Customer bill-of-materials (example overlay).
#
# Every component version pinned to an exact, dogfood-tested version. Overlays
# values.yaml: `helm install ... -f examples/customer-bom.yaml`. This file IS the
# "product release" — generated by snapshotting the versions resolved from a
# known-good internal dev state. Upgrades are a deliberate edit here; nothing
# auto-updates. (Not under ci/ on purpose, so chart-testing does not treat it as
# an install test case.)
#
# Snapshot of the internal dogfooding track for the 4.0 line (kagent API v2).
# The muster pin is the floor of components.muster.versionRange: 5.31.4 ends a
# session on a forwarded bearer at the bearer's exp (giantswarm/muster#1323);
# the toolset presets in values.yaml select by the tool-group label, which a
# muster before 5.12.0 does not know (it refuses to start), and which
# agent-platform-mcps, agent-manager and model-manager stamp on their MCPServer
# CRs from the versions below.
# The model-manager, agent-manager, vm-manager, cluster-manager, backstage and
# mcp-kubernetes pins are the floors of their ranges, the first releases that
# export traces over OTLP (giantswarm/giantswarm#36711). model-manager carries
# 1.0.8's num_ctx on the Ollama ModelConfigs it wires
# (giantswarm/model-manager#157); it reads the GPU node pool input from the
# discovery ConfigMap (spec.gpuPool, giantswarm/agent-platform#315, from 0.23.0)
# and starts with no backend and registers backends at runtime (#329, from
# 0.22.0). kagent and
# kagent-crds pin the SAME release of the kagent line (one build; the chart
# carries its own image tag and Go ADK digest, nothing in values.yaml names
# them; the line's releases are stable semver of its own, decoupled from the
# upstream version).
# agent-platform-connectivity is NOT pinned here and must not be: it is
# released off the same tag as the meta chart and follows the meta chart's own
# version (components.agent-platform-connectivity.releasedWithChart) — a pin
# here lags the moment the meta chart moves, and a lagging connectivity
# refuses the keys the meta chart forwards on every installation (#431, #441,
# #339; UPGRADE.md "4.7.x → 4.8.0" for the Harness it renders twice). The
# render refuses such a pin.
# substrate and substrate-crds pin the SAME release of the Substrate line
# (stable semver like kagent's; the floor of components.substrate.versionRange
# — 1.1.0, the line on kagent-dev/substrate v0.2.0-beta5, the upstream Substrate the
# kagent line's own pin names; its egress gateway runs the agentgateway line's 2.1.2). The agentgateway pin is the floor of
# components.agentgateway.versionRange: 2.4.0 is the first packaging release
# whose values schema admits the monitoring block the agentgateway component
# turns on (the tenant label on both monitors, the discovery label and the
# organization and folder annotations on the dashboard ConfigMap); it renders a
# bare image tag as written, which the agentgateway line's release named in
# both charts' agentgateway block is. The
# pin is also the worker image the kagent WorkerPool runs: the meta chart
# derives ateom-gvisor:<this pin> for the kagent release, so the kagent pin
# above may move on its own — the worker never follows a kagent build's stamp
# (giantswarm/agent-platform#466).
# =============================================================================

gitops:
  engine: flux
  interval: 30m

components:
  muster:                        { versionRange: "5.31.4" }
  agentgateway:                  { versionRange: "2.4.0" }
  valkey:                        { versionRange: "0.1.4" }
  agent-platform-mcps:         { versionRange: "0.9.0" }
  kagent:                        { versionRange: "1.1.0" }
  kagent-crds:                   { versionRange: "1.1.0" }
  substrate:                     { versionRange: "1.1.0" }
  substrate-crds:                { versionRange: "1.1.0" }
  # 3.3.0 names a failed turn's class (tools, platform, model, policy) in the
  # thread, the turn record and the turn metric, and sends a tool-set or
  # platform failure once more (giantswarm/klaus-gateway#329). Nothing below
  # 2.0.0 starts: the meta chart forwards no lifecycle.driver
  # (giantswarm/klaus-gateway#319).
  klaus-gateway:                 { versionRange: "3.3.0" }
  agent-sandbox:                 { versionRange: "0.2.31" }
  dicebear:                      { versionRange: "0.3.10" }
  model-manager:                 { versionRange: "1.3.0" }
  agent-manager:                 { versionRange: "1.2.0" }
  vm-manager:                    { versionRange: "0.24.0" }
  # The cluster write surface (components.cluster-manager, off by default).
  cluster-manager:               { versionRange: "0.19.0" }
  # The standalone chart's extras (off by default; the pins apply when an
  # installation turns them on). Snapshot of the agent-platform-standalone
  # chart's tested pins on 2026-09-08, backstage and mcp-kubernetes at their
  # floors; the kserve charts move together (one upstream repository).
  backstage:                     { versionRange: "2.68.0" }
  mcp-kubernetes:                { versionRange: "1.3.0" }
  cloudnative-pg:                { versionRange: "0.29.0" }
  kserve-llmisvc-crd:            { versionRange: "0.5.0" }
  kserve-llmisvc-resources:      { versionRange: "0.5.0" }
  kserve-runtime-configs:        { versionRange: "0.6.0" }
  # The GPU operator (components.gpu-operator, off by default): the catalog's
  # gpu-operator wrapper chart, 1.3.0 = operator 26.3.1.
  gpu-operator:                  { versionRange: "1.3.0" }

# The s3proxy façade in front of Azure Blob (kagent.harness.snapshotStore.s3proxy,
# the CAPZ snapshot store): an image, not a chart — pinned here like the
# components; the gsoci mirror of gaul/s3proxy (giantswarm/retagger), the same
# default in the chart. It applies where the façade is on.
kagent:
  harness:
    snapshotStore:
      s3proxy:
        image:
          tag: 4.1.1
