# The runtime-shaped toggle set of one `<cluster>-agent-platform` release
# (giantswarm/agent-platform#328): the kagent line (kagent-crds and the two
# Substrate entries follow it) on, muster, dicebear and valkey left to the
# platform's release, the bundled engine off. The runtime slice PROFILE is
# examples/runtime-slice.yaml (#317); this file holds the toggle shape the
# render asserts (tests/verify-target.py) alone and combined with the serving
# shape — the two are toggles of ONE release per target cluster, never two
# releases of the chart on one cluster.
components:
  flux:
    enabled: false
  muster:
    enabled: false
  dicebear:
    enabled: false
  valkey:
    enabled: false
  kagent:
    enabled: true
# kagent on needs the Harness's snapshot store (agent-platform.validateSubstrate).
kagent:
  harness:
    snapshotLocation: s3://ci-agent-snapshots/agents
