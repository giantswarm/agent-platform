# The serving-shaped toggle set of one `<cluster>-agent-platform` release
# (giantswarm/agent-platform#328): the KServe components and the model serving
# switch on, the platform's own components — muster, dicebear, valkey, kagent
# and everything that rides it — left to the platform's release. The bundled
# engine is off: the release is delivered by the installation's Flux, beside the
# platform's release on the installation's own cluster or, with gitops.target
# set (ci/test-target-values.yaml), onto a workload cluster. The serving slice
# PROFILE — its values, pool placement, the models Gateway — is
# examples/serving-slice.yaml (#326); this file holds the toggle shape the
# render asserts (tests/verify-target.py): alone, combined with the runtime
# shape, with and without the target knob. agentgateway follows the target:
# off here (beside the platform's release, which owns the controller and its
# CRDs); the target fixture turns it on for a workload cluster.
components:
  flux:
    enabled: false
  muster:
    enabled: false
  dicebear:
    enabled: false
  valkey:
    enabled: false
  # model-manager is on by default (#329) and the platform's release owns it: it
  # runs on the installation and manages the slices' backends registered at runtime.
  model-manager:
    enabled: false
  kserve-crd:
    enabled: true
  kserve-resources:
    enabled: true
  kserve-llmisvc-crd:
    enabled: true
  kserve-llmisvc-resources:
    enabled: true
  modelServing:
    enabled: true
