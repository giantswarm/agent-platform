# Meta-package render smoke values. The root chart emits only Flux
# OCIRepository + HelmRelease objects; it has no workloads
# and needs no ingress wiring (that lives in the connectivity chart). Enabling
# every component here exercises the full render path in chart-testing.
gitops:
  engine: flux
components:
  agentgateway:
    enabled: true
  valkey:
    enabled: true
  kagent:
    enabled: true
  kagent-crds:  # on together with kagent (kagent main's CRDs are their own chart)
    enabled: true
  klaus-gateway:
    enabled: true
  agent-sandbox:
    enabled: true
  agent-platform-mcps:
    enabled: true
  model-manager:
    enabled: true
  agent-manager:
    enabled: true
