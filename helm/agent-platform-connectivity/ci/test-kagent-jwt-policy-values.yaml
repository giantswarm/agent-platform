# kagent controllerRoute in its default shape: the JWT policy is on (Strict,
# issuer from global.identity.issuerUrl, JWKS backend), so the render carries the
# kagent-controller GRPCRoute, the AgentgatewayPolicy with the identity
# transformation and the kagent-controller-jwks AgentgatewayBackend. Nothing
# under jwtAuthentication is set here on purpose.
global:
  identity:
    issuerUrl: https://dex.ci.example.com

components:
  agentgateway:
    enabled: true
  kagent:
    enabled: true

kagent:
  namespaceOverride: kagent
  controllerRoute:
    enabled: true
    hostname: agentgateway.ci.example.com

ingress:
  mode: agentgateway-muster
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

gateway:
  jwksEgress:
    enabled: true

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory
