# Exercises the bundled agent-platform-mcps sub-chart: the `agent-platform-mcps`
# dependency gate plus a sample muster MCPServer rendered from the abstract
# `mcpServers` list. The umbrella must still ship zero CRDs.
#
# Mode is muster-direct, so the agentgateway component is off and viaMuster is
# false (both default the other way, with agentgateway-muster), and the sub-chart's
# agentgateway.dev rendering is off: without the agentgateway component there
# is no CRD for it (the ingress guard refuses the combination).
components:
  agentgateway:
    enabled: false
  agent-platform-mcps:
    enabled: true

ingress:
  mode: muster-direct
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory

agent-platform-mcps:
  agentgateway:
    enabled: false
    viaMuster: false
  mcpServers:
    - cluster: ci
      group: kubernetes
      url: https://mcp.ci.example.com/mcp
