# Exercises the bundled agent-platform-mcps sub-chart: the `agent-platform-mcps`
# dependency gate plus a sample muster MCPServer rendered from the abstract
# `mcpServers` list. The umbrella must still ship zero CRDs.
#
# The default topology: agentgateway in front of muster, the servers reached
# through muster (agent-platform-mcps.agentgateway.viaMuster).
components:
  agent-platform-mcps:
    enabled: true

ingress:
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory

agent-platform-mcps:
  mcpServers:
    - cluster: ci
      group: kubernetes
      url: https://mcp.ci.example.com/mcp
