# kagent + CNPG Postgres with backups to an S3 bucket the chart provisions through
# Crossplane (upbound provider-aws), read through IRSA — the fleet shape on AWS.
# destinationPath, s3.inheritFromIAMRole and the role annotation derive from
# crossplane.aws. Cilium flavor: the CNPG policy gains the object-store egress.
components:
  kagent:
    enabled: true

kagent:
  namespaceOverride: kagent
  database:
    postgres:
      urlFile: /etc/cnpg/uri
      vectorEnabled: true
      bundled:
        enabled: false

postgres:
  enabled: true
  namespace: kagent
  clusterName: kagent-pg
  image:
    name: gsoci.azurecr.io/giantswarm/postgresql-cnpg:18.3
  vector:
    enabled: true
    extensionImage:
      reference: gsoci.azurecr.io/giantswarm/pgvector:0.8.2-18-bookworm
  backup:
    enabled: true
    schedule: "0 0 2 * * *"
    crossplane:
      enabled: true
      provider: aws
      providerConfigRef: ci
      region: eu-central-1
      tags:
        installation: ci
      aws:
        bucketName: giantswarm-ci-kagent-pg
        accountId: "123456789012"
        oidcProvider: irsa.ci.example.com

ingress:
  mode: muster-direct
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory
