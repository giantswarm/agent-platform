# kagent controllerRoute with the JWT policy switched OFF — the local-development
# shape without a front proxy: the GRPCRoute and the controller backend render,
# no AgentgatewayPolicy, no JWKS backend, no identity transformation; the
# controller then trusts x-user-id as sent. Never the fleet shape.
components:
  agentgateway:
    enabled: true
  kagent:
    enabled: true

kagent:
  namespaceOverride: kagent
  controllerRoute:
    enabled: true
    hostname: agentgateway.ci.example.com
    jwtAuthentication:
      enabled: false

ingress:
  mode: agentgateway-muster
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory
