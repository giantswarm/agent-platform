global:
  identity:
    issuerUrl: https://dex.ci.example.com

components:
  agentgateway:
    enabled: true
  kagent:
    enabled: true

kagent:
  namespaceOverride: kagent
  controllerRoute:
    enabled: true
    hostname: agentgateway.ci.example.com
  uiRoute:
    enabled: true
    hostname: kagent.ci.example.com
    parentRef:
      name: giantswarm-default
      namespace: envoy-gateway-system
  oauth2-proxy:
    enabled: true
    config:
      existingSecret: kagent-oauth2-proxy
    extraEnv:
      - name: OIDC_ISSUER_URL
        value: https://dex.ci.example.com
      - name: OIDC_REDIRECT_URL
        value: https://kagent.ci.example.com/oauth2/callback
      - name: UPSTREAM_URL
        value: http://agent-platform-ui:8080
  database:
    postgres:
      bundled:
        enabled: true

# agentgateway-muster: kagent.controllerRoute registers an AgentgatewayBackend +
# GRPCRoute on the data-plane Gateway, so the agentgateway controller must be
# installed. The agentgateway component must match the mode (validate.yaml guard).
# The route's JWT policy is on by default: the issuer comes from global.identity
# and the data plane needs gateway.jwksEgress to fetch the JWKS.
ingress:
  mode: agentgateway-muster
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory

gateway:
  jwksEgress:
    enabled: true
