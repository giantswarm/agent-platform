# LLM routing on: the `llm` listener, the Anthropic AgentgatewayBackend, the
# pinned HTTPRoute, the Gateway-scoped AgentgatewayPolicy (route-type map +
# metric labels), the model-price ConfigMap and its AgentgatewayParameters
# reference, and the data-plane PodMonitor.
#
# Both cutover values are set, so this scenario renders the whole path: the
# listener AND kagent's default ModelConfig pointing at it. A real rollout sets
# them in two steps (listener first) — see the chart README.
components:
  agentgateway:
    enabled: true
  kagent:
    enabled: true

# The LLM listener is reconciled by the agentgateway controller, so the mode
# must route through it (validate.yaml guard).
ingress:
  mode: agentgateway-muster
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com
  httpRoute:
    # Streamed completions must stay open.
    timeouts:
      request: 0s

llmRouting:
  enabled: true

kagent:
  namespaceOverride: kagent
  providers:
    anthropic:
      # The cutover value, forwarded to the kagent release by the meta chart
      # (this chart does not render the default ModelConfig). Host and port must
      # match gateway.name, the release namespace and llmRouting.listener.port.
      config:
        baseUrl: http://agentgateway.default.svc:8081
  # Three extra, chart-owned ModelConfigs. The first names no baseUrl, so the
  # chart fills in the listener: a new entry is metered unless somebody names
  # another upstream. The second names its own, which wins — that is how a model
  # reaches a different upstream, the provider's own URL included. The third is
  # another provider with its own URL: the block that carries it is the CRD's
  # key for the provider (openAI), not the lower-cased provider name, which the
  # API server would prune — verify-kagent-crds validates this render against
  # the kagent line's CRD, verify-llm-routing asserts the key.
  modelConfigs:
    - name: anthropic-sonnet
      displayName: Anthropic Sonnet 4.6
      provider: Anthropic
      model: claude-sonnet-4-6
      apiKeySecret: kagent-anthropic
    - name: anthropic-opus-direct
      displayName: Anthropic Opus 5 (direct)
      provider: Anthropic
      model: claude-opus-5
      apiKeySecret: kagent-anthropic
      baseUrl: https://api.anthropic.com
    - name: openai-gpt-direct
      displayName: OpenAI GPT-5 (direct)
      provider: OpenAI
      model: gpt-5
      apiKeySecret: kagent-openai
      apiKeySecretKey: OPENAI_API_KEY
      baseUrl: https://api.openai.com/v1

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory
