# LLM routing on: the `llm` listener, the pinned HTTPRoute whose backend is the
# model router, the Anthropic AgentgatewayModel, the Gateway-scoped AgentgatewayPolicy (the route-type map;
# the metric labels are the Gateway's own -metrics policy, gateway.metricLabels,
# rendered with or without this), the model-price ConfigMap and its
# AgentgatewayParameters reference, and the data-plane PodMonitor.
components:
  agentgateway:
    enabled: true
  kagent:
    enabled: true

# The LLM listener is reconciled by the agentgateway controller, so the mode
# must route through it (validate.yaml guard).
ingress:
  mode: agentgateway-muster
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com
  httpRoute:
    # Streamed completions must stay open.
    timeouts:
      request: 0s

llmRouting:
  enabled: true
  # Anthropic and OpenAI on the listener: the OpenAI entry serves the
  # Responses route a codex agent calls.
  models:
    - name: anthropic
      provider: Anthropic
      baseURL: https://api.anthropic.com/v1
      match: claude-*
    - name: openai
      provider: OpenAI
      baseURL: https://api.openai.com/v1
      match: gpt-*

kagent:
  namespaceOverride: kagent

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory
