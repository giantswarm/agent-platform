# Agent Substrate's snapshot store provisioned by the chart on CAPA: kagent and
# its runtime on, kagent.harness.snapshotStore.crossplane renders the S3 bucket
# (lifecycle, public-access block, TLS-only policy) and the IRSA role trusted by
# Substrate's atelet and ate-api-server ServiceAccounts — the fleet shape on
# AWS. No explicit snapshotLocation: the meta chart derives it from the bucket
# (s3://giantswarm-ci-substrate/kagent) and forwards the role annotation to the
# substrate release; this chart renders the cloud objects.
components:
  kagent:
    enabled: true
  substrate:
    enabled: true
  substrate-crds:
    enabled: true

kagent:
  namespaceOverride: kagent
  harness:
    snapshotStore:
      prefix: kagent
      crossplane:
        enabled: true
        provider: aws
        providerConfigRef: ci
        region: eu-central-1
        tags:
          installation: ci
        aws:
          bucketName: giantswarm-ci-substrate
          accountId: "123456789012"
          oidcProvider: irsa.ci.example.com
  database:
    postgres:
      urlFile: /etc/cnpg/uri
      vectorEnabled: true
      bundled:
        enabled: false

postgres:
  enabled: true
  namespace: kagent
  instances: 1
  storage:
    size: 5Gi
    storageClass: standard
  vector:
    enabled: true
    extensionImage:
      reference: ghcr.io/cloudnative-pg/pgvector:0.8.0-17-bookworm

# muster-direct: this case exercises the store, not routing.
ingress:
  mode: muster-direct
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory
