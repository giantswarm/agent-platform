# Exercises the klaus-gateway connectivity routes, including the Slack OBO/CIMD
# public route. klausGateway.agentgatewayRoute renders agentgateway.dev objects
# on the agentgateway Gateway, so it needs an agentgateway-* mode with the
# agentgateway component on (the ingress guard refuses it in muster-direct);
# parentRefs is required in every mode.
components:
  agentgateway:
    enabled: true
  klaus-gateway:
    enabled: true

ingress:
  mode: agentgateway-muster
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory

klausGateway:
  agentgatewayRoute:
    enabled: true
    hostname: agentgateway.ci.example.com
  slack:
    enabled: true
    mode: events
    secretName: slack-credentials
  obo:
    enabled: true
    musterUrl: https://muster.ci.example.com
    callbackBaseUrl: https://agentgateway.ci.example.com
    storePath: /var/lib/klaus-gateway/obo/links.bolt
