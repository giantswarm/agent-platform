# Exercises klaus-gateway's egress to its stores (templates/klausgateway/
# netpol.yaml, giantswarm/agent-platform#443) in the cilium flavor: the Valkey
# routing store (routing.store: valkey, the platform's muster-valkey on 6379)
# and the Secret link store (obo.store: secret, the kube-apiserver) each carry
# a rule of the -klausgateway-store-egress policy next to the a2a and OBO
# egress policies. The flavor is explicit: `ct lint` renders without
# cilium.io/v2 served, and `auto` would pick the kubernetes
# flavor (that one is linted through test-netpol-kubernetes-values.yaml).
# agentgateway-* mode with the agentgateway component on, as the a2a egress
# targets the data plane; parentRefs is required in every mode.
components:
  agentgateway:
    enabled: true
  klaus-gateway:
    enabled: true

ingress:
  mode: agentgateway-muster
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

networkPolicy:
  enabled: true
  flavor: cilium

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory

klausGateway:
  a2a:
    enabled: true
  obo:
    enabled: true
    musterUrl: https://muster.ci.example.com
    callbackBaseUrl: https://agentgateway.ci.example.com
    store: secret
  routing:
    store: valkey
