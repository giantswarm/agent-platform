# More vLLM ClusterServingRuntimes beside the default one
# (giantswarm/agent-platform#550): a hardware-specific vLLM build for the
# models that need it, next to the upstream image every other preset runs on.
# The first entry sets what such a build differs in — its image, its base
# arguments and its environment — and a toleration and selector of its own,
# to show the pool's entries merged with them; the second names an image only,
# to show every other field inherited from modelServing.runtime. The pool is
# selected by its label (modelServing.gpuPool.nodeSelector). Render-valid for
# `ct lint` (the modelServing guard is satisfied by the kserve components being
# on); tests/verify-runtimes.py asserts the render.
global:
  domain: ci.example.com
  gatewayApi:
    parentRefs:
      - name: giantswarm-default
        namespace: envoy-gateway-system

components:
  kserve-crd:
    enabled: true
  kserve-resources:
    enabled: true
  modelServing:
    enabled: true

modelServing:
  gpuPool:
    nodeSelector:
      giantswarm.io/machine-pool: ci-gpu00
  additionalRuntimes:
    - name: kserve-vllm-unified-memory
      image:
        registry: registry.example.com
        name: serving/vllm-unified-memory
        version: "2026.09"
      args:
        - --model
        - /mnt/models
        - --port
        - "8080"
        - --served-model-name
        - "{{.Name}}"
        - --gpu-memory-utilization
        - "0.85"
      env:
        - name: VLLM_CONFIG_ROOT
          value: /tmp
        - name: EXAMPLE_ACCELERATOR_ARCH
          value: unified-memory
      nodeSelector:
        example.com/accelerator: unified-memory
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: example.com/dedicated
          operator: Equal
          value: serving
          effect: NoSchedule
    - name: kserve-vllm-nightly
      image:
        registry: docker.io
        name: vllm/vllm-openai
        version: nightly
