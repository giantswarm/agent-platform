# The vanilla-cluster shape: a cluster with no Kyverno at all.
#
# kagent and agentSandbox are both on, so every `kyverno.io` template in the
# chart is reachable (the two kagent declarative-agent ClusterPolicies, the
# kagent seccomp PolicyException, the agent-sandbox pod-security ClusterPolicy).
# kyvernoPolicies.enabled: false must then drop all four, or the install fails
# on an unknown API group.
#
# agentSandbox.podSecurity.enabled must go off with it: the controller's
# securityContext reaches the Deployment through the mutate policy and through
# nothing else, and templates/agent-sandbox/validate.yaml fails the render when
# the two disagree. That guard is what this case pins.
ingress:
  mode: muster-direct
  parentRefs:
    - name: giantswarm-default
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - muster.ci.example.com

muster:
  muster:
    oauth:
      server:
        enabled: false
        storage:
          type: memory

valkey:
  enabled: false

kagent:
  enabled: true
  namespaceOverride: kagent

agentSandbox:
  enabled: true
  podSecurity:
    enabled: false

kyvernoPolicies:
  enabled: false
