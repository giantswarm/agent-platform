# NVIDIA Nemotron 3 Super 120B-A12B, NVFP4. Hybrid SSM + transformer MoE.
apiVersion: agent-platform.giantswarm.io/v1alpha1
kind: ServingPreset
metadata:
  name: nemotron-3-super-nvfp4
spec:
  displayName: Nemotron 3 Super 120B-A12B (NVFP4)
  description: |
    Large MoE reasoning model (120B total, 12B active) served from the NVFP4
    checkpoint (~75 GiB of weights); thinking disabled by default (the chat
    template enables it otherwise). Needs a Blackwell-class GPU for NVFP4.
    Tuned on a single-GPU 128 GB unified-memory node
    (--gpu-memory-utilization=0.72), with CUDA graphs: the pool they
    capture counts inside the 0.72, and the first start compiles them.
  model:
    id: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    storageUri: hf://nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
    format: vLLM
    contextLength: 8192
    capabilities: [chat, tools, reasoning]
    license: nvidia-open-model-license
  args:
    - --gpu-memory-utilization=0.72
    - --max-model-len=8192
    - --no-enable-log-requests
    # One argument, the JSON single-quoted inside it: the well-known runtime
    # template re-parses every argument through a shell (eval "… $@"), which
    # would split a bare JSON at its whitespace and eat its double quotes.
    - "--default-chat-template-kwargs='{\"enable_thinking\": false}'"
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - --reasoning-parser=nemotron_v3
  resources:
    gpus: 1
    requests:
      cpu: "4"
      memory: 48Gi
    limits:
      cpu: "8"
      memory: 64Gi
  requirements:
    weightsGiB: 75
    overheadGiB: 30
  # A split across a fast link only: the B12X runtime's in-graph RoCE
  # all-reduce for messages up to 2 MB, NCCL above. Measured on two 128 GB
  # unified-memory Blackwell nodes with CUDA graphs: 16.3 → 26.3 tok/s single
  # stream; a single-node pod has no all-reduce and never carries it.
  split:
    env:
      - name: VLLM_ENABLE_ROCE_ALLREDUCE
        value: "1"
      - name: VLLM_ROCE_ALLREDUCE_MAX_SIZE
        value: 2MB
