# Gemma 4 31B, Red Hat's FP8-dynamic quantization of Google's instruction-tuned
# dense 31B on one 48 GB GPU of the L40S family, served from an OCI model
# image under vLLM's Gemma 4 chat template: tool calls and thinking in the
# model's own token protocol, parsed by vLLM's gemma4 parsers.
apiVersion: agent-platform.giantswarm.io/v1alpha1
kind: ServingPreset
metadata:
  name: gemma-4-31b
spec:
  displayName: Gemma 4 31B (FP8, one 48 GB GPU)
  description: |
    Google's dense 31B instruction-tuned model with tool calling, thinking
    and vision (the model also takes audio; this recipe switches it off),
    served as Red Hat's FP8-dynamic quantization (31 GiB of weights) on one
    48 GB GPU of the L40S family: g6e.2xlarge or g6e.4xlarge (g6e.xlarge
    leaves a predictor 3 vCPU / 27 GiB, less than the 4 vCPU / 32 GiB
    requested here). The model's own window is 262,144 tokens; the preset
    serves 64k, what the KV cache of a 48 GB card holds beside 31 GiB of
    weights at --gpu-memory-utilization=0.92 (four concurrent requests, one
    image per prompt, no audio). Tool calls and thinking use Gemma 4's own
    token protocol, parsed with vLLM's gemma4 tool and reasoning parsers
    under vLLM's Gemma 4 chat template — the template the model card's vLLM
    instructions and vLLM's Gemma 4 recipe both serve the model with,
    shipped as chat-templates/gemma-4-31b.jinja from vLLM v0.23.0's
    examples (the vLLM inside llm-d v0.8.0, the platform's runtime image).
    Thinking is off by default; a request turns it on with enable_thinking.
    Weights: an OCI model image, giantswarm/models/gemma-4-31b-fp8 at the
    checkpoint revision, pulled onto the node by containerd (KServe's
    modelcar path: no download, no cache claim); the runtime runs as a
    non-root uid on the read-only image, so HOME, HF_HOME and
    VLLM_CACHE_ROOT live under /tmp. 31 + 13 GiB exceed a 24 GB L4/A10G and
    a 16 GB T4.
  model:
    id: RedHatAI/gemma-4-31B-it-FP8-dynamic
    # The tag is the first 12 characters of the checkpoint revision
    # d4ab4f579dd3516f97d8a6a4c98d0653480bad15 (2 safetensors shards under
    # /models). modelServing.modelImages.registry swaps the host at render;
    # the path, giantswarm/models/gemma-4-31b-fp8:d4ab4f579dd3, stays.
    storageUri: oci://gsoci.azurecr.io/giantswarm/models/gemma-4-31b-fp8:d4ab4f579dd3
    format: vLLM
    contextLength: 65536
    capabilities: [chat, tools, reasoning, vision, coding]
    license: apache-2.0
  env:
    # The modelcar path runs the runtime as the platform KServe's modelcar uid
    # on a read-only model image: the home, the Hub cache and vLLM's compile
    # cache go under /tmp (the cache claim's compile cache is not mounted).
    - name: HOME
      value: /tmp
    - name: HF_HOME
      value: /tmp/hf
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm-cache
    # The predictor runs as the modelcar uid (1010), which the runtime image's
    # passwd does not know: torch's inductor cache-dir lookup asks getpass for
    # a user name and dies on getpwuid(1010) at `import vllm` unless the name
    # comes from the environment, so the name and the cache dir are set here.
    - name: USER
      value: vllm
    - name: LOGNAME
      value: vllm
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /tmp/torchinductor
  args:
    - --gpu-memory-utilization=0.92
    - --max-model-len=65536
    - --max-num-seqs=4
    - --max-num-batched-tokens=8192
    - --enable-chunked-prefill
    - --enable-prefix-caching
    # One argument, the JSON single-quoted inside it: the well-known runtime
    # template re-parses every argument through a shell (eval "… $@"), which
    # would split a bare JSON at its whitespace and eat its double quotes.
    # audio 0 skips the audio encoder's memory (vLLM's Gemma 4 recipe).
    - "--limit-mm-per-prompt='{\"image\": 1, \"audio\": 0}'"
    - --no-enable-log-requests
    - --reasoning-parser=gemma4
    - --enable-auto-tool-choice
    - --tool-call-parser=gemma4
  # vLLM's Gemma 4 tool-calling chat template (examples/tool_chat_template_gemma4.jinja
  # at v0.23.0): the model card's vLLM instructions and vLLM's Gemma 4 recipe
  # both serve the model with it for tool calls and thinking. Publishing
  # appends --chat-template from it.
  chatTemplate:
    file: gemma-4-31b.jinja
  resources:
    gpus: 1
    requests:
      cpu: "4"
      memory: 32Gi
    limits:
      cpu: "8"
      memory: 48Gi
  requirements:
    # The Hub's safetensors index sizes the weights at 30.98 GiB
    # (make verify-preset-weights); 13 GiB of overhead is the KV cache of
    # the 64k context, CUDA graphs and the runtime — 44 GiB in all on a
    # 48 GB card at 0.92.
    weightsGiB: 31
    overheadGiB: 13
