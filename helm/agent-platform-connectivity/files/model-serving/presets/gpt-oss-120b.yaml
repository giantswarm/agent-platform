# gpt-oss-120b, OpenAI's open-weight reasoning model on four 48 GB GPUs of the
# L40S family (g6e.12xlarge), served from an OCI model image. A 117B mixture
# of experts with 5.1B active, MXFP4 experts as published (61 GiB), 128k
# context, tools through the harmony format, reasoning at three efforts.
# resources.gpus: 4 puts four cards on the one model pod and
# --tensor-parallel-size=4 splits the model across them (the well-known llm-d
# template adds no --tensor-parallel-size of its own unless an
# LLMInferenceService sets spec.parallelism.tensor, which model-manager never
# does). Ada has no native FP4: vLLM's MoE oracle falls to the Marlin MXFP4
# kernels on SM 8.9 by itself, and attention with sinks runs on TRITON_ATTN
# (FlashAttention 3 is Hopper-only) — the A100 path of vLLM's recipe.
apiVersion: agent-platform.giantswarm.io/v1alpha1
kind: ServingPreset
metadata:
  name: gpt-oss-120b
spec:
  displayName: gpt-oss-120b (MXFP4, four 48 GB GPUs, OCI model image)
  description: |
    gpt-oss-120b: OpenAI's open-weight reasoning model, a 117B-parameter
    mixture of experts with 5.1B active (128 experts, 4 per token, attention
    sinks, 128k context) with tool calling through the harmony response
    format and reasoning at low, medium or high effort (reasoning_effort on
    the request; medium by default). Served as published — the experts in
    MXFP4, the rest BF16, 61 GiB of weights — across four 48 GB GPUs of the
    L40S family with tensor parallel 4: a g6e.12xlarge (4 GPUs, 48 vCPU,
    384 GiB), the smallest curated size with more than one L40S; no two-GPU
    size exists in the family. The GPUs have no native FP4, so vLLM runs the
    MXFP4 experts through the Marlin kernels and the sink attention on the
    Triton backend, both selected by the runtime itself on this GPU.
    Memory per card: 61 / 4 = 15.2 GiB of weights, and the rest of
    --gpu-memory-utilization=0.90 of the 48 GB — about 25 GiB — the KV cache
    for eight concurrent requests of the full 128k context. The fit check
    budgets the memory of the four requested cards, 4 x 48 = 192 GiB,
    against weightsGiB + overheadGiB = 101 GiB: 40 GiB of overhead is 10 GiB
    per card for the KV cache, CUDA graphs and the runtime. Requests 16 vCPU
    / 96 GiB and limits 32 vCPU / 160 GiB of the size's 48 / 384 (the four
    tensor-parallel workers stage the weights through host memory while
    loading). Tools on with the openai parser, reasoning with the
    openai_gptoss parser; the smaller gpt-oss-20b serves the same family on
    one 24 GB GPU. Text only.
    Weights: an OCI model image, giantswarm/models/gpt-oss-120b at the
    checkpoint revision, pulled onto the node by containerd like any image
    (KServe's modelcar path: no download, no cache claim, every serving node
    a target); an installation serves it from a registry of its own that
    holds the same path by setting modelServing.modelImages.registry. The
    modelcar path runs the runtime as a non-root uid on a read-only image,
    so HOME, HF_HOME and VLLM_CACHE_ROOT live under /tmp.
    Licence: Apache 2.0.
  model:
    id: openai/gpt-oss-120b
    # The tag is the first 12 characters of the checkpoint revision
    # b5c939de8f754692c1647ca79fbf85e8c1e70f8a and the digest of the image's
    # extra files, the two tiktoken encodings under /models/tiktoken.
    # modelServing.modelImages.registry swaps the host at render; the path,
    # giantswarm/models/gpt-oss-120b:b5c939de8f75-7abb6426, stays.
    storageUri: oci://gsoci.azurecr.io/giantswarm/models/gpt-oss-120b:b5c939de8f75-7abb6426
    format: vLLM
    contextLength: 131072
    capabilities: [chat, tools, reasoning, coding]
    license: apache-2.0
  env:
    # The modelcar path runs the runtime as the platform KServe's modelcar uid
    # on a read-only model image: the home, the Hub cache and vLLM's compile
    # cache go under /tmp (the cache claim's compile cache is not mounted).
    - name: HOME
      value: /tmp
    - name: HF_HOME
      value: /tmp/hf
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm-cache
    # The predictor runs as the modelcar uid (1010), which the runtime image's
    # passwd does not know: torch's inductor cache-dir lookup asks getpass for
    # a user name and dies on getpwuid(1010) at `import vllm` unless the name
    # comes from the environment, so the name and the cache dir are set here.
    - name: USER
      value: vllm
    - name: LOGNAME
      value: vllm
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /tmp/torchinductor
    # The harmony renderer loads the tiktoken encodings (o200k_base,
    # cl100k_base) at the first request, from the network unless this names a
    # local directory; the pod's egress is closed, so the model image carries
    # both files under /models/tiktoken (giantswarm/agent-platform#606).
    - name: TIKTOKEN_ENCODINGS_BASE
      value: /mnt/models/tiktoken
  args:
    # Four GPUs on the one pod (resources.gpus), the model split across them.
    - --tensor-parallel-size=4
    - --max-model-len=131072
    - --max-num-seqs=8
    - --max-num-batched-tokens=8192
    - --enable-chunked-prefill
    - --enable-prefix-caching
    - --no-enable-log-requests
    - --reasoning-parser=openai_gptoss
    - --enable-auto-tool-choice
    - --tool-call-parser=openai
    - --gpu-memory-utilization=0.90
  resources:
    gpus: 4
    requests:
      cpu: "16"
      memory: 96Gi
    limits:
      cpu: "32"
      memory: 160Gi
  requirements:
    # The Hub's safetensors index sizes the checkpoint at 60.77 GiB
    # (make verify-preset-weights). 40 GiB of overhead across the four cards:
    # 10 GiB each for the KV cache, CUDA graphs and the runtime next to
    # 15.2 GiB of weights.
    weightsGiB: 61
    overheadGiB: 40
