# Qwen3.8 27B, NVFP4 repack on one 48 GB GPU: the qwen3-8-27b recipe cut to the
# L40S family, proven live on one L40S. Ada has no native FP4, so vLLM takes the
# Marlin weight-only FP4 path; what the Blackwell recipe adds (the DFlash2 draft
# model, 256k context, the CUTE_DSL_ARCH pin, the patched chat template) has no
# room on a 48 GB card and stays out.
apiVersion: agent-platform.giantswarm.io/v1alpha1
kind: ServingPreset
metadata:
  name: qwen3-8-27b-l40s
spec:
  displayName: Qwen3.8 27B (NVFP4, one 48 GB GPU)
  description: |
    Dense 27B coding and agent model (Qwen3.5 lineage) with tool calling
    (Claude Code compatible) and vision, served as the Inferact NVFP4 repack
    (25 GiB of weights) on one 48 GB GPU of the L40S family: g6e.2xlarge or
    g6e.4xlarge (g6e.xlarge leaves a predictor 3 vCPU / 27 GiB, less than the
    4 vCPU / 32 GiB requested here). The GPU has no native FP4, so vLLM takes
    the Marlin weight-only FP4 path (MarlinNvFp4LinearKernel): 24.17 GiB of
    weights loaded, 14.65 GiB left for the KV cache at
    --gpu-memory-utilization=0.92 — 222,822 tokens, 3.4 concurrent requests
    of the 64k context. Thinking is off by default (a request turns it on
    with enable_thinking), tools on with the qwen3_coder parser, the model's
    own chat template. The qwen3-8-27b preset is the same model tuned for a
    128 GB unified-memory Blackwell node and adds what a 48 GB card has no
    room for: the DFlash2 speculative decoder, 256k context and the patched
    chat template. 25 + 16 GiB exceed a 24 GB L4/A10G and a 16 GB T4.
  model:
    id: Inferact/Qwen3.8-27B-NVFP4
    storageUri: hf://Inferact/Qwen3.8-27B-NVFP4
    format: vLLM
    contextLength: 65536
    capabilities: [chat, tools, reasoning, vision, coding]
    license: apache-2.0
  args:
    - --gpu-memory-utilization=0.92
    - --max-model-len=65536
    - --max-num-seqs=4
    - --max-num-batched-tokens=8192
    - --enable-chunked-prefill
    - --enable-prefix-caching
    # One argument, the JSON single-quoted inside it: the well-known runtime
    # template re-parses every argument through a shell (eval "… $@"), which
    # would split a bare JSON at its whitespace and eat its double quotes.
    - "--limit-mm-per-prompt='{\"image\": 1, \"video\": 0}'"
    - --no-enable-log-requests
    - --reasoning-parser=qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - "--default-chat-template-kwargs='{\"enable_thinking\": false}'"
  resources:
    gpus: 1
    requests:
      cpu: "4"
      memory: 32Gi
    limits:
      cpu: "8"
      memory: 48Gi
  requirements:
    # The Hub's safetensors index sizes the weights at 24.6 GiB
    # (make verify-preset-weights); 16 GiB of overhead is the 14.65 GiB KV
    # cache plus CUDA graphs and the runtime on a 48 GiB card at 0.92.
    weightsGiB: 25
    overheadGiB: 16
