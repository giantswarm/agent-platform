# Mistral Small 4 119B, Mistral's own NVFP4 checkpoint on four 48 GB GPUs of
# the L40S family (g6e.12xlarge), served from an OCI model image. The first
# preset on more than one GPU: resources.gpus: 4 puts four cards on the one
# model pod and --tensor-parallel-size=4 splits the model across them — the
# well-known llm-d template adds a --tensor-parallel-size of its own only for
# an LLMInferenceService with spec.parallelism.tensor, which model-manager
# never sets, so the preset's flag is the only one on the command line. A 119B
# mixture of experts with 6.5B active (128 experts, 4 routed plus 1 shared,
# MLA attention), tools, reasoning on request, vision. Ada has no native FP4:
# vLLM runs the NVFP4 weights (W4A16) through Marlin, the path the
# qwen3-8-27b-l40s preset runs on today, and the MLA attention through
# TRITON_MLA (FlashMLA is Hopper-only).
apiVersion: agent-platform.giantswarm.io/v1alpha1
kind: ServingPreset
metadata:
  name: mistral-small-4
spec:
  displayName: Mistral Small 4 119B (NVFP4, four 48 GB GPUs, OCI model image)
  description: |
    Mistral Small 4: a 119B-parameter mixture of experts with 6.5B active
    (128 experts, 4 routed per token plus 1 shared, MLA attention), the
    successor of the Instruct, Magistral and Devstral lines in one
    checkpoint — tool calling, reasoning on request (reasoning_effort=high;
    none by default) and vision (Pixtral encoder, images up to 1540 px).
    Served as Mistral's own NVFP4 checkpoint (66 GiB of weights, the mistral
    format: params.json and consolidated safetensors, hence --tokenizer-mode,
    --config-format and --load-format mistral) across four 48 GB GPUs of the
    L40S family with tensor parallel 4: a g6e.12xlarge (4 GPUs, 48 vCPU,
    384 GiB) — the smallest curated size with more than one L40S; no
    two-GPU size exists in the family. The GPUs have no native FP4, so vLLM
    takes the Marlin weight-only FP4 path, and the MLA attention runs on
    TRITON_MLA as the model card recommends (FlashMLA is Hopper-only).
    Memory per card: 66 / 4 = 16.5 GiB of weights, and the rest of
    --gpu-memory-utilization=0.90 of the 48 GB — about 23 GiB — the KV cache
    for eight concurrent requests of the 128k context served here (the model
    carries 256k; halving it doubles the requests a card's cache holds). The
    fit check budgets the memory of the four requested cards, 4 x 48 =
    192 GiB, against weightsGiB + overheadGiB = 126 GiB: 60 GiB of overhead is
    15 GiB per card for the KV cache, CUDA graphs and the runtime. Requests
    16 vCPU / 96 GiB and limits 32 vCPU / 160 GiB of the size's 48 / 384
    (the four tensor-parallel workers stage the weights through host memory
    while loading). Tools on with the mistral parser, reasoning with the
    mistral parser.
    Weights: an OCI model image, giantswarm/models/mistral-small-4-nvfp4 at
    the checkpoint revision, pulled onto the node by containerd like any
    image (KServe's modelcar path: no download, no cache claim, every serving
    node a target); an installation serves it from a registry of its own
    that holds the same path by setting modelServing.modelImages.registry.
    The modelcar path runs the runtime as a non-root uid on a read-only
    image, so HOME, HF_HOME and VLLM_CACHE_ROOT live under /tmp.
    Licence: Apache 2.0.
  model:
    id: mistralai/Mistral-Small-4-119B-2603-NVFP4
    # The tag is the first 12 characters of the checkpoint revision
    # 45331841b631f4e281df8e959ea3cc9beb84298a. modelServing.modelImages.registry
    # swaps the host at render; the path,
    # giantswarm/models/mistral-small-4-nvfp4:45331841b631, stays.
    storageUri: oci://gsoci.azurecr.io/giantswarm/models/mistral-small-4-nvfp4:45331841b631
    format: vLLM
    contextLength: 131072
    capabilities: [chat, tools, reasoning, vision, coding]
    license: apache-2.0
  env:
    # The modelcar path runs the runtime as the platform KServe's modelcar uid
    # on a read-only model image: the home, the Hub cache and vLLM's compile
    # cache go under /tmp (the cache claim's compile cache is not mounted).
    - name: HOME
      value: /tmp
    - name: HF_HOME
      value: /tmp/hf
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm-cache
    # The predictor runs as the modelcar uid (1010), which the runtime image's
    # passwd does not know: torch's inductor cache-dir lookup asks getpass for
    # a user name and dies on getpwuid(1010) at `import vllm` unless the name
    # comes from the environment, so the name and the cache dir are set here.
    - name: USER
      value: vllm
    - name: LOGNAME
      value: vllm
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /tmp/torchinductor
  args:
    # Four GPUs on the one pod (resources.gpus), the model split across them.
    - --tensor-parallel-size=4
    # Mistral's own checkpoint format (params.json, consolidated safetensors,
    # tekken tokenizer), read from the image's /models directory.
    - --tokenizer-mode=mistral
    - --config-format=mistral
    - --load-format=mistral
    # MLA attention on Ada: FlashMLA needs Hopper.
    - --attention-backend=TRITON_MLA
    - --max-model-len=131072
    - --max-num-seqs=8
    - --max-num-batched-tokens=8192
    - --enable-chunked-prefill
    - --enable-prefix-caching
    - --no-enable-log-requests
    - --reasoning-parser=mistral
    - --enable-auto-tool-choice
    - --tool-call-parser=mistral
    - --gpu-memory-utilization=0.90
  resources:
    gpus: 4
    requests:
      cpu: "16"
      memory: 96Gi
    limits:
      cpu: "32"
      memory: 160Gi
  requirements:
    # The Hub sizes the checkpoint at 65.95 GiB, the sum of its consolidated
    # safetensors (make verify-preset-weights). 60 GiB of overhead across the
    # four cards: 15 GiB each for the KV cache, CUDA graphs and the runtime
    # next to 16.5 GiB of weights.
    weightsGiB: 66
    overheadGiB: 60
