# Qwen3.6 35B-A3B, Qwen's own FP8 checkpoint of the 35B mixture of experts
# (3B active per token) on one 48 GB GPU of the L40S family, served from an
# OCI model image: the fast agent model of the 48 GB shape — decode at the
# pace of a 3B model, tools, reasoning and vision, thinking off by default.
apiVersion: agent-platform.giantswarm.io/v1alpha1
kind: ServingPreset
metadata:
  name: qwen3-6-35b-a3b
spec:
  displayName: Qwen3.6 35B-A3B (FP8 MoE, one 48 GB GPU)
  description: |
    Mixture of experts with 35B parameters loaded and 3B active per token
    (Qwen3.5 lineage), so decode runs at the pace of a 3B model: the fast
    agent and coding model of the 48 GB shape, with tool calling (Claude
    Code compatible), reasoning and vision, served as Qwen's own FP8
    checkpoint (35 GiB of weights) on one 48 GB GPU of the L40S family:
    g6e.2xlarge or g6e.4xlarge (g6e.xlarge leaves a predictor 3 vCPU /
    27 GiB, less than the 4 vCPU / 32 GiB requested here). The model's own
    window is 262,144 tokens; the preset serves 32k, what the KV cache of a
    48 GB card holds beside 35 GiB of weights at
    --gpu-memory-utilization=0.92 (four concurrent requests, one image per
    prompt). Thinking is off by default (a request turns it on with
    enable_thinking), tools on with the qwen3_coder parser, reasoning with
    the qwen3 parser, the model's own chat template. Weights: an OCI model
    image, giantswarm/models/qwen3-6-35b-a3b-fp8 at the checkpoint
    revision, pulled onto the node by containerd (KServe's modelcar path: no
    download, no cache claim); the runtime runs as a non-root uid on the
    read-only image, so HOME, HF_HOME and VLLM_CACHE_ROOT live under /tmp.
    35 + 9 GiB exceed a 24 GB L4/A10G and a 16 GB T4.
  model:
    id: Qwen/Qwen3.6-35B-A3B-FP8
    # The tag is the first 12 characters of the checkpoint revision
    # 95a723d08a9490559dae23d0cff1d9466213d989 (42 safetensors shards under
    # /models). modelServing.modelImages.registry swaps the host at render;
    # the path, giantswarm/models/qwen3-6-35b-a3b-fp8:95a723d08a94, stays.
    storageUri: oci://gsoci.azurecr.io/giantswarm/models/qwen3-6-35b-a3b-fp8:95a723d08a94
    format: vLLM
    contextLength: 32768
    capabilities: [chat, tools, reasoning, vision, coding]
    license: apache-2.0
  env:
    # The modelcar path runs the runtime as the platform KServe's modelcar uid
    # on a read-only model image: the home, the Hub cache and vLLM's compile
    # cache go under /tmp (the cache claim's compile cache is not mounted).
    - name: HOME
      value: /tmp
    - name: HF_HOME
      value: /tmp/hf
    - name: VLLM_CACHE_ROOT
      value: /tmp/vllm-cache
    # The predictor runs as the modelcar uid (1010), which the runtime image's
    # passwd does not know: torch's inductor cache-dir lookup asks getpass for
    # a user name and dies on getpwuid(1010) at `import vllm` unless the name
    # comes from the environment, so the name and the cache dir are set here.
    - name: USER
      value: vllm
    - name: LOGNAME
      value: vllm
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /tmp/torchinductor
  args:
    - --gpu-memory-utilization=0.92
    - --max-model-len=32768
    - --max-num-seqs=4
    - --max-num-batched-tokens=8192
    - --enable-chunked-prefill
    - --enable-prefix-caching
    # One argument, the JSON single-quoted inside it: the well-known runtime
    # template re-parses every argument through a shell (eval "… $@"), which
    # would split a bare JSON at its whitespace and eat its double quotes.
    - "--limit-mm-per-prompt='{\"image\": 1, \"video\": 0}'"
    - --no-enable-log-requests
    - --reasoning-parser=qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser=qwen3_coder
    - "--default-chat-template-kwargs='{\"enable_thinking\": false}'"
  resources:
    gpus: 1
    requests:
      cpu: "4"
      memory: 32Gi
    limits:
      cpu: "8"
      memory: 48Gi
  requirements:
    # The Hub's safetensors index sizes the weights at 34.89 GiB
    # (make verify-preset-weights); 9 GiB of overhead is the KV cache of the
    # 32k context, CUDA graphs and the runtime — 44 GiB in all on a 48 GB
    # card at 0.92.
    weightsGiB: 35
    overheadGiB: 9
