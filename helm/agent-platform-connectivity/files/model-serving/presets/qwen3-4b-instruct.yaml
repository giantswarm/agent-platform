# Qwen3 4B Instruct, BF16. The small-GPU generalist: one 24 GB GPU (an L4),
# tools on. No image: the predictor runs the mirrored llm-d-cuda the
# well-known LLMInferenceServiceConfig names (components.kserve-runtime-configs).
apiVersion: agent-platform.giantswarm.io/v1alpha1
kind: ServingPreset
metadata:
  name: qwen3-4b-instruct
spec:
  displayName: Qwen3 4B Instruct
  description: |
    Dense 4B instruct model at BF16 (~8 GiB of weights), non-thinking, tool
    calling on (hermes parser — agents always send tools, and vLLM answers
    400 without --enable-auto-tool-choice). Tuned for one 24 GB GPU of the
    L4 class (--gpu-memory-utilization=0.90, 16k context) under the nvidia
    RuntimeClass the serving slice sets (modelServing.serving.runtimeClassName).
  model:
    id: Qwen/Qwen3-4B-Instruct-2507
    storageUri: hf://Qwen/Qwen3-4B-Instruct-2507
    format: vLLM
    contextLength: 16384
    capabilities: [chat, tools]
    license: apache-2.0
  args:
    - --gpu-memory-utilization=0.90
    - --max-model-len=16384
    - --no-enable-log-requests
    # kagent agents call /v1/chat/completions with tools and tool_choice auto;
    # without a parser vLLM rejects every agent request (400).
    - --enable-auto-tool-choice
    - --tool-call-parser=hermes
  resources:
    gpus: 1
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 24Gi
  requirements:
    weightsGiB: 8
    overheadGiB: 12
