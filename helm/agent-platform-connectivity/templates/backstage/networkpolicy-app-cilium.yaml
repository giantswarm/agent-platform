{{- if and (include "agent-platform.backstage.enabled" .) .Values.networkPolicy.enabled (eq (include "agent-platform.networkPolicyFlavor" .) "cilium") }}
{{- $backstage := include "agent-platform.backstage.values" . | fromJson }}
{{- $port := dig "port" 7007 $backstage | int }}
{{- /* The backstage chart names its CNPG cluster <its chart name>-<suffix>, so
the prefix is the literal chart name, not backstage.name. */}}
{{- $cnpg := printf "backstage-%s" (dig "database" "postgresql" "clusterNameSuffix" "cnpg" $backstage) }}
{{- $edgeNamespaces := include "agent-platform.backstage.edgeNamespaces" . | fromJsonArray }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-backstage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.backstage.labels" . | nindent 4 }}
spec:
  # The backstage chart labels its pods `app: <backstage.name>` and
  # `component: backstage`; `app` alone is not unique in the namespace.
  endpointSelector:
    matchLabels:
      app: {{ include "agent-platform.backstage.name" . }}
      component: backstage
  ingress:
    {{- if (include "agent-platform.backstage.routeToDataPlane" .) }}
    # The chart owns the edge and the route names no parent of its own, so it
    # attaches to the agentgateway data plane's HTTPS listener and the
    # data-plane pods are the peer.
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ $port | toString | quote }}
              protocol: TCP
    {{- else }}
    # The route attaches to the platform's front Gateway (the Envoy edge), which
    # proxies straight to the portal's Service: agentgateway is not in this path.
    # The namespaces are the route's own parents (backstage.parentRefs, else
    # global.gatewayApi.parentRefs); `app.kubernetes.io/name: envoy` is the
    # label Envoy Gateway stamps on the proxy pods it runs for a Gateway, as
    # the oauth2-proxy policy selects them.
    - fromEndpoints:
        {{- range $ns := $edgeNamespaces }}
        - matchLabels:
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: {{ $ns }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $port | toString | quote }}
              protocol: TCP
    {{- end }}
    # The kubelet's liveness and readiness probes arrive from the host entity.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: {{ $port | toString | quote }}
              protocol: TCP
  egress:
    {{- include "agent-platform.dnsEgressWithProxy" . | nindent 4 }}
    # The Kubernetes API: the portal's Clusters and Kubernetes pages, and the
    # Agent Platform pages' Flux writes, act as the caller.
    - toEntities:
        - kube-apiserver
    # The login identity provider: OIDC discovery, JWKS, userinfo and token.
    # The backend exits when discovery times out. The include also renders the
    # `cluster` entity on 443 and 10443, which is what carries the portal's
    # calls to the edge: keep both legs when it is narrowed.
    {{- include "agent-platform.idpEgress.cilium" (dict "provider" "dex" "issuerUrl" (include "agent-platform.issuerUrl" (dict "ctx" . "for" "the Backstage network policy"))) | trim | nindent 4 }}
    {{- if eq (dig "database" "engine" "" $backstage) "postgresql" }}
    # The portal's own CNPG cluster (backstage.database.engine=postgresql). The
    # backend holds the catalog and every session there; without this leg it
    # falls back to an in-memory store and loses both on each restart.
    # <cluster>-restore is this platform's name for a scratch Cluster restored
    # from a backup; the backstage chart renders no such Cluster itself.
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: In
              values:
                - {{ $cnpg }}
                - {{ $cnpg }}-restore
          matchLabels:
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    {{- end }}
    {{- with (dig "catalogs" "version" "" $backstage) }}
    # The scaffolder catalog location (backstage.catalogs.version): the URL is on
    # github.com and the reader dials the API or the raw host, by integration.
    # Without this leg the agent create flow answers 404.
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    # muster's MCP endpoint. The app-config addresses muster, the kagent
    # controller and the model manager by their public hostnames, which resolve
    # to the edge; Cilium translates that address to the edge pods, which are
    # `cluster` on 443 and 10443 — the entity leg the idpEgress include above
    # renders, and the only leg those three calls have. This leg covers a direct
    # in-cluster address for muster.
    {{- if include "agent-platform.componentEnabled" (dict "root" . "name" "muster") }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ include "agent-platform.musterFullname" . }}
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ include "agent-platform.musterServicePort" . | toString | quote }}
              protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgressFQDNs }}
    - toFQDNs:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgressCIDRs }}
    - toCIDR:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
{{- end }}
