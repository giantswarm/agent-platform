{{- if .Values.postgres.enabled }}
{{- $db := .Values.postgres.applicationDatabase }}
{{- $schema := $db.schema | default "kagent" }}
{{- $owner := $db.owner | default "kagent" }}
{{- $clusterName := .Values.postgres.clusterName }}
{{- $ns := .Values.postgres.namespace | default .Release.Namespace }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  namespace: {{ $ns }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
  annotations:
    # The database outlives the release: an uninstall or a postgres.enabled
    # flip must not drop the platform's data.
    helm.sh/resource-policy: keep
    # What protects the data besides the PVCs. "none" is the honest answer for a
    # Cluster rendered without postgres.backup; NOTES warns about it too.
    {{- if include "agent-platform.postgres.backupEnabled" . }}
    agent-platform.giantswarm.io/backup: {{ .Values.postgres.backup.method }}
    {{- else }}
    agent-platform.giantswarm.io/backup: none
    {{- end }}
spec:
  instances: {{ .Values.postgres.instances | default 3 }}
  {{- with include "agent-platform.postgres.serviceAccountAnnotations" . }}
  # The operator creates a ServiceAccount named after the Cluster; these
  # annotations bind it to a cloud identity (IRSA role, Azure workload identity)
  # the backup sidecar uses to reach the object store.
  serviceAccountTemplate:
    metadata:
      annotations:
        {{- . | nindent 8 }}
  {{- end }}
  {{- if .Values.postgres.image.name }}
  imageName: {{ .Values.postgres.image.name | quote }}
  {{- end }}
  {{- with .Values.postgres.imagePullSecrets }}
  # The bootstrap init container runs the operator image, not the operand image,
  # so a private mirror needs these even with imageName unset.
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.postgres.affinity }}
  # CNPG's AffinityConfiguration, forwarded verbatim.
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  storage:
    size: {{ .Values.postgres.storage.size | default "20Gi" | quote }}
    {{- if .Values.postgres.storage.storageClass }}
    storageClass: {{ .Values.postgres.storage.storageClass | quote }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ $db.name | default "kagent" }}
      owner: {{ $owner }}
      postInitApplicationSQL:
        # Create the named schema so kagent's golang-migrate lands here, not public.
        - "CREATE SCHEMA IF NOT EXISTS {{ $schema }} AUTHORIZATION {{ $owner }}"
        # Default search_path routes bare CREATE TABLE into the named schema.
        # public is kept second so the vector type (in public after CREATE EXTENSION)
        # resolves correctly.
        - "ALTER ROLE {{ $owner }} SET search_path TO {{ $schema }}, public"
      {{- if and .Values.postgres.vector.enabled (not .Values.postgres.vector.extensionImage.reference) }}
      # pgvector: CREATE EXTENSION as superuser in template1 so it propagates to
      # the application database. The pgvector binary must be present in the
      # operand image (set postgres.image.name to a pgvector-bundled image).
      postInitTemplateSQL:
        - "CREATE EXTENSION IF NOT EXISTS vector"
      {{- end }}
  {{- if and .Values.postgres.vector.enabled .Values.postgres.vector.extensionImage.reference }}
  # CNPG 1.29+ / PG 18 ImageVolume: mount the pgvector binary from a sidecar
  # OCI image. A Database CR (database.yaml) instructs CNPG to run
  # CREATE EXTENSION as the operator (superuser). Requires the Kubernetes
  # ImageVolume feature gate and the postgresql.cnpg.io/v1 Database CRD.
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: {{ .Values.postgres.vector.extensionImage.reference | quote }}
  {{- end }}
  {{- if include "agent-platform.postgres.backupEnabled" . }}
  {{- if eq .Values.postgres.backup.method "plugin" }}
  # Barman Cloud plugin (CNPG-I): archives every WAL segment to the ObjectStore
  # and takes the base backups the ScheduledBackup (backup.yaml) asks for. The
  # plugin runs as a sidecar in every instance pod. serverName is the folder
  # under the store's destinationPath; unset it defaults to the Cluster name.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "agent-platform.postgres.objectStoreName" . }}
        {{- with .Values.postgres.backup.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
  {{- else }}
  # CSI volume snapshots: base backups only, no WAL archive, no point-in-time
  # recovery. The ScheduledBackup (backup.yaml) uses method volumeSnapshot.
  backup:
    volumeSnapshot:
      className: {{ .Values.postgres.backup.volumeSnapshot.className | quote }}
      {{- with .Values.postgres.backup.volumeSnapshot.walClassName }}
      walClassName: {{ . | quote }}
      {{- end }}
      online: {{ .Values.postgres.backup.volumeSnapshot.online }}
  {{- end }}
  {{- end }}
  {{- /* Gated with the other monitor objects on
  global.observability.metrics.serviceMonitor.enabled: a cluster without the
  monitoring.coreos.com CRDs cannot admit the generated PodMonitor. */ -}}
  {{- if (include "agent-platform.serviceMonitor" .) }}
  {{- $monitorLabels := .Values.global.observability.metrics.serviceMonitor.labels | default (dict "observability.giantswarm.io/tenant" "giantswarm") }}
  # Labels the operator copies onto every object it creates for this Cluster,
  # including the generated PodMonitor. Giant Swarm's monitoring agent
  # (alloy-metrics) discovers PodMonitors by a label on the PodMonitor
  # *object* -- observability.giantswarm.io/tenant In [<tenant>], or the
  # legacy application.giantswarm.io/team Exists -- and a PodMonitor matching
  # neither selector is created and silently never scraped. CNPG's stock
  # PodMonitor labels carry neither, so the tenant label must be inherited
  # here; a podMonitorRelabelings entry cannot do this, it only rewrites
  # scraped series, not the object's labels. The labels come from
  # global.observability.metrics.serviceMonitor.labels, defaulting to the
  # Giant Swarm tenant label.
  inheritedMetadata:
    labels:
      {{- toYaml $monitorLabels | nindent 6 }}
  # Enable built-in CNPG PodMonitor for metrics scraping.
  # Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - sourceLabels: [__name__]
        regex: cnpg_.*
        action: keep
  {{- end }}
{{- end }}
