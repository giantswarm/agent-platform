{{- if and .Values.postgres.enabled (include "agent-platform.kyvernoPolicies" .) }}
{{- if and .Values.postgres.vector.enabled .Values.postgres.vector.extensionImage.reference }}
{{- $ns := .Values.postgres.namespace | default .Release.Namespace }}
{{- $clusterName := .Values.postgres.clusterName }}
# GS clusters enforce restrict-volume-types: a pod may mount only configMap, csi,
# downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected and secret.
#
# postgres.vector.extensionImage.reference mounts the pgvector binary from an
# ImageVolume (volume type `image`, CNPG 1.29+ / PG 18). That type is not in the
# allow-list, so admission rejects every instance pod the operator creates and the
# Cluster never reaches an active instance. kagent's controller then crashloops on
# its pgvector migration check, because there is no database to connect to.
#
# Scope: the cnpg.io/cluster label the operator sets on this Cluster's instance
# pods and on its own bootstrap/join Jobs. Both carry the ImageVolume. The rule
# is restrict-volume-types' restricted-volumes (kyvernoPolicies.rules).
#
# PolicyExceptions must live in policy-exceptions, giantswarm, flux-giantswarm or
# kube-system — restrict-polex-namespaces enforces this.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ $clusterName }}-image-volume
  namespace: {{ .Values.kyvernoPolicies.policyExceptionNamespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  exceptions:
  {{- include "agent-platform.kyverno.exceptions" (dict "root" $ "rules" (list "restricted-volumes")) | nindent 2 }}
  match:
    any:
    - resources:
        kinds:
        - Pod
        - Job
        namespaces:
        - {{ $ns }}
        selector:
          matchLabels:
            cnpg.io/cluster: {{ $clusterName }}
{{- end }}
{{- end }}
