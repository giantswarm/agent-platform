{{- if eq (include "agent-platform.postgres.crossplane" .) "aws" }}
{{- $xp := .Values.postgres.backup.crossplane }}
{{- $aws := $xp.aws }}
{{- $ns := .Values.postgres.namespace | default .Release.Namespace }}
{{- $clusterName := .Values.postgres.clusterName }}
{{- $bucket := $aws.bucketName }}
{{- $tags := include "agent-platform.postgres.crossplaneTags" . | fromYaml }}
{{- include "agent-platform.crossplane.aws.bucket" (dict "root" . "xp" $xp "bucket" $bucket "lifecycleDays" $aws.lifecycleDays "tags" $tags
      "bucketComment" (list "The S3 bucket for WAL and base backups. Never deleted by Crossplane (no Delete" "management policy) and kept by Helm: the backups outlive the release.")
      "lifecycleComment" (list "Objects expire after lifecycleDays, a safety net above the plugin's retention.")) }}
---
# The IAM role the plugin sidecar assumes through IRSA: trusted for the Cluster's
# own ServiceAccount (<clusterName>, created by the CNPG operator) and for
# <clusterName>-restore* ServiceAccounts, so a scratch Cluster restored from the
# store can read it without its own role.
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ include "agent-platform.postgres.awsRoleName" . }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: iam
  annotations:
    crossplane.io/external-name: {{ include "agent-platform.postgres.awsRoleName" . }}
spec:
  managementPolicies:
    {{- include "agent-platform.postgres.crossplaneManagementPolicies" . | nindent 4 }}
  forProvider:
    description: {{ printf "Backups of the CloudNativePG cluster %s/%s (agent-platform)" $ns $clusterName | quote }}
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {{- include "agent-platform.crossplane.aws.trustStatement" (dict "xp" $xp "sub" (printf "system:serviceaccount:%s:%s" $ns $clusterName)) | nindent 10 }},
          {{- include "agent-platform.crossplane.aws.trustStatement" (dict "xp" $xp "sub" (printf "system:serviceaccount:%s:%s-restore*" $ns $clusterName) "op" "StringLike") | nindent 10 }}
        ]
      }
    inlinePolicy:
      - name: {{ include "agent-platform.postgres.awsRoleName" . }}
        policy: |
          {{- include "agent-platform.crossplane.aws.s3Policy" (dict "xp" $xp "bucket" $bucket) | nindent 10 }}
    tags:
      {{- toYaml $tags | nindent 6 }}
  providerConfigRef:
    name: {{ $xp.providerConfigRef }}
{{- end }}
