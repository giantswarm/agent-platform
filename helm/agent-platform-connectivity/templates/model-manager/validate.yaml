{{- /*
Render-time guards of the model-manager component. They fail `helm template`
(and therefore CI lint + install) with an actionable message instead of
shipping a service that cannot reach a statically listed backend, a second
login provider beside global.identity, or a route the API server rejects.
*/ -}}
{{- if (include "agent-platform.modelManager.enabled" .) }}
  {{- $mm := .Values.modelManager }}
  {{- $chart := include "agent-platform.modelManager.chartValues" . | fromJson }}
  {{- $backends := include "agent-platform.modelManager.backends" . | fromJsonArray }}
  {{- /* One model-manager runs no, one or several static backends
         (model-manager.backends, else [model-manager.backend], else none: the
         default, backends registered at runtime); every guard below applies
         to every listed driver and none to a registered one, which
         model-manager validates when it reads the document. $backend keeps
         the kserve API guard — which the standalone umbrella patches by text
         — keyed on one name: kserve when it is listed, else the default
         (first) backend, empty without one. */ -}}
  {{- $backend := include "agent-platform.modelManager.backend" . }}
  {{- if has "kserve" $backends }}{{- $backend = "kserve" }}{{- end }}
  {{- $_ := include "agent-platform.modelManager.fullname" . }}

  {{- /* The chart's schema types `backend` as a free string and `backends` as
         strings; a typo would start the service with a driver it does not
         have, a repeated name a process that refuses to start. */ -}}
  {{- range $name := $backends }}
    {{- if not (or (eq $name "ollama") (eq $name "kserve") (eq $name "lemonade") (eq $name "lmstudio")) }}
      {{- fail (printf "model-manager backend %q (model-manager.backends / model-manager.backend) is invalid; must be one of: ollama, kserve, lemonade, lmstudio" $name) }}
    {{- end }}
  {{- end }}
  {{- if ne (len $backends) (len (uniq $backends)) }}
    {{- fail (printf "model-manager.backends (%s) lists a driver twice: one model-manager runs each driver at most once" (join ", " $backends)) }}
  {{- end }}

  {{- /* The ollama backend proxies a host Ollama: the endpoint is the one
         input an install must provide (the chart's own default,
         host.docker.internal, is a Docker Desktop guess). */ -}}
  {{- if include "agent-platform.modelManager.hasBackend" (dict "root" . "name" "ollama") }}
    {{- $endpoint := include "agent-platform.modelManager.ollamaEndpoint" . }}
    {{- if not $endpoint }}
      {{- fail "ollama is among the model-manager backends but model-manager.ollama.endpoint is empty: set the Ollama API base URL as reached from pods (e.g. http://ollama.models.svc.cluster.local:11434)" }}
    {{- end }}
    {{- if not (regexMatch "^https?://[^/]+" $endpoint) }}
      {{- fail (printf "model-manager.ollama.endpoint (%q) must be an http(s) URL with a host, e.g. http://ollama.models.svc.cluster.local:11434" $endpoint) }}
    {{- end }}
  {{- end }}

  {{- /* The lemonade backend proxies a host Lemonade Server (FastFlowLM on
         AMD Ryzen AI NPUs, llama.cpp): the endpoint is the one input an
         install must provide, as for ollama. */ -}}
  {{- if include "agent-platform.modelManager.hasBackend" (dict "root" . "name" "lemonade") }}
    {{- $endpoint := include "agent-platform.modelManager.lemonadeEndpoint" . }}
    {{- if not $endpoint }}
      {{- fail "lemonade is among the model-manager backends but model-manager.lemonade.endpoint is empty: set the Lemonade Server base URL as reached from pods (e.g. http://172.21.0.1:13305 — Lemonade listens on 13305 by default)" }}
    {{- end }}
    {{- if not (regexMatch "^https?://[^/]+" $endpoint) }}
      {{- fail (printf "model-manager.lemonade.endpoint (%q) must be an http(s) URL with a host, e.g. http://172.21.0.1:13305" $endpoint) }}
    {{- end }}
  {{- end }}

  {{- /* The lmstudio backend proxies a host LM Studio (llama.cpp, MLX on
         Apple silicon): the endpoint is the one input an install must
         provide, as for ollama. */ -}}
  {{- if include "agent-platform.modelManager.hasBackend" (dict "root" . "name" "lmstudio") }}
    {{- $endpoint := include "agent-platform.modelManager.lmstudioEndpoint" . }}
    {{- if not $endpoint }}
      {{- fail "lmstudio is among the model-manager backends but model-manager.lmstudio.endpoint is empty: set the LM Studio base URL as reached from pods (e.g. http://172.21.0.1:1234 — LM Studio listens on 1234 by default)" }}
    {{- end }}
    {{- if not (regexMatch "^https?://[^/]+" $endpoint) }}
      {{- fail (printf "model-manager.lmstudio.endpoint (%q) must be an http(s) URL with a host, e.g. http://172.21.0.1:1234" $endpoint) }}
    {{- end }}
  {{- end }}

  {{- /* agentHost is the address model-manager writes into the ModelConfigs —
         what an agent pod dials for inference, which may differ from the
         endpoint model-manager itself dials. Optional: unset, the endpoint
         above stands in, and that one is already guarded. A set value is
         parsed by the network policies with urlParse, which answers an empty
         host for a value carrying no scheme and errors on some others, so it
         needs the endpoint's shape. */ -}}
  {{- $chart := include "agent-platform.modelManager.chartValues" . | fromJson }}
  {{- range $name, $example := dict "ollama" "http://172.21.0.1:11434" "lemonade" "http://172.21.0.1:13305" "lmstudio" "http://172.21.0.1:1234" }}
    {{- if include "agent-platform.modelManager.hasBackend" (dict "root" $ "name" $name) }}
      {{- $agentHost := dig $name "agentHost" "" $chart }}
      {{- if and $agentHost (not (regexMatch "^https?://[^/]+" $agentHost)) }}
        {{- fail (printf "model-manager.%s.agentHost (%q) must be an http(s) URL with a host, e.g. %s — it is the address the ModelConfigs carry, and the network policies parse it as a URL" $name $agentHost $example) }}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- /* The kserve backend manages InferenceServices: it needs KServe on the
         cluster. Only checkable through its CRDs at render time — unless this
         platform installs KServe itself: with the kserve-resources component
         (or the modelServing wiring that runs on it) on, that component's own
         guards own the check and a missing API is the first install, where the
         CRDs arrive in the same reconcile. Optional components: a roster that
         does not carry them yet is not force-on. */ -}}
  {{- $kserveBundled := or (include "agent-platform.optionalComponentEnabled" (dict "root" . "name" "kserve-resources")) (include "agent-platform.optionalComponentEnabled" (dict "root" . "name" "modelServing")) }}
  {{- if and (eq $backend "kserve") $mm.kserve.requireApi (not $kserveBundled) (not (.Capabilities.APIVersions.Has "serving.kserve.io/v1beta1")) }}
    {{- fail "model-manager.backend is kserve but the serving.kserve.io/v1beta1 API (InferenceService) is not on the cluster and no component of this chart installs it: turn on the KServe components (components.kserve-crd, components.kserve-resources; with components.modelServing for the platform's serving runtime) or install KServe first. For an offline render pass --api-versions serving.kserve.io/v1beta1, or set modelManager.kserve.requireApi=false to skip this check." }}
  {{- end }}

  {{- /* ModelConfig wiring lands in the kagent namespace: the ModelConfigs
         model-manager creates must land where the kagent controller reads them.
         With kagent off the meta chart forwards kagent.disableWiring: true to
         the model-manager release (agent-platform.componentDerivedValues) —
         model-manager is on by default and kagent is not — so the block's own
         value is only read with kagent on. */ -}}
  {{- if and (not (dig "kagent" "disableWiring" false $chart)) (include "agent-platform.componentEnabled" (dict "root" . "name" "kagent")) }}
    {{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
    {{- $mmKagentNs := include "agent-platform.modelManager.kagentNamespace" . }}
    {{- if ne $kagentNs $mmKagentNs }}
      {{- fail (printf "model-manager.kagent.namespace (%s) must equal the kagent component's namespace (%s, kagent.namespaceOverride): the ModelConfigs model-manager creates must land where the kagent controller reads them" $mmKagentNs $kagentNs) }}
    {{- end }}
  {{- end }}

  {{- /* The MCPServer CRD ships with the muster component, so the MCP surface
         follows it: with components.muster off the meta chart forwards
         muster.mcpServer.enabled: false to the model-manager release
         (agent-platform.componentDerivedValues) — model-manager is on by
         default and an installation may run without muster — and the muster
         peer policy (netpol.yaml) reads the same toggle. Nothing to guard. */ -}}

  {{- /* The component release resolves its OAuth inputs through the chart's
         global.identity / global.domain fallbacks. model-manager is on by
         default (giantswarm/agent-platform#329), so this guard follows the
         muster guard's convention exactly: a value in the component block
         that disagrees with global.identity would give two components two
         different logins — checked only where both sides are set, so a render
         that sets no global.identity (a bare `helm template`, global.domain or
         global.identity.issuerUrl alone for hostnames or a JWT issuer, an
         install that configures the component block itself) is untouched and
         a missing input is reported by the child release, as for muster. The
         opt-in managers (agent-manager, vm-manager) keep their absence guards,
         the way kagent's fire only with its route on. */ -}}
  {{- if and (include "agent-platform.modelManager.oauthEnabled" .) (eq (include "agent-platform.modelManager.oauthProvider" .) "dex") }}
    {{- $oauth := dig "oauth" dict $chart }}
    {{- $dex := dig "dex" dict $oauth }}
    {{- $identity := .Values.global.identity }}
    {{- range $pair := list (list "dex.issuerURL" (dig "issuerURL" "" $dex) "issuerUrl" $identity.issuerUrl) (list "dex.clientID" (dig "clientID" "" $dex) "clientId" $identity.clientId) (list "existingSecret" (dig "existingSecret" "" $oauth) "existingSecret" $identity.existingSecret) }}
      {{- $own := index $pair 1 }}{{- $global := index $pair 3 }}
      {{- if and $own $global (ne (toString $own) (toString $global)) }}
        {{- fail (printf "model-manager.oauth.%s (%s) differs from global.identity.%s (%s); the platform has one login provider" (index $pair 0) $own (index $pair 2) $global) }}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- /* Backends registered at runtime need their egress listed by hand
         (modelManager.networkPolicy.registeredBackends): the chart cannot see
         a ConfigMap written while the service runs. Every entry is a map with
         a TCP port and exactly one destination — a cidr that parses as IPv4,
         or an fqdn (a hostname, not a URL). An fqdn is a Cilium FQDN selector:
         under the kubernetes flavor, with policies on, vanilla NetworkPolicy
         has nothing to render it into, so the render fails naming the flavor
         instead of shipping a policy that silently drops the backend. */ -}}
  {{- range $i, $entry := ($mm.networkPolicy.registeredBackends | default list) }}
    {{- $at := printf "modelManager.networkPolicy.registeredBackends[%d]" $i }}
    {{- if not (kindIs "map" $entry) }}
      {{- fail (printf "%s: every entry is a map with a port and exactly one of cidr or fqdn, e.g. {cidr: 10.244.0.0/16, port: 11434}; got %v" $at $entry) }}
    {{- end }}
    {{- $cidr := toString ($entry.cidr | default "") }}
    {{- $fqdn := toString ($entry.fqdn | default "") }}
    {{- if and $cidr $fqdn }}
      {{- fail (printf "%s sets both cidr (%s) and fqdn (%s): one destination per entry — list two entries" $at $cidr $fqdn) }}
    {{- end }}
    {{- if not (or $cidr $fqdn) }}
      {{- fail (printf "%s names no destination: set cidr (an IPv4 block, e.g. 10.244.0.0/16) or fqdn (a hostname, cilium flavor only)" $at) }}
    {{- end }}
    {{- if and $cidr (not (regexMatch `^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$` $cidr)) }}
      {{- fail (printf "%s.cidr (%q) is not an IPv4 CIDR: an address block with a prefix length, e.g. 10.244.0.0/16, or a single address as 10.0.0.7/32" $at $cidr) }}
    {{- end }}
    {{- if and $fqdn (not (regexMatch `^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$` $fqdn)) }}
      {{- fail (printf "%s.fqdn (%q) is not a hostname: the name the backend is reached by, e.g. ollama.models.svc.cluster.local — no scheme, port or path" $at $fqdn) }}
    {{- end }}
    {{- if and $fqdn $.Values.networkPolicy.enabled (ne (include "agent-platform.networkPolicyFlavor" $) "cilium") }}
      {{- fail (printf "%s.fqdn (%s) needs the cilium network-policy flavor (networkPolicy.flavor: cilium, a Cilium FQDN selector): the resolved flavor is kubernetes, and vanilla NetworkPolicy selects addresses, never names — list the backend's address as cidr instead" $at $fqdn) }}
    {{- end }}
    {{- if not (hasKey $entry "port") }}
      {{- fail (printf "%s has no port: the TCP port the backend listens on is required (11434 for Ollama, 1234 for LM Studio, 13305 for Lemonade)" $at) }}
    {{- end }}
    {{- $port := $entry.port }}
    {{- if or (not (or (kindIs "float64" $port) (kindIs "int64" $port) (kindIs "int" $port))) (lt ($port | int) 1) (gt ($port | int) 65535) }}
      {{- fail (printf "%s.port (%v) is not a TCP port: a number from 1 to 65535" $at $port) }}
    {{- end }}
  {{- end }}

  {{- if $mm.route.enabled }}
    {{- /* The route renders agentgateway.dev resources on the agentgateway
           Gateway. */ -}}
    {{- if not (include "agent-platform.ingress.agentgateway" .) }}
      {{- fail "modelManager.route renders agentgateway.dev resources on the agentgateway Gateway; it requires an agentgateway-* ingress.mode" }}
    {{- end }}
    {{- if not (include "agent-platform.componentEnabled" (dict "root" . "name" "agentgateway")) }}
      {{- fail "modelManager.route.enabled is true but components.agentgateway.enabled is false: the route attaches to the agentgateway data plane" }}
    {{- end }}
    {{- if not (hasPrefix "/" $mm.route.pathPrefix) }}
      {{- fail (printf "modelManager.route.pathPrefix (%q) must start with /" $mm.route.pathPrefix) }}
    {{- end }}
    {{- /* An HTTPRoute with no hostname on the shared public Gateway matches
           ALL traffic to that Gateway. The hostname helper derives
           agentgateway.<global.domain> when the override is empty, and fails
           the render when neither is set. */ -}}
    {{- $_ := include "agent-platform.modelManager.hostname" . }}
    {{- /* A parentRef override needs both halves: a route with namespace ""
           is rejected by the Gateway API CRD, silently breaking the install. */ -}}
    {{- if and $mm.route.parentRef.name (not $mm.route.parentRef.namespace) }}
      {{- fail "modelManager.route.parentRef.name is set but .namespace is empty. Set both (the Gateway API CRD rejects an empty namespace), or clear .name to fall back to the chart-owned edge / global.gatewayApi.parentRefs." }}
    {{- end }}
    {{- if ($mm.route.jwtAuthentication).enabled }}
      {{- /* A JWT policy without an issuer validates nothing dex-shaped. The
             issuer defaults from global.identity.issuerUrl; the helper fails
             the render when both are empty. */ -}}
      {{- if not $mm.route.jwtAuthentication.issuer }}
        {{- $_ := include "agent-platform.issuerUrl" (dict "ctx" . "for" "modelManager.route.jwtAuthentication (or set its .issuer)") }}
      {{- end }}
      {{- /* An in-cluster JWKS endpoint needs jwksEgress; an external one is
             covered by the controller policy's own rules, on the port the route names.
             The shared helper carries every JWKS guard. */ -}}
      {{- $_ := include "agent-platform.jwks.validate" (dict "ctx" . "path" "modelManager.route.jwtAuthentication" "jwks" $mm.route.jwtAuthentication.jwks) }}
    {{- end }}
  {{- end }}
{{- end }}
