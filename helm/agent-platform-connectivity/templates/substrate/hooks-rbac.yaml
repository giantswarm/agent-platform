{{- /*
The identity the hook Jobs of this release run as (templates/_hooks.tpl): a
ServiceAccount in the release namespace, a ClusterRole on what has no
namespace of its own and Roles on the Secrets and ConfigMaps the hooks write.

The ClusterRole: get and create on namespaces (the substrate-namespaces Job),
the podcert signers' ClusterTrustBundles the bootstrap publishes (get, list,
watch, create and patch, never delete) plus `attest` on the two podcert
signers, which the apiserver demands of whoever writes a bundle naming them,
persistentvolumeclaims (and get on storageclasses) while this chart applies
model serving's cache claim (templates/model-serving/cache-pvc.yaml), delete on
the pre-pull DaemonSet by name while it renders (templates/model-serving/prepull.yaml),
and the ModelConfigs llmRouting reconciles. It reads no Secret and no
ConfigMap: on a management cluster every workload cluster's kubeconfig is a
Secret.

The Roles (agent-platform.hooks.secretGrants): one per namespace a hook writes,
at that hook's events only, with get, list, watch, patch and delete on exactly
the names it reads or writes. create is not narrowed by name (the apiserver
cannot: a create names no object in its URL), and creates nothing readable.
Weight -3: after the substrate-namespaces Job (-4) created the namespaces the
bootstrap's Roles live in, before the Jobs (0). The databases hook runs
post-install, when every namespace of postgres.databases.*.secretNamespaces
exists or the hook fails as it would without a Role.

The ServiceAccount and ClusterRole are created for each hook event the rendered
Jobs use (agent-platform.hooks.events) at weight -5, and every object here is
removed once the event's hooks succeeded.
*/ -}}
{{- if include "agent-platform.hooks.enabled" . }}
{{- $name := include "agent-platform.hooks.serviceAccountName" . }}
{{- $events := include "agent-platform.hooks.events" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: {{ $events }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: {{ $events }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  {{- if include "agent-platform.substrate.enabled" . }}
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  {{- end }}
  {{- if include "agent-platform.modelServing.cacheClaimManaged" . }}
  # The cache claim hook (templates/model-serving/cache-pvc.yaml) server-side
  # applies the claim into the serving namespace: get says created or present
  # and reads the phase, create + patch are what an apply of a missing and of
  # an existing object need. Never delete: the claim outlives the release.
  # get on StorageClasses: whether the claim's class still exists, and its
  # parameters, which the hook stamps on the claim as its tier (#605).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  {{- end }}
  {{- if include "agent-platform.modelServing.prepull.enabled" . }}
  # The pre-pull cleanup hook (templates/model-serving/prepull.yaml, pre-delete)
  # deletes the DaemonSet the post-install/post-upgrade hook created — a hook
  # object the uninstall would otherwise leave behind: delete on exactly that
  # DaemonSet, nothing else.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: [{{ include "agent-platform.modelServing.prepull.name" . | quote }}]
    verbs: ["delete"]
  {{- end }}
  {{- if include "agent-platform.llmRouting.modelConfigs" . }}
  # The ModelConfig reconcile of llmRouting
  # (templates/llm/modelconfig-routing-hook.yaml) lists the ModelConfigs and
  # merge-patches the baseUrl and its mark. Never create or delete.
  - apiGroups: ["api.kagent.dev"]
    resources: ["modelconfigs"]
    verbs: ["get", "list", "patch"]
  {{- end }}
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # A ClusterTrustBundle that names a signer is admitted only for a client
  # allowed to attest that signer (the podcertificate-controller's own
  # ClusterRole carries sign + attest on servicedns.podcert.ate.dev/* and
  # podidentity.podcert.ate.dev/*); the bootstrap publishes the two signers'
  # bundles, so it attests exactly those two — never sign.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["servicedns.podcert.ate.dev/identity", "podidentity.podcert.ate.dev/identity"]
    verbs: ["attest"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: {{ $events }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $grant := include "agent-platform.hooks.secretGrants" . | fromJsonArray }}
{{- $roleName := printf "%s-%s" $name $grant.purpose }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $grant.namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: {{ $grant.events }}
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  {{- range $grant.rules }}
  - apiGroups: [""]
    resources: [{{ .resource | quote }}]
    {{- with .names }}
    resourceNames: {{ toJson . }}
    {{- end }}
    verbs: {{ toJson .verbs }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ $grant.namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
    app.kubernetes.io/component: hooks
  annotations:
    helm.sh/hook: {{ $grant.events }}
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
