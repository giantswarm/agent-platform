{{- /* The kagent namespace exists only while the kagent component is on: an
installation without kagent gets no empty, Helm-owned namespace, and turning
kagent off removes it with the release (the standalone umbrella's generator
patched this gate into its copy; it was a bug here too). */ -}}
{{- $kagentOn := include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent") }}
{{- if and $kagentOn .Values.kagent.namespaceOverride (ne .Values.kagent.namespaceOverride .Release.Namespace) }}
# The kagent namespace, adopted where the cluster created it (a management
# cluster's bases, the bundled engine's kagent HelmRelease with
# install.createNamespace) and created here otherwise. It is KEPT
# (helm.sh/resource-policy: keep): Helm never deletes it — not on `helm
# uninstall` of the platform, whose agents' workloads and Helm storage stay
# behind orphaned in it (README "Uninstalling"), and not as the install
# remediation of a failed first install of this release, which used to take the
# namespace and every kagent object in it down with the release (measured on
# the ATS kind smoke: a PolicyException without its namespace failed the
# install, the remediation deleted the kagent namespace, kagent's pods with it).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.kagent.namespaceOverride }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    application.giantswarm.io/team: {{ index .Chart.Annotations "io.giantswarm.application.team" | quote }}
{{- end }}
