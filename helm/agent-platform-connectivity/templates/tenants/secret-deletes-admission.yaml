{{- /*
A Secret delete that would answer with the Secret (giantswarm/agent-platform#1355,
#1365). agent-platform:admin holds create, update and delete on Secrets and no
get (clusterroles.yaml): a tenant's admin places credential Secrets it never
reads back. The API server answers some deletes with the stored object, data
included, also on a dry run: Orphan or Foreground propagation and
orphanDependents add a garbage collector finalizer, and a Secret a finalizer
already holds is only marked; a DeleteCollection is answered with the list of
its items. A requester holding delete without get would read the Secret.

agent-platform-secret-deletes admits such a delete only for a requester that
may read the Secret already: get, list, watch or patch it (a patch answers
with the stored Secret too), by the policy's authorizer checks, with the
Secret's name, so a rule limited to resourceNames counts. It renders whenever
kagent is on, with agent-platform:admin, and matches every namespace,
organizations on or off: the role can be bound in any namespace (the kagent
namespace, an organization namespace, a tenant namespace of agent-manager),
and admission cannot read where it is bound. Every other delete (Background
or no propagation, of a Secret no finalizer holds) is answered with a Status
and is not matched.

It holds no requester that may read the Secret: cluster-admin, the namespace
controller and the garbage collector (both get every object), Flux's
controllers and the ServiceAccounts they impersonate (an apply gets the
object first), cert-manager, external-secrets, Cluster API, and the API
server's own controllers (tests/verify-secret-deletes.py reads their default
roles: none deletes Secrets without one of the four; the legacy service
account token cleaner holds delete and patch).

A DeleteCollection by a requester who may not read the Secrets can still
answer with an item another request deleted between the API server's list and
the item's delete: that item's delete returns NotFound before admission, and
the collection answers with the list (k8s.io/apiserver store.go
DeleteCollection). Admission cannot see it; agent-platform:admin holds no
deletecollection.
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-platform-secret-deletes
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["secrets"]
  matchConditions:
    # A delete the API server answers with the stored object: the garbage
    # collector's finalizer is added (Orphan, Foreground, orphanDependents),
    # or a finalizer already holds the Secret; a background delete of a
    # Secret without finalizers is answered with a Status. A DeleteCollection
    # (a request with no name) is always answered with the list of its items.
    - name: answered-with-the-secret
      expression: >-
        !has(request.name) || request.name == '' ||
        (has(oldObject.metadata.finalizers) && size(oldObject.metadata.finalizers) > 0) ||
        (has(request.options.propagationPolicy) && request.options.propagationPolicy in ['Orphan', 'Foreground']) ||
        (has(request.options.orphanDependents) && request.options.orphanDependents == true)
  # The Secret under delete is named by oldObject: a DeleteCollection runs
  # admission once for each item with the collection request's attributes,
  # which carry no name (request.name is unset), while oldObject is the
  # stored item. On a single delete the two names are the same.
  # The authorizer's cost allows two checks per expression
  # (k8s.io/apiserver pkg/cel/library/cost.go): two variables of two each,
  # evaluated only when the first does not admit.
  variables:
    - name: secret
      expression: >-
        authorizer.group('').resource('secrets').namespace(request.namespace).name(oldObject.metadata.name)
    - name: readsOne
      expression: >-
        variables.secret.check('get').allowed() || variables.secret.check('patch').allowed()
    - name: readsMany
      expression: >-
        variables.secret.check('list').allowed() || variables.secret.check('watch').allowed()
  validations:
    - expression: >-
        variables.readsOne || variables.readsMany
      reason: Forbidden
      messageExpression: >-
        'a delete answered with the Secret (Orphan or Foreground propagation, a finalizer on it, or a DeleteCollection) is made only by a requester that may read it (get, list, watch or patch); refused: ' +
        request.namespace + '/' + oldObject.metadata.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-platform-secret-deletes
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  policyName: agent-platform-secret-deletes
  validationActions: [Deny]
{{- end }}
