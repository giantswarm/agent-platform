{{- /*
A Secret delete that would answer with the Secret (giantswarm/agent-platform#1355,
#1365). agent-platform:admin holds create, update and delete on Secrets and no
get (clusterroles.yaml): a tenant's admin places credential Secrets it never
reads back. The API server answers some deletes with the stored object, data
included, also on a dry run: Orphan or Foreground propagation and
orphanDependents add a garbage collector finalizer, and a Secret a finalizer
already holds is only marked; a DeleteCollection is answered with the list of
its items. A requester holding delete without get would read the Secret.

agent-platform-secret-deletes admits such a delete only for a requester that
may get the Secret (the policy's authorizer check). It renders whenever kagent
is on, with agent-platform:admin, and matches every namespace, organizations
on or off: the role can be bound in any namespace (the kagent namespace, an
organization namespace, a tenant namespace of agent-manager), and admission
cannot read where it is bound. Every other delete (Background or no
propagation, of a Secret no finalizer holds) is answered with a Status and is
not matched.

Who it does not hold:
  * a requester that may get the Secret: cluster-admin, the namespace
    controller and the garbage collector (both get every object), Flux's
    controllers and the ServiceAccounts they impersonate (an apply gets the
    object first), cert-manager, external-secrets, Cluster API;
  * the cluster's own controller that deletes Secrets with delete and no get,
    the legacy-service-account-token-cleaner of kube-system (its bootstrap
    role system:controller:legacy-service-account-token-cleaner; it deletes
    an unused legacy token Secret with no options, matched only when a
    finalizer holds it). It is the only default role of the API server that
    deletes Secrets without get (tests/verify-secret-deletes.py reads them).
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-platform-secret-deletes
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["secrets"]
  matchConditions:
    # The cluster's own controller that deletes Secrets without get.
    - name: not-the-token-cleaner
      expression: >-
        request.userInfo.username != 'system:serviceaccount:kube-system:legacy-service-account-token-cleaner'
    # A delete the API server answers with the stored object: the garbage
    # collector's finalizer is added (Orphan, Foreground, orphanDependents),
    # or a finalizer already holds the Secret; a background delete of a
    # Secret without finalizers is answered with a Status. A DeleteCollection
    # (a request with no name) is always answered with the list of its items.
    - name: answered-with-the-secret
      expression: >-
        !has(request.name) || request.name == '' ||
        (has(oldObject.metadata.finalizers) && size(oldObject.metadata.finalizers) > 0) ||
        (has(request.options.propagationPolicy) && request.options.propagationPolicy in ['Orphan', 'Foreground']) ||
        (has(request.options.orphanDependents) && request.options.orphanDependents == true)
  # The Secret under delete is named by oldObject: a DeleteCollection runs
  # admission once for each item with the collection request's attributes,
  # which carry no name (request.name is unset), while oldObject is the
  # stored item. On a single delete the two names are the same.
  validations:
    - expression: >-
        authorizer.group('').resource('secrets').namespace(request.namespace).name(oldObject.metadata.name).check('get').allowed()
      reason: Forbidden
      messageExpression: >-
        'a delete answered with the Secret (Orphan or Foreground propagation, a finalizer on it, or a DeleteCollection) is made only by a requester that may get it; refused: ' +
        request.namespace + '/' + oldObject.metadata.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-platform-secret-deletes
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  policyName: agent-platform-secret-deletes
  validationActions: [Deny]
{{- end }}
