{{- /*
The Secrets an object of the kagent namespace, the platform tenant, may name.
A controller resolves such a reference with its own ServiceAccount and sends
the value where the object's writer chooses: a git credentialRef of an Agent's
or AgentTemplate's skill or plugin source to the source's host, a
RemoteMCPServer's headersFrom Secret to the server's URL, an EgressPolicy's
destinations[].authentication.secretKeyRef to the destination, a ModelConfig's
apiKeySecret to its base URL. The kagent namespace holds the platform's own
Secrets (the model keys, the database credentials, the skills credential), so
a writer who may not read one would otherwise read it through such an object.

agent-platform-platform-tenant-credential-refs refuses, in the kagent namespace
only, the creation of an Agent, AgentTemplate, RemoteMCPServer, EgressPolicy or
ModelConfig, or an update that changes its spec, when one of those references
names a Secret the requester may not `get` in the object's namespace (the
policy's authorizer check). The namespaces labelled giantswarm.io/organization
are held by name prefix instead (egress-policy-admission.yaml), where a
tenant's admins place Secrets they cannot read. An update that leaves the spec
as it is (finalizers, labels, annotations, status) and a write to an object
already being deleted are admitted, so its controllers never need the
Secret. It reads the five kinds untyped (apiVersions "*") like the tenants'
policies, and matches nothing on a cluster that does not serve them.
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-platform-platform-tenant-credential-refs
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $kagentNs | quote }}
    resourceRules:
      - apiGroups: ["api.kagent.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agents", "agenttemplates", "remotemcpservers", "egresspolicies", "modelconfigs"]
  matchConditions:
    - name: spec-written
      expression: >-
        request.operation == 'CREATE' ||
        (has(object.spec) ? dyn(object.spec) : dyn({})) != (has(oldObject.spec) ? dyn(oldObject.spec) : dyn({}))
    - name: not-deleting
      expression: "!has(object.metadata.deletionTimestamp)"
  # The objects read untyped: the policy matches five kinds of every served
  # version.
  variables:
    - name: spec
      expression: "has(object.spec) ? dyn(object.spec) : dyn({})"
    # An Agent carries its template inline under spec.template.
    - name: template
      expression: >-
        request.resource.resource == 'agents' ?
        ('template' in variables.spec ? dyn(variables.spec.template) : dyn({})) : variables.spec
    - name: sources
      expression: >-
        request.resource.resource in ['agents', 'agenttemplates'] ?
        ('skills' in variables.template ? dyn(variables.template.skills) : dyn([])) +
        ('plugins' in variables.template ? dyn(variables.template.plugins) : dyn([])) : dyn([])
    - name: refs
      expression: >-
        variables.sources.filter(s, has(s.source) && has(s.source.git) && has(s.source.git.credentialRef))
        .map(s, has(s.source.git.credentialRef.name) ? string(s.source.git.credentialRef.name) : '') +
        (request.resource.resource == 'remotemcpservers' && 'headersFrom' in variables.spec ?
        dyn(variables.spec.headersFrom).filter(h, has(h.valueFrom) && has(h.valueFrom.type) && h.valueFrom.type == 'Secret')
        .map(h, has(h.valueFrom.name) ? string(h.valueFrom.name) : '') : dyn([])) +
        (request.resource.resource == 'egresspolicies' && 'destinations' in variables.spec ?
        dyn(variables.spec.destinations).filter(d, has(d.authentication) && has(d.authentication.secretKeyRef))
        .map(d, has(d.authentication.secretKeyRef.name) ? string(d.authentication.secretKeyRef.name) : '') : dyn([])) +
        (request.resource.resource == 'modelconfigs' && 'apiKeySecret' in variables.spec ?
        [string(variables.spec.apiKeySecret)] : dyn([]))
  # The authorizer is not available to a messageExpression, so the refusal
  # names every referenced Secret. An empty name asks for every Secret of the
  # namespace.
  validations:
    - expression: >-
        variables.refs.all(n,
        authorizer.group('').resource('secrets').namespace(request.namespace).name(n).check('get').allowed())
      reason: Forbidden
      messageExpression: >-
        'in the kagent namespace, ' + request.kind.kind + ' ' + request.name + ' may name only Secrets its writer may get,
        as a git credentialRef, a headersFrom Secret, a secretKeyRef or an apiKeySecret. Refused for ' +
        request.userInfo.username + ', who may not get at least one of: ' +
        variables.refs.map(n, n == '' ? '<no name>' : n).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-platform-platform-tenant-credential-refs
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  policyName: agent-platform-platform-tenant-credential-refs
  validationActions: [Deny]
{{- end }}
