{{- /*
The platform tenant (giantswarm/agent-platform#706; the agent-permissions plan,
D4): the kagent namespace keeps the platform's agents for everyone. Every
signed-in person (tenants.platform.users) is agent-platform-user there; the
platform's operators (tenants.platform.authors) and the customer's platform
team (tenants.platformTeam) are agent-platform-author. A list left empty
renders no binding.
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $t := .Values.tenants }}
{{- with include "agent-platform.tenants.subjects" (list $t.platform.users) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-platform-user
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-platform-user
subjects:
  {{- . | nindent 2 }}
{{- end }}
{{- with include "agent-platform.tenants.subjects" (list $t.platform.authors $t.platformTeam) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-platform-author
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-platform-author
subjects:
  {{- . | nindent 2 }}
{{- end }}
{{- end }}
