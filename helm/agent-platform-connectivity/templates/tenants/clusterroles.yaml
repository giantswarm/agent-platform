{{- /*
The three roles of an agent tenant (giantswarm/agent-platform#706; the
agent-permissions plan, D2). A tenant is a namespace: the kagent namespace (the
platform tenant) or one labelled giantswarm.io/organization. A tenant's
RoleBindings bind groups to these ClusterRoles in its namespace; the chart
binds the platform tenant only (platform-tenant.yaml). The names are fixed:
the bindings an installation declares refer to them, and the tenant-admin's
`bind` names them.

The kagent line serves api.kagent.dev: an agent is an Agent that carries its
AgentTemplate inline or by templateRef, and a conversation is a Session of an
Agent, so `create` on sessions is what starting a conversation asks for. The
author's writes are the ones agent-manager performs as the caller
(oauth.downstream): the agent's HelmRelease and the shared OCIRepository, the
Agent and RemoteMCPServer it deletes when a release leaves them behind, and
the reads it reports on (Harnesses, events). No role carries `escalate`.
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform-user
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  {{- include "agent-platform.tenants.userRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform-author
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  {{- include "agent-platform.tenants.userRules" . | nindent 2 }}
  {{- include "agent-platform.tenants.authorRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform-tenant-admin
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  {{- include "agent-platform.tenants.userRules" . | nindent 2 }}
  {{- include "agent-platform.tenants.authorRules" . | nindent 2 }}
  - apiGroups: ["api.kagent.dev"]
    resources: ["modelconfigs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # A tenant admin binds members to the three roles and nothing else: the API
  # server refuses a RoleBinding to any other role whose rights the admin does
  # not hold.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["agent-platform-user", "agent-platform-author", "agent-platform-tenant-admin"]
{{- end }}
