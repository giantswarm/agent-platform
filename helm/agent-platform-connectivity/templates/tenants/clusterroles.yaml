{{- /*
The three roles of an agent tenant (giantswarm/agent-platform#706; the
agent-permissions plan, D2). A tenant is a namespace: the kagent namespace (the
platform tenant) or an organization namespace, labelled
agent-platform.giantswarm.io/organization. A tenant's
RoleBindings bind groups to these ClusterRoles in its namespace; the chart
binds the platform tenant only (platform-tenant.yaml), its signed-in people
to agent-platform:platform-user, the user's role without the platform's
EgressPolicies and RoleBindings. The names are fixed:
the bindings an installation declares refer to them, and the admin role's
`bind` names them.

The kagent line serves api.kagent.dev: an agent is an Agent that carries its
AgentTemplate inline or by templateRef, and a conversation is a Session of an
Agent, so `create` on sessions is what starting a conversation asks for. The
editor's writes are the ones agent-manager performs as the caller
(oauth.downstream): the agent's HelmRelease, the Agent and RemoteMCPServer it
deletes when a release leaves them behind, and the reads it reports on
(Harnesses, events, the namespace's agent chart OCIRepository, which the
editor reads and never writes). The admin also owns the
tenant's egress: it writes EgressPolicies and places the Secrets they name,
which it may create, replace and delete but never read back (no get, list,
watch or patch on Secrets, as a patch answers with the stored Secret; a delete
answered with it, by Orphan or Foreground propagation or on a Secret a
finalizer holds, admission refuses in organization namespaces,
agent-platform-organization-secret-deletes); admission lets a tenant's EgressPolicy name only its `tenant-credential-`
Secrets (egress-policy-admission.yaml). No role carries
`escalate`.
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform:user
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  {{- include "agent-platform.tenants.userRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform:platform-user
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  {{- include "agent-platform.tenants.platformUserRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform:editor
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  {{- include "agent-platform.tenants.userRules" . | nindent 2 }}
  {{- include "agent-platform.tenants.editorRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform:admin
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  {{- include "agent-platform.tenants.userRules" . | nindent 2 }}
  {{- include "agent-platform.tenants.editorRules" . | nindent 2 }}
  - apiGroups: ["api.kagent.dev"]
    resources: ["modelconfigs", "egresspolicies"]
    verbs: ["create", "update", "patch", "delete"]
  # No patch: its response is the stored Secret, data included. A delete
  # answered with the Secret (Orphan or Foreground propagation, a finalizer
  # on it) is refused in admission (agent-platform-organization-secret-deletes).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The admin binds members to the three roles and nothing else: the API
  # server refuses a RoleBinding to any other role whose rights the admin does
  # not hold.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["agent-platform:user", "agent-platform:editor", "agent-platform:admin"]
{{- end }}
