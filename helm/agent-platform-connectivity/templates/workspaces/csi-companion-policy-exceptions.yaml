{{- /*
Kyverno PolicyExceptions for the CSI companion (csi-companion.yaml) on a
cluster that enforces the restricted Pod Security Standard through Kyverno
(kyvernoPolicies), one per workload, naming exactly the rules its pod spec
violates — `make verify-kyverno` computes them from the render and holds the
lists:

  * the controller (Deployment, the release namespace): every container runs
    as root — the driver images do, and the proxy must, to connect to the
    driver's root-owned socket (runAsUser 0) — with everything else of the
    restricted profile declared (no privilege escalation, all capabilities
    dropped, the runtime's seccomp profile).
  * the node plugin (DaemonSet, the release namespace): privileged on the
    node's network with host paths (the socket, Substrate's volume directory,
    efs-utils' state and configuration or the node's cloud configuration), as
    the cluster's own node plugin is — root, no drop ALL and no
    allowPrivilegeEscalation: false on the privileged container (the API
    refuses the latter), the runtime's seccomp profile on the pod.

Matched by the workload's own labels (the Deployment and DaemonSet carry
them) in the release namespace, Pod and controller kinds.
*/ -}}
{{- if and (include "agent-platform.workspaces.csiCompanion.enabled" .) (include "agent-platform.kyvernoPolicies" .) }}
{{- $c := include "agent-platform.workspaces.csiCompanion.spec" . | fromJson }}
{{- $polexNs := .Values.kyvernoPolicies.policyExceptionNamespace }}
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: csi-companion-controller
  namespace: {{ $polexNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  exceptions:
  {{- include "agent-platform.kyverno.exceptions" (dict "root" $ "rules" (list "run-as-non-root" "run-as-non-root-user")) | nindent 2 }}
  match:
    any:
    - resources:
        kinds:
        - Pod
        - Deployment
        - ReplicaSet
        namespaces:
        - {{ .Release.Namespace }}
        selector:
          matchLabels:
            app.kubernetes.io/name: csi-companion
            app.kubernetes.io/component: controller
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: csi-companion-node
  namespace: {{ $polexNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  exceptions:
  {{- include "agent-platform.kyverno.exceptions" (dict "root" $ "rules" (list "privileged-containers" "host-namespaces" "host-path" "restricted-volumes" "require-drop-all" "privilege-escalation" "run-as-non-root")) | nindent 2 }}
  match:
    any:
    - resources:
        kinds:
        - Pod
        - DaemonSet
        namespaces:
        - {{ .Release.Namespace }}
        selector:
          matchLabels:
            app.kubernetes.io/name: csi-companion
            app.kubernetes.io/component: node
{{- end }}
