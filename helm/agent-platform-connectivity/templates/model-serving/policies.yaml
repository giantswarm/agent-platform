{{- $ms := .Values.modelServing }}
{{- if and (include "agent-platform.modelServing.enabled" .) (include "agent-platform.modelServingPolicies" .) }}
{{- $ns := include "agent-platform.modelServing.namespace" . }}
{{- $name := include "name" . }}
{{- $shapes := include "agent-platform.modelServing.podShapes" . | fromJsonArray }}
{{- /* Kyverno variables, kept out of Helm's way: the JMESPath that counts the
       storage-initializer init containers KServe injected (a pod without one
       — a custom container without a model URI — is left alone). The
       backtick JMESPath literal cannot sit inside a Go raw string, hence
       printf. The served model's name comes from the pod's labels, whatever
       the pod's shape (the shapes, their name labels and their runtime
       containers: _helpers.tpl, agent-platform.modelServing.podShapes). */ -}}
{{- $backtick := "`" }}
{{- $hasStorageInitializer := printf "{{ length(request.object.spec.initContainers[?name=='storage-initializer'] || %s[]%s) }}" $backtick $backtick }}
{{- $podMatch := include "agent-platform.modelServing.kyvernoMatch" (dict "root" .) | trim }}
# Admission-time wiring of every model pod in the serving namespace — the
# classic InferenceService predictor and the LLMInferenceService workload pod
# the llm-d controller creates alike; they share no label, so each rule
# matches both shapes (Kyverno mutate policies; rendered where kyverno.io/v1 is
# served — modelServing.policies.enabled follows the resolved
# kyvernoPolicies.enabled).
# Per rule:
#   redirect-model-storage-*   (one per pod shape, naming its runtime
#                              container) the storage-initializer's and the
#                              runtime's /mnt/models become the pod's cache
#                              subdirectory (<claim>/<model>) instead of the
#                              ephemeral emptyDir KServe mounts: a model
#                              downloads once, a restart skips the download
#                              (the storage-initializer detects the files).
#                              The pod carries the claim's fsGroup
#                              (modelServing.cache.fsGroup): the kubelet makes
#                              the claim's contents group-owned, group-writable
#                              and setgid on every mount and creates a missing
#                              subPath directory with the claim root's mode and
#                              group, so the storage-initializer (uid 1000),
#                              the runtime and model-manager's download Job
#                              (uid 1000, the same fsGroup) write
#                              <claim>/<model> without root or a capability.
#                              The chart adds no container to a model pod: a
#                              root init container that prepared the directory
#                              was denied by the fleet's restricted Pod
#                              Security Standard on two rules the chart's
#                              PolicyException does not name (#518).
#   storage-initializer-memory a memory limit that survives multi-GB downloads
#                              (KServe's default 1Gi is OOM-killed).
# The rules mutate at CREATE only: a pod's init containers are immutable, and
# the operation filter keeps later pod updates untouched. Every rule is a
# strategic merge keyed by name (containers, volumes) or mountPath (mounts):
# the API server reinvokes the webhook whenever another mutating webhook
# changed the pod after Kyverno ran, and a merge finds what it added the first
# time where a JSON-patch insert would add it again (#514). Verified with
# `kyverno apply` in tests/verify-model-serving-policies.py: over both pod
# shapes, over the policy's own output, and — the mutated pod with the chart's
# PolicyException — against the fleet's restricted-PSS ClusterPolicies.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}-model-serving-pods
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Model serving pods
    policies.kyverno.io/description: >-
      Mounts the Hugging Face cache claim into every KServe model pod in the
      {{ $ns }} namespace — InferenceService predictors and LLMInferenceService
      workload pods (one subdirectory per model, the pod carrying the claim's
      fsGroup) — and raises the storage-initializer memory limit.
spec:
  background: false
  rules:
    {{- if $ms.cache.enabled }}
    {{- /* One redirect rule per pod shape: the rule names the shape's runtime
           container, and a strategic merge adds a container it does not find
           — so a rule must never meet the other shape's pod. */ -}}
    {{- range $shape := $shapes }}
    {{- $shapeName := printf "{{ request.object.metadata.labels.%q }}" $shape.nameLabel }}
    - name: redirect-model-storage-{{ $shape.name }}
      match:
        any:
          {{- include "agent-platform.modelServing.kyvernoMatch" (dict "root" $ "shapes" (list $shape)) | trim | nindent 10 }}
      preconditions:
        all:
          - key: {{ $hasStorageInitializer | quote }}
            operator: GreaterThan
            value: 0
          - key: {{ printf "{{ length(request.object.metadata.labels.%q || '') }}" $shape.nameLabel | quote }}
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            # One claim, one group: a pod that mounts the claim carries its
            # fsGroup, whatever it declared (the other securityContext fields
            # stay).
            securityContext:
              fsGroup: {{ int $ms.cache.fsGroup }}
            volumes:
              - name: hf-cache
                persistentVolumeClaim:
                  claimName: {{ include "agent-platform.modelServing.claimName" $ }}
            # volumeMounts merge on mountPath: these replace KServe's emptyDir
            # mounts at /mnt/models (the runtime's stays read-only).
            initContainers:
              - name: storage-initializer
                volumeMounts:
                  - name: hf-cache
                    mountPath: /mnt/models
                    subPath: {{ $shapeName | quote }}
            containers:
              - name: {{ $shape.runtimeContainer }}
                volumeMounts:
                  - name: hf-cache
                    mountPath: /mnt/models
                    subPath: {{ $shapeName | quote }}
    {{- end }}
    {{- end }}
    {{- with $ms.policies.storageInitializerMemoryLimit }}
    - name: storage-initializer-memory
      match:
        any:
          {{- $podMatch | nindent 10 }}
      preconditions:
        all:
          - key: {{ $hasStorageInitializer | quote }}
            operator: GreaterThan
            value: 0
      mutate:
        patchStrategicMerge:
          spec:
            initContainers:
              - name: storage-initializer
                resources:
                  limits:
                    memory: {{ . | quote }}
    {{- end }}
{{- if gt (int $ms.policies.progressDeadlineSeconds) 0 }}
---
# KServe exposes no progressDeadlineSeconds on the InferenceService or the
# LLMInferenceService; the Kubernetes default (600s) is shorter than a first
# model download and fires rollout-stuck alerts while the pod is healthy and
# busy. The Deployments carry the labels of the pods they run.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ $name }}-model-serving-deployments
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Model serving Deployments
    policies.kyverno.io/description: >-
      Sets progressDeadlineSeconds on every InferenceService and
      LLMInferenceService Deployment in the {{ $ns }} namespace, long enough
      for a first model download.
spec:
  background: false
  rules:
    - name: progress-deadline
      match:
        any:
          {{- include "agent-platform.modelServing.kyvernoMatch" (dict "root" . "kinds" (list "Deployment") "operations" (list "CREATE" "UPDATE")) | trim | nindent 10 }}
      mutate:
        patchStrategicMerge:
          spec:
            progressDeadlineSeconds: {{ int $ms.policies.progressDeadlineSeconds }}
{{- end }}
{{- end }}
