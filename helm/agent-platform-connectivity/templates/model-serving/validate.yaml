{{- /*
Render-time guards of the modelServing wiring. They fail `helm template` (and
therefore CI lint + install) with an actionable message instead of shipping
objects the API server rejects or a preset the portal cannot use.
*/ -}}
{{- if (include "agent-platform.modelServing.enabled" .) }}
  {{- $ms := .Values.modelServing }}
  {{- /* The KServe control plane the runtime and the InferenceServices need:
         the platform's own (components.kserve-crd + kserve-resources — the
         connectivity release dependsOn kserve-resources, so the CRDs and the
         webhook are Established before these objects apply), or a KServe the
         cluster already runs, which Helm sees through .Capabilities.APIVersions
         on install/upgrade (an offline `helm template` has to be told with
         --api-versions). Neither: fail, naming the toggles. */ -}}
  {{- if and $ms.kserve.requireApi (not (include "agent-platform.modelServing.kserveBundled" .)) (not (include "agent-platform.modelServing.kserveApiPresent" .)) }}
    {{- fail "components.modelServing.enabled is true but the KServe control plane is not: turn on components.kserve-crd and components.kserve-resources (the platform's KServe; the model serving objects apply after them), or install KServe first — the serving.kserve.io/v1alpha1 (ClusterServingRuntime) and serving.kserve.io/v1beta1 (InferenceService) APIs are not served on this cluster. For an offline render pass --api-versions serving.kserve.io/v1alpha1 --api-versions serving.kserve.io/v1beta1, or set modelServing.kserve.requireApi=false to skip this check." }}
  {{- end }}
  {{- /* The Kyverno cache policies are Kyverno mutate policies: an explicit
         policies.enabled: true needs the kyverno.io objects to render (auto
         follows the resolved kyvernoPolicies.enabled and never trips this). */ -}}
  {{- if and (include "agent-platform.modelServingPolicies" .) (not (include "agent-platform.kyvernoPolicies" .)) }}
    {{- fail "modelServing.policies.enabled is true but kyvernoPolicies.enabled resolves to false: the cache policies are Kyverno ClusterPolicies and need kyverno.io/v1 on the cluster. Set modelServing.policies.enabled: auto (follows kyvernoPolicies.enabled) or false, or turn kyvernoPolicies.enabled on where Kyverno runs." }}
  {{- end }}
  {{- /* Image verification (giantswarm/agent-platform#552): an enabled block
         names what to verify and whom to trust, and its knobs are Kyverno's
         own values — a typo would otherwise render a rule that verifies
         nothing under an installation that believes its images are verified.
         Checked whenever the block is on, Kyverno served or not. */ -}}
  {{- with $ms.imageVerification }}
  {{- if .enabled }}
    {{- $iv := . }}
    {{- range $key, $_ := . }}
      {{- if not (has $key (list "enabled" "images" "attestors" "mutateDigest" "required" "failureAction")) }}
        {{- fail (printf "modelServing.imageVerification.%s is not a key of the block: enabled, images, attestors, mutateDigest, required, failureAction" $key) }}
      {{- end }}
    {{- end }}
    {{- if not .images }}
      {{- fail "modelServing.imageVerification.images is empty: name the image references to verify (Kyverno imageReferences, e.g. gsoci.azurecr.io/giantswarm/models/*), or set modelServing.imageVerification.enabled: false" }}
    {{- end }}
    {{- range $i, $image := .images }}
      {{- if or (not (kindIs "string" $image)) (not $image) }}
        {{- fail (printf "modelServing.imageVerification.images[%d] must be an image reference or a wildcard pattern (got %v)" $i $image) }}
      {{- end }}
    {{- end }}
    {{- if not .attestors }}
      {{- fail "modelServing.imageVerification.attestors is empty: name at least one trusted signer (a Kyverno attestor entry: keyless, keys or certificates), or set modelServing.imageVerification.enabled: false" }}
    {{- end }}
    {{- range $i, $entry := .attestors }}
      {{- if or (not (kindIs "map" $entry)) (not (or (hasKey $entry "keyless") (hasKey $entry "keys") (hasKey $entry "certificates") (hasKey $entry "attestor"))) }}
        {{- fail (printf "modelServing.imageVerification.attestors[%d] must be a Kyverno attestor entry: a mapping with keyless, keys, certificates or attestor" $i) }}
      {{- end }}
    {{- end }}
    {{- range $knob := list "mutateDigest" "required" }}
      {{- if not (has (toString (get $iv $knob)) (list "true" "false")) }}
        {{- fail (printf "modelServing.imageVerification.%s must be true or false (got %v)" $knob (get $iv $knob)) }}
      {{- end }}
    {{- end }}
    {{- if not (has (toString .failureAction) (list "Enforce" "Audit")) }}
      {{- fail (printf "modelServing.imageVerification.failureAction must be Enforce or Audit (got %v)" .failureAction) }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- if not $ms.runtime.name }}
    {{- fail "modelServing.runtime.name is empty: the ClusterServingRuntime needs a name, and every preset without a runtime of its own runs on it" }}
  {{- end }}
  {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $ms.runtime.name) }}
    {{- fail (printf "modelServing.runtime.name (%q) must be a lowercase DNS-1123 label" $ms.runtime.name) }}
  {{- end }}
  {{- if and $ms.cache.enabled (not $ms.cache.pvc.existingClaim) (not $ms.cache.pvc.name) }}
    {{- fail "modelServing.cache.pvc.name is empty: name the cache claim, or set cache.pvc.existingClaim" }}
  {{- end }}
  {{- /* The models Gateway (#326): an issuer to verify against, a resolvable
         JWKS source, a certificate for its listener. The GatewayClass is not
         checked — the controller is the platform's release's or this one's
         (components.agentgateway), and nothing is detected. */ -}}
  {{- if (include "agent-platform.modelServing.modelsGateway.enabled" .) }}
    {{- $mg := $ms.modelsGateway }}
    {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $mg.name) }}
      {{- fail (printf "modelServing.modelsGateway.name (%q) must be a lowercase DNS-1123 label" $mg.name) }}
    {{- end }}
    {{- if not $mg.jwtAuthentication.audiences }}
      {{- fail "modelServing.modelsGateway.jwtAuthentication.audiences is empty: the models Gateway accepts the installation's login client only (dex-k8s-authenticator); name it, or the tokens of every client the issuer mints would open every model" }}
    {{- end }}
    {{- $_ := include "agent-platform.modelServing.modelsGateway.issuer" . }}
    {{- $_ := include "agent-platform.jwks.validate" (dict "ctx" . "path" "modelServing.modelsGateway.jwtAuthentication" "jwks" (include "agent-platform.modelServing.modelsGateway.jwks" . | fromJson)) }}
    {{- if not (include "agent-platform.modelServing.modelsGateway.tlsSecretName" .) }}
      {{- fail "modelServing.modelsGateway.tls names no certificate: set gatewayApi.gateway.tls.secretName (the platform's wildcard), modelServing.modelsGateway.tls.secretName, or tls.issuerRef.name for a cert-manager Certificate of the models host" }}
    {{- end }}
  {{- end }}
  {{- /* Every preset in effect must resolve: the helpers fail on a bad name,
         a missing required field or an unresolvable chat template. */ -}}
  {{- $presets := include "agent-platform.modelServing.presets" . | fromJson }}
  {{- range $name, $entry := $presets }}
    {{- $_ := include "agent-platform.modelServing.resolvePreset" (dict "root" $ "name" $name "entry" $entry) }}
  {{- end }}
  {{- /* The GPU node pool input (gpuPool, giantswarm/agent-platform#315): the
         taint's effect is one of the three taint effects (empty tolerates every
         effect of the key), the key a qualified name (empty: an untainted
         pool), the pool selector a map of string label values. */ -}}
  {{- $gp := $ms.gpuPool }}
  {{- if not (kindIs "map" $gp.taint) }}
    {{- fail "modelServing.gpuPool.taint must be a mapping with key, value and effect (key empty for an untainted pool)" }}
  {{- end }}
  {{- if not (has (toString $gp.taint.effect) (list "" "NoSchedule" "PreferNoSchedule" "NoExecute")) }}
    {{- fail (printf "modelServing.gpuPool.taint.effect (%q) must be NoSchedule, PreferNoSchedule or NoExecute (empty tolerates every effect of the key)" (toString $gp.taint.effect)) }}
  {{- end }}
  {{- if and $gp.taint.key (not (regexMatch "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$" (toString $gp.taint.key))) }}
    {{- fail (printf "modelServing.gpuPool.taint.key (%q) must be a taint key (a qualified name such as nvidia.com/gpu), or empty for an untainted pool" (toString $gp.taint.key)) }}
  {{- end }}
  {{- if not (kindIs "map" $gp.nodeSelector) }}
    {{- fail "modelServing.gpuPool.nodeSelector must be a mapping of node labels, e.g. giantswarm.io/machine-pool: <cluster>-<pool>" }}
  {{- end }}
  {{- range $k, $v := $gp.nodeSelector }}
    {{- if not (kindIs "string" $v) }}
      {{- fail (printf "modelServing.gpuPool.nodeSelector[%s] (%v) must be a string: a label value is a string, quote it" $k $v) }}
    {{- end }}
  {{- end }}
  {{- /* The network-policy inputs, checked only while the policies render
         (networkPolicy.enabled): a typo would otherwise ship a selector that
         matches nothing or an object the API server rejects. */ -}}
  {{- if .Values.networkPolicy.enabled }}
    {{- $np := $ms.networkPolicy }}
    {{- $port := int $np.predictor.port }}
    {{- if or (lt $port 1) (gt $port 65535) }}
      {{- fail (printf "modelServing.networkPolicy.predictor.port (%v) must be a TCP port (1-65535): the port the runtime container listens on" $np.predictor.port) }}
    {{- end }}
    {{- range $i, $n := $np.predictor.additionalIngressNamespaces }}
      {{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (toString $n)) }}
        {{- fail (printf "modelServing.networkPolicy.predictor.additionalIngressNamespaces[%d] (%q) must be a namespace name (lowercase DNS-1123 label)" $i (toString $n)) }}
      {{- end }}
    {{- end }}
    {{- range $i, $f := $np.huggingFace.fqdns }}
      {{- if not (kindIs "map" $f) }}
        {{- fail (printf "modelServing.networkPolicy.huggingFace.fqdns[%d] must be a mapping with matchName or matchPattern (a Cilium FQDN selector)" $i) }}
      {{- end }}
      {{- $matchName := get $f "matchName" | default "" }}
      {{- $matchPattern := get $f "matchPattern" | default "" }}
      {{- if or (ne (len (keys $f)) 1) (not (or $matchName $matchPattern)) }}
        {{- fail (printf "modelServing.networkPolicy.huggingFace.fqdns[%d] must be exactly one of matchName or matchPattern, non-empty (a Cilium FQDN selector)" $i) }}
      {{- end }}
    {{- end }}
    {{- range $i, $c := $np.huggingFace.cidrs }}
      {{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$|^[0-9a-fA-F:]+/[0-9]{1,3}$" (toString $c)) }}
        {{- fail (printf "modelServing.networkPolicy.huggingFace.cidrs[%d] (%q) must be a CIDR, e.g. 203.0.113.0/24" $i (toString $c)) }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
