{{- /*
Kyverno PolicyException for the serving model pods (giantswarm/agent-platform#498).
Giant Swarm clusters enforce the restricted Pod Security Standard through
Kyverno on every namespace; the workload pods the llm-d controller creates —
the vLLM runtime image and the KServe storage-initializer do not declare the
four fields the restricted profile checks: no drop ALL, no
allowPrivilegeEscalation: false, no runAsNonRoot, no seccompProfile. Without
this exception admission denies the Deployment and no model is ever served.
Named: exactly those four rules (kyvernoPolicies.rules), each with its autogen
copy for the controller kinds — and nothing the chart's own mutations add to
the pod needs one: they add the cache claim's fsGroup and mounts, no container
(giantswarm/agent-platform#518; tests/verify-model-serving-policies.py holds
the mutated pod to the fleet's restricted-PSS policies with this exception).
Matched in the serving namespace: the Pods, ReplicaSets and Deployments of the
LLMInferenceService workload pod by the labels they carry (_helpers.tpl,
agent-platform.modelServing.podShape — the same selector as the network
policies and the mutations, giantswarm/agent-platform#506), and the Deployment
— evaluated at its own admission against its own labels — also by the name the
llm-d controller gives it (<llminferenceservice>-kserve[-<role>]).

A model split across the nodes of a fast link (modelServing.fastLinks,
giantswarm/model-manager#190) runs as a LeaderWorkerSet whose pods take the
well-known multi-node template's capabilities IPC_LOCK (pinning the RDMA
buffers NCCL registers), SYS_RAWIO and NET_RAW. The second exception,
rendered only with a fast link declared, lets exactly those pods — a
LeaderWorkerSet's leader and workers, never a single-node model pod — add
capabilities; nothing privileged, no host namespace.
*/ -}}
{{- if and (include "agent-platform.modelServing.enabled" .) (include "agent-platform.kyvernoPolicies" .) .Values.modelServing.policyException.enabled }}
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: model-serving-predictors
  namespace: {{ .Values.kyvernoPolicies.policyExceptionNamespace }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
spec:
  exceptions:
  {{- include "agent-platform.kyverno.exceptions" (dict "root" $ "rules" (list "require-drop-all" "privilege-escalation" "run-as-non-root" "check-seccomp-strict")) | nindent 2 }}
  match:
    any:
    {{- with (include "agent-platform.modelServing.podShape" . | fromJson) }}
    # {{ .kind }} pods, their ReplicaSets and Deployments — and the
    # StatefulSets of a LeaderWorkerSet, a model split across nodes — by
    # their labels.
    - resources:
        kinds:
        - Pod
        - ReplicaSet
        - Deployment
        - StatefulSet
        namespaces:
        - {{ include "agent-platform.modelServing.namespace" $ }}
        selector:
          matchExpressions:
          {{- toYaml .matchExpressions | nindent 10 }}
    {{- end }}
    - resources:
        kinds:
        - Deployment
        - ReplicaSet
        - Pod
        - StatefulSet
        namespaces:
        - {{ include "agent-platform.modelServing.namespace" . }}
        names:
        - "*-kserve*"
{{- end }}
{{- if and (include "agent-platform.modelServing.enabled" .) (include "agent-platform.kyvernoPolicies" .) .Values.modelServing.policyException.enabled .Values.modelServing.fastLinks }}
---
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: model-serving-fast-links
  namespace: {{ .Values.kyvernoPolicies.policyExceptionNamespace }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
spec:
  exceptions:
  {{- include "agent-platform.kyverno.exceptions" (dict "root" $ "rules" (list "adding-capabilities" "adding-capabilities-strict")) | nindent 2 }}
  match:
    any:
    {{- with (include "agent-platform.modelServing.podShape" . | fromJson) }}
    # The pods of a LeaderWorkerSet and their StatefulSets, by their labels.
    - resources:
        kinds:
        - Pod
        - StatefulSet
        namespaces:
        - {{ include "agent-platform.modelServing.namespace" $ }}
        selector:
          matchExpressions:
          {{- toYaml .multiNodeExpressions | nindent 10 }}
    {{- end }}
    # A LeaderWorkerSet's StatefulSets, evaluated at their own admission, by
    # the name the LeaderWorkerSet gives them (<llminferenceservice>-kserve-mn[-…]).
    - resources:
        kinds:
        - StatefulSet
        namespaces:
        - {{ include "agent-platform.modelServing.namespace" . }}
        names:
        - "*-kserve-mn*"
{{- end }}
