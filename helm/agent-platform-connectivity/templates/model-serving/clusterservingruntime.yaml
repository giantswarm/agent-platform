{{- if (include "agent-platform.modelServing.enabled" .) }}
{{- /* The default runtime (modelServing.runtime) and every
       modelServing.additionalRuntimes entry, the entry's unset fields the
       default's (giantswarm/agent-platform#550): one ClusterServingRuntime
       each, from the one template below. */ -}}
{{- range $i, $rt := (include "agent-platform.modelServing.runtimes" . | fromJson).runtimes }}
{{- /* The GPU node pool (modelServing.gpuPool): its toleration first and its
       selector under the runtime's own; KServe copies both onto every
       predictor pod of the runtime. Nothing renders when both are empty. */ -}}
{{- $sched := include "agent-platform.modelServing.poolScheduling" (dict "root" $ "tolerations" $rt.tolerations "nodeSelector" $rt.nodeSelector) | fromJson }}
{{- if $i }}
---
# An additional vLLM serving runtime, modelServing.additionalRuntimes[{{ sub $i 1 }}]
# (cluster-scoped): a preset selects it with spec.runtime. Every field the
# entry leaves unset is the default runtime's (modelServing.runtime); the
# container runs through the same shell entrypoint as the default's, with
# this runtime's own base arguments, so its image must carry /bin/sh and
# `vllm` on PATH as well.
{{- else }}
# The vLLM serving runtime every preset runs on (cluster-scoped). KServe
# merges an InferenceService's predictor.model spec over this container:
# the preset's args are appended, its env and resources win field by field,
# and {{ "{{.Name}}" }} in args expands to the InferenceService name. The image
# is the upstream x86-64 CUDA build by default; an install with other
# hardware points modelServing.runtime.image at its own build.
#
# The container runs through a shell entrypoint with the well-known llm-d
# runtime template's argument grammar: `sh -c 'eval "exec vllm serve $@"' --`
# followed by the runtime's base arguments and, appended by KServe, the
# preset's. The eval re-parses every argument, so a JSON-valued flag written
# single-quoted inside one argument (--limit-mm-per-prompt='{"image": 1}')
# reaches vLLM as one word with the quotes gone on this path exactly as on
# the llm-d template; straight into argv the quotes stayed and vLLM refused
# the value (giantswarm/agent-platform#549). The image must carry /bin/sh and
# `vllm` on PATH (the upstream vLLM images do).
{{- end }}
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: {{ $rt.name }}
  labels:
    {{- include "agent-platform.modelServing.labels" $ | nindent 4 }}
spec:
  {{- with $rt.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sched.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sched.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: kserve-container
      image: {{ printf "%s/%s:%s" $rt.image.registry $rt.image.name $rt.image.version | quote }}
      command:
        - /bin/sh
        - -c
        - 'eval "exec vllm serve $@"'
        - "--"
      {{- with $rt.args }}
      args:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $rt.env }}
      env:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        {{- toYaml $rt.resources | nindent 8 }}
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: {{ $rt.startupProbe.initialDelaySeconds }}
        periodSeconds: {{ $rt.startupProbe.periodSeconds }}
        failureThreshold: {{ $rt.startupProbe.failureThreshold }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: {{ $rt.shmSize | quote }}
  protocolVersions:
    - v1
    - v2
  supportedModelFormats:
    {{- toYaml $rt.supportedModelFormats | nindent 4 }}
{{- end }}
{{- end }}
