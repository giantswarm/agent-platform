{{- if (include "agent-platform.modelServing.enabled" .) }}
{{- $ms := .Values.modelServing }}
{{- $presets := include "agent-platform.modelServing.presets" . | fromJson }}
# Discovery ConfigMap of the model-serving layer, read by the portal's serve
# flow and by model-manager: where the LLMInferenceServices go, which defaults
# they get, which cache claim to mount and where the presets are.
# Fixed name and label, in the release namespace:
#   kubectl -n {{ .Release.Namespace }} get configmap -l agent-platform.giantswarm.io/model-serving-config=true
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-model-serving
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
    agent-platform.giantswarm.io/model-serving-config: "true"
data:
  config.yaml: |
    apiVersion: agent-platform.giantswarm.io/v1alpha1
    kind: ModelServingConfig
    spec:
      # The namespace the LLMInferenceServices are created in.
      namespace: {{ include "agent-platform.modelServing.namespace" . }}
      # Defaults of every LLMInferenceService composed from a preset.
      gpuResourceName: {{ $ms.serving.gpuResourceName }}
      runtimeClassName: {{ $ms.serving.runtimeClassName | quote }}
      nodeSelector:
        {{- if $ms.serving.nodeSelector }}
        {{- toYaml $ms.serving.nodeSelector | nindent 8 }}
        {{- else }} {}
        {{- end }}
      # The GPU node pool (modelServing.gpuPool): the taint every serving
      # workload tolerates and the pool's label(s). The presets carry both
      # already; model-manager schedules the LLMInferenceServices it composes,
      # its download Jobs and its inventory scan pods by the same input (a
      # registered backend document may override it). No taint means an
      # untainted pool.
      gpuPool:
        {{- with $ms.gpuPool.taint.key }}
        taint:
          key: {{ . | quote }}
          value: {{ $ms.gpuPool.taint.value | default "" | quote }}
          effect: {{ $ms.gpuPool.taint.effect | default "" | quote }}
        {{- end }}
        nodeSelector:
          {{- if $ms.gpuPool.nodeSelector }}
          {{- toYaml $ms.gpuPool.nodeSelector | nindent 10 }}
          {{- else }} {}
          {{- end }}
      # Whether this chart renders network policies for the serving namespace
      # (networkPolicy.enabled), and in which flavor (kubernetes | cilium).
      networkPolicy:
        enabled: {{ .Values.networkPolicy.enabled }}
        flavor: {{ include "agent-platform.networkPolicyFlavor" . }}
      cache:
        enabled: {{ $ms.cache.enabled }}
        {{- if $ms.cache.enabled }}
        # The claim in the serving namespace that holds one subdirectory per
        # served model (its name), mounted at mountPath in the model pod.
        claimName: {{ include "agent-platform.modelServing.claimName" . }}
        mountPath: /mnt/models
        # Whether the Kyverno policies redirect the KServe storage-initializer
        # into that claim at admission (no LLMInferenceService change needed).
        redirectPolicy: {{ if (include "agent-platform.modelServingPolicies" .) }}true{{ else }}false{{ end }}
        {{- end }}
      # The models Gateway every LLMInferenceService route attaches to, and the
      # path convention a served model answers on (#326).
      gateway:
        {{- if (include "agent-platform.modelServing.modelsGateway.enabled" .) }}
        enabled: true
        name: {{ $ms.modelsGateway.name }}
        namespace: {{ .Release.Namespace }}
        endpoint: https://{{ include "agent-platform.modelServing.modelsGateway.host" . }}
        pathConvention: /<namespace>/<model>/v1
        {{- else }}
        enabled: false
        {{- end }}
      {{- if and (include "agent-platform.llmRouting" .) (include "agent-platform.modelManager.enabled" .) }}
      # The LLM endpoint (llmRouting): the route model-manager attaches one
      # AgentgatewayModel per served model to, in its namespace, and the
      # listener's in-cluster URL a client (an agent's ModelConfig) reaches
      # the models at, by name (giantswarm/model-manager#145).
      llmEndpoint:
        enabled: true
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: {{ include "name" . }}-llm
            namespace: {{ .Release.Namespace }}
        endpoint: {{ include "agent-platform.llmBaseUrl" . }}
      {{- end }}
      # Models as OCI images (modelServing.modelImages): the registry host
      # every oci:// preset's storageUri is published with — empty, as
      # written — so a consumer that builds an image reference of its own
      # (model-manager) uses the host the presets do.
      modelImages:
        registry: {{ include "agent-platform.modelServing.modelImages.registry" . | quote }}
      presets:
        namespace: {{ .Release.Namespace }}
        labelSelector: agent-platform.giantswarm.io/serving-preset=true
        names:
          {{- if $presets }}
          {{- range $name, $_ := $presets }}
          - {{ $name }}
          {{- end }}
          {{- else }} []
          {{- end }}
{{- end }}
