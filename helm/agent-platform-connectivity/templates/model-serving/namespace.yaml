{{- if (include "agent-platform.modelServing.enabled" .) }}
{{- $ms := .Values.modelServing }}
{{- $ns := include "agent-platform.modelServing.namespace" . }}
{{- if and $ms.namespace.create (ne $ns .Release.Namespace) }}
# The serving namespace: InferenceServices, the cache PVC and the chat-template
# ConfigMaps live here; the Kyverno policies match pods in it. Helm-owned, and
# KEPT while the cache is on (helm.sh/resource-policy: keep): the cache claim
# outlives the release by design (cache-pvc.yaml), and a namespace Helm
# deleted took the claim and its volume down with it — every pool teardown
# downloaded the weights again (#537). So an uninstall leaves the namespace,
# the claim and its volume behind, nothing else (the chat-template ConfigMaps,
# the presets and the policies go with the release), and a re-install adopts
# the namespace (its Helm annotations are unchanged). With the cache off the
# namespace goes with the release, as any Helm-owned object. Set
# namespace.create: false for a namespace that already exists (a
# GitOps-managed one, for example).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  {{- if $ms.cache.enabled }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
    {{- with $ms.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
