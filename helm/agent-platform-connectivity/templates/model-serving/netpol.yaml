{{- $ms := .Values.modelServing }}
{{- if and (include "agent-platform.modelServing.enabled" .) .Values.networkPolicy.enabled }}
{{- $np := $ms.networkPolicy }}
{{- $ns := include "agent-platform.modelServing.namespace" . }}
{{- $name := include "name" . }}
{{- $kagentOn := include "agent-platform.componentEnabled" (dict "root" . "name" "kagent") }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $shapes := include "agent-platform.modelServing.podShapes" . | fromJsonArray }}
{{- /* Network policies of the serving namespace, in the flavor networkPolicy
       selects (auto: cilium where cilium.io/v2 is served). The model pods are
       every pod KServe runs for a served model, in either of its shapes — the
       classic InferenceService predictor and the LLMInferenceService workload
       pod (_helpers.tpl, agent-platform.modelServing.podShapes; the two share
       no label and listen on different ports — the classic predictor's 8080,
       the llm-d workload's 8000, the port its Service targets — so a policy
       renders per shape with that shape's port, #525) — whatever the runtime; the
       storage-initializer is an init container of that pod, so one egress
       rule covers the download and the runtime. model-manager's pre-warm
       download Jobs (kserve backend) run in the same namespace under their
       own labels. */ -}}

{{- if eq (include "agent-platform.networkPolicyFlavor" .) "cilium" }}
{{- range $shape := $shapes }}
{{- $port := int $shape.port }}
---
# {{ $shape.kind }} pods: ingress on the runtime port from the callers of the
# OpenAI-compatible API, egress to DNS and the model download endpoints.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-model-serving-{{ $shape.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" $ | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      {{- toYaml $shape.matchExpressions | nindent 6 }}
  ingress:
    - fromEndpoints:
        {{- if and $kagentOn (include "agent-platform.substrate.enabled" $) }}
        # The agents: an actor's ModelConfig dials the predictor Service (:80,
        # translated to the pod port before policy evaluation) through Agent
        # Substrate's egress gateway, which is where the connection leaves.
        - matchLabels:
            app: atenet-egress
            io.kubernetes.pod.namespace: {{ include "agent-platform.substrate.namespace" $ }}
        {{- end }}
        # The release namespace: Backstage, model-manager, the agentgateway
        # data plane.
        - matchLabels:
            io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
        {{- range $np.predictor.additionalIngressNamespaces }}
        - matchLabels:
            io.kubernetes.pod.namespace: {{ . }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $port | quote }}
              protocol: TCP
    # The kubelet's startup and readiness probes arrive from the host entity.
    # Under policyEnforcementMode always, a policy without this rule
    # default-denies them and the predictor is killed before it turns Ready.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: {{ $port | quote }}
              protocol: TCP
  egress:
    {{- include "agent-platform.dnsEgressWithProxy" $ | nindent 4 }}
    {{- include "agent-platform.modelServing.huggingFaceEgress.cilium" $ | trim | nindent 4 }}
{{- end }}
---
# model-manager's pre-warm download Jobs (kserve backend): DNS and the model
# download endpoints; they serve nothing and mount no ServiceAccount token.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-model-serving-download
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: model-manager
      model-manager.giantswarm.io/component: download
  egress:
    {{- include "agent-platform.dnsEgressWithProxy" . | nindent 4 }}
    {{- include "agent-platform.modelServing.huggingFaceEgress.cilium" . | trim | nindent 4 }}
{{- if $kagentOn }}
---
# Egress from kagent agent pods to the model pods of either shape, on that
# shape's port. The chart's agent egress (templates/kagent/netpol.yaml) admits
# world and cluster on 443 only; Cilium evaluates after service translation, so
# the model pod's own port is what must be allowed (Cilium policies are
# additive to the agents' own).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-kagent-agents-to-model-serving
  namespace: {{ include "agent-platform.substrate.namespace" . }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: atenet-egress
  egress:
    {{- range $shapes }}
    - toEndpoints:
        - matchExpressions:
            {{- toYaml .matchExpressions | nindent 12 }}
          matchLabels:
            io.kubernetes.pod.namespace: {{ $ns }}
      toPorts:
        - ports:
            - port: {{ int .port | quote }}
              protocol: TCP
    {{- end }}
{{- end }}

{{- else }}
{{- range $shape := $shapes }}
{{- $port := int $shape.port }}
---
# {{ $shape.kind }} pods: ingress on the runtime port from the callers of the
# OpenAI-compatible API. The kubelet's probes are not subject to
# NetworkPolicy; the kagent agents' own egress is unrestricted in this flavor
# (the chart renders no egress policy for agent pods), so no agent-side rule
# is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-model-serving-{{ $shape.name }}-ingress
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      {{- toYaml $shape.matchExpressions | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if and $kagentOn (include "agent-platform.substrate.enabled" $) }}
        # The agents: an actor's ModelConfig dials the predictor through Agent
        # Substrate's egress gateway, which is where the connection leaves.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "agent-platform.substrate.namespace" $ }}
          podSelector:
            matchLabels:
              app: atenet-egress
        {{- end }}
        # The release namespace: Backstage, model-manager, the agentgateway
        # data plane.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
        {{- range $np.predictor.additionalIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ $port }}
          protocol: TCP
---
# {{ $shape.kind }} pods: egress to DNS and the model download endpoints (the
# storage-initializer's download and the runtime's own Hub lookups).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-model-serving-{{ $shape.name }}-egress
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      {{- toYaml $shape.matchExpressions | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- include "agent-platform.dnsEgress.kubernetes" $ | nindent 4 }}
    {{- include "agent-platform.modelServing.huggingFaceEgress.kubernetes" $ | trim | nindent 4 }}
{{- end }}
---
# model-manager's pre-warm download Jobs (kserve backend): DNS and the model
# download endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-model-serving-download-egress
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: model-manager
      model-manager.giantswarm.io/component: download
  policyTypes: [Egress]
  egress:
    {{- include "agent-platform.dnsEgress.kubernetes" . | nindent 4 }}
    {{- include "agent-platform.modelServing.huggingFaceEgress.kubernetes" . | trim | nindent 4 }}
{{- end }}
{{- end }}
