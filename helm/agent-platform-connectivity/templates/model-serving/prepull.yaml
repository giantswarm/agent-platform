{{- /*
The pre-pull DaemonSet of the serving namespace (giantswarm/agent-platform#545).
A predictor pulls its runtime image only when its main container starts, after
the storage-initializer has finished the weights, so on a pool scaling from zero
the two longest steps of a cold start run one after the other — measured on a
fresh node: weights 116 s, then 115 s for the 8.8 GB llm-d-cuda image. The
image is the same for every served model of an installation, and a node knows
it is a GPU node the moment it joins: this DaemonSet runs on every node its
selector and the pool's own label (gpuPool.nodeSelector, merged under it)
select, tolerating the pool's taint and — by default — every other, so it is
scheduled under the node's start-up taints. One init container per image runs
/bin/true: the kubelet pulls the image before it starts, in parallel with the
storage-initializer, and containerd keeps it for the predictor, whose Pulled
event then reads "already present on machine". The pause container keeps the
pod — and with it nothing else — running.

The selector (giantswarm/agent-platform#562): modelServing.prepull.nodeSelector
when the installation sets one — that map alone; empty, the chart's default,
Karpenter's karpenter.k8s.aws/instance-gpu-manufacturer: nvidia, the label on
every node of a GPU instance type. The default is the helper's
(agent-platform.modelServing.prepull.nodeSelector, _helpers.tpl), not a values
default, so a set map is never merged with it. The pool's label is merged
under either.

The DaemonSet is a HOOK, not a release resource (giantswarm/agent-platform#563).
A pod whose image cannot be pulled is never Ready, and a release's wait counts
a DaemonSet ready by its pods: helm-controller from 1.6 waits with the kstatus
poller, which needs every pod of a DaemonSet Ready (Helm 3's legacy waiter,
still on helm-controller 1.4, takes maxUnavailable: 100% as ready once the pods
are scheduled — the fleet runs both). As a release resource, one listed image
not yet pullable — a runtime image or a modelPresets image still being built,
a registry outage — held the pods in ImagePullBackOff, timed the wait out and
failed the whole connectivity upgrade with every other object applied. Hook
objects are outside every waiter's set: WatchUntilReady watches Jobs and Pods
only, in Helm 3, Helm 4 and helm-controller alike. So the DaemonSet is created
by the post-install, post-upgrade and post-rollback events at weight 0 — after
the release's objects are applied and waited for — and nothing waits for its
pods: an image that is not there yet leaves them retrying on the kubelet's
backoff and the release Ready. before-hook-creation replaces the previous
DaemonSet on the next event; its pods come back on images already present. A
hook object is not Helm's to delete on uninstall, so the pre-delete hook Job
below removes it (the hook include agent-platform.hooks.job; the identity
<release>-hooks carries delete on exactly this DaemonSet,
templates/substrate/hooks-rbac.yaml). The deny-all policy stays a release
resource: nothing waits for a policy.

modelServing.prepull.modelPresets (giantswarm/agent-platform#551) adds the model
images: a preset served from an OCI model image (spec.model.storageUri oci://…,
KServe's modelcar path) has its weights pulled by containerd like any image, so
one init container per named preset — pull-model-<preset>, on the preset's image
as published (the registry host modelServing.modelImages.registry swaps in),
after the runtime images — has every serving node hold the weights before the
first serve, and the running pause pod keeps a 100 GiB image against the node's
image garbage collection. A modelcar image is busybox-based (the README's
contract), so /bin/true is there. A name that is not a published preset, or
whose model is not oci://, fails the render naming it.

The pods hold no GPU (no nvidia.com/gpu resource, no runtimeClassName), mount
no ServiceAccount token, and need no network: the pull is the kubelet's, not
the pod's, so the policy below denies them everything, in the flavor
networkPolicy selects. They pass the fleet's restricted Pod Security Standard
without an exception: uid 65534, no privilege escalation, every capability
dropped, seccomp RuntimeDefault, read-only root (tests/verify-model-serving-
policies.py holds the rendered pod to the fleet's policies).
*/ -}}
{{- $ms := .Values.modelServing }}
{{- if include "agent-platform.modelServing.prepull.enabled" . }}
{{- $pp := $ms.prepull }}
{{- if not $pp.images }}
{{- fail "modelServing.prepull.images is empty: name at least one image reference to keep present on the pool's nodes, or set modelServing.prepull.enabled: false" }}
{{- end }}
{{- $presets := include "agent-platform.modelServing.presets" . | fromJson }}
{{- $modelImages := list }}
{{- $named := list }}
{{- range $pp.modelPresets }}
{{- $preset := toString . }}
{{- if has $preset $named }}
{{- fail (printf "modelServing.prepull.modelPresets names %q twice" $preset) }}
{{- end }}
{{- $named = append $named $preset }}
{{- $entry := get $presets $preset }}
{{- if not $entry }}
{{- fail (printf "modelServing.prepull.modelPresets names %q, which is not a published serving preset (published: %s)" $preset (keys $presets | sortAlpha | join ", ")) }}
{{- end }}
{{- $resolved := include "agent-platform.modelServing.resolvePreset" (dict "root" $ "name" $preset "entry" $entry) | fromJson }}
{{- $uri := toString $resolved.preset.spec.model.storageUri }}
{{- if not (hasPrefix "oci://" $uri) }}
{{- fail (printf "modelServing.prepull.modelPresets names %q, whose model is %s: only a preset served from an OCI model image (spec.model.storageUri oci://…) has an image to pre-pull" $preset $uri) }}
{{- end }}
{{- $modelImages = append $modelImages (dict "preset" $preset "image" (trimPrefix "oci://" $uri)) }}
{{- end }}
{{- $ns := include "agent-platform.modelServing.namespace" . }}
{{- $name := include "agent-platform.modelServing.prepull.name" . }}
{{- $selector := include "agent-platform.modelServing.prepull.nodeSelector" . | fromJson }}
{{- $sched := include "agent-platform.modelServing.poolScheduling" (dict "root" . "tolerations" $pp.tolerations "nodeSelector" $selector) | fromJson }}
{{- $containerSecurity := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
  annotations:
    # A hook object: created after the release's objects are applied and waited
    # for, waited for by nobody (a DaemonSet is neither a Job nor a Pod), the
    # previous one replaced first; removed by the pre-delete hook Job.
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  selector:
    matchLabels:
      {{- include "agent-platform.modelServing.prepull.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # The pods serve nothing: a changed image list rolls every node at once.
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        {{- include "agent-platform.modelServing.labels" . | nindent 8 }}
        {{- include "agent-platform.modelServing.prepull.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with $sched.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sched.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- range $i, $image := $pp.images }}
        {{- /* pull-<n>-<repository's last segment>: a DNS label whatever the reference. */ -}}
        {{- $short := regexReplaceAll "[^a-z0-9-]" ($image | splitList "/" | last | splitList "@" | first | splitList ":" | first | lower) "-" }}
        - name: {{ printf "pull-%d-%s" $i $short | trunc 63 | trimSuffix "-" }}
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/true"]
          resources:
            {{- toYaml $pp.resources | nindent 12 }}
          securityContext:
            {{- toYaml $containerSecurity | nindent 12 }}
        {{- end }}
        {{- range $modelImages }}
        {{- /* pull-model-<preset>: a preset name is a DNS label of at most 30 characters (resolvePreset), so the name fits. */}}
        - name: {{ printf "pull-model-%s" .preset }}
          image: {{ .image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/true"]
          resources:
            {{- toYaml $pp.resources | nindent 12 }}
          securityContext:
            {{- toYaml $containerSecurity | nindent 12 }}
        {{- end }}
      containers:
        - name: pause
          image: {{ printf "%s/%s:%s" $pp.pauseImage.registry $pp.pauseImage.repository $pp.pauseImage.tag | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            {{- toYaml $pp.resources | nindent 12 }}
          securityContext:
            {{- toYaml $containerSecurity | nindent 12 }}
---
{{ include "agent-platform.hooks.job" (dict "root" $ "name" "model-serving-prepull-cleanup" "hook" "pre-delete"
      "about" (printf "remove the pre-pull DaemonSet %s/%s, a hook object the uninstall would leave behind" $ns $name)
      "script" (printf "kubectl -n %s delete daemonset %s --ignore-not-found --wait=false\n" ($ns | quote) ($name | quote))) }}
{{- if .Values.networkPolicy.enabled }}
{{- if eq (include "agent-platform.networkPolicyFlavor" .) "cilium" }}
---
# The pre-pull pods need no network: an empty rule per direction is Cilium's
# default deny for the selected endpoints.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "agent-platform.modelServing.prepull.selectorLabels" . | nindent 6 }}
  ingress:
    - {}
  egress:
    - {}
{{- else }}
---
# The pre-pull pods need no network: both policy types with no rule deny all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agent-platform.modelServing.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent-platform.modelServing.prepull.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
{{- end }}
{{- end }}
{{- end }}
