      - apiGroups: ["agent-platform.giantswarm.io"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["agentplatformorganizations"]
  validations:
    - expression: >-
        has(namespaceObject.metadata.deletionTimestamp) ||
        (has(oldObject.metadata.annotations) && 'kustomize.toolkit.fluxcd.io/prune' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['kustomize.toolkit.fluxcd.io/prune'] == 'enabled')
      reason: Forbidden
      messageExpression: >-
        'deleting an AgentPlatformOrganization erases its organization: set the annotation kustomize.toolkit.fluxcd.io/prune: enabled on ' +
        request.namespace + '/' + request.name + ' first'
