{{- /*
agent-platform:organizations-admin (giantswarm/agent-platform#1267): manages
organizations and their members. It creates, changes and deletes
`Organization` objects (security.giantswarm.io, cluster-scoped; an
organization has the Agent Platform while
spec.capabilities.agentPlatform.enabled is true), and writes RoleBindings
that bind agent-platform:user or editor. The organization's admins are its
spec.admins: agent-platform-operator alone binds agent-platform:admin, from
that list (giantswarm/giantswarm#39501,
agent-platform-organization-admin-bindings in admission.yaml). Nothing else
of an organization: it reads agents, sessions or credentials only after
binding itself, which shows in the organization's members.

An `Organization` is cluster-scoped, so only a ClusterRoleBinding grants its
rules on them: platform staff get the role that way. The chart binds it to
nobody. RBAC cannot keep the RoleBinding writes in the organization
namespaces, so the policy agent-platform-organizations-admin-rolebindings
refuses them everywhere else (admission.yaml). A cluster-admin already holds
every right it grants.
*/ -}}
{{- if include "agent-platform.organizations.enabled" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform:organizations-admin
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  - apiGroups: ["security.giantswarm.io"]
    resources: ["organizations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["agent-platform:user", "agent-platform:editor"]
{{- end }}
{{- /*
agent-platform:organization-flux (giantswarm/giantswarm#38989): what an
organization's Flux ServiceAccount applies from the organization's path in
git (commit mode). agent-platform-operator keeps one ServiceAccount per
organization in agentPlatformOrganizations.fluxNamespace and binds it to this
role by the RoleBinding organization-flux in the organization namespace only;
the organization's Kustomization names it in spec.serviceAccountName, which
kustomize-controller impersonates. So a merged file writes the organization's
kinds in its own namespace and nothing else: its agents' HelmReleases (the
HelmRelease field lock holds for this identity too), Agents, AgentTemplates,
ModelConfigs, RemoteMCPServers, EgressPolicies, Secrets, and its members'
RoleBindings, which bind agent-platform:user or editor and no other role
(`bind` on those two, no `escalate`; RBAC would let it bind a role whose
rules it holds, this one among them, so the policy
agent-platform-organization-flux-writes pins the roleRef, and refuses a
ServiceAccount token Secret). The admins are no file in git: they are the
Organization's spec.admins. get, list and watch are what
kustomize-controller reads before it applies and while it waits. Rendered
with fluxNamespace, the only case in which the operator binds it.

A `kustomization.yaml` in an organization's path can list another path's
encrypted file, which the installation's key decrypts, and the members are
files there. A Flux source or a SOPS key per organization, which closes
this, is tracked in giantswarm/agent-platform-operator#15. Until then the
control is platform review of every merge into an organization's path,
through CODEOWNERS of the installation repository that an organization's
admin cannot change, never that organization's admin alone:
agent-manager#292 (slice 11, the repository layout) owns it. A CI check
refusing `..` is giantswarm/giantswarm#39013. agent-platform-operator's
README says the same. A file never takes over a binding
people or the operator wrote, nor prunes one:
agent-platform-organization-flux-writes. The path holds no ConfigMap (no configMapGenerator): the
organization's kinds are its agents, models, connectors, egress and
members, and a file of another kind fails the organization's apply, shown on
its Kustomization.
*/ -}}
{{- if and (include "agent-platform.organizations.enabled" .) .Values.agentPlatformOrganizations.fluxNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform:organization-flux
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "agenttemplates", "modelconfigs", "remotemcpservers", "egresspolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["agent-platform:user", "agent-platform:editor"]
{{- end }}
