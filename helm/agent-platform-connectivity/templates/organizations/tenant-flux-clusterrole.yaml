{{- /*
agent-platform-tenant-flux: what an organization's
agents' HelmReleases run as (helm-controller impersonates the organization's
Helm ServiceAccount, kagent.fluxServiceAccountName, which agent-platform-operator
binds to this ClusterRole in the organization namespace only). The rules are
those of the kagent namespace's Role <kagent.fluxServiceAccountName>-agent-releases
(kagent/flux-service-account.yaml): the two kinds the Generic agent chart 2.x
renders and Helm's release Secrets.

Exactly one chart renders it: this one, while the meta chart keeps
agent-manager's tenants.enabled off (agent-manager's chart renders it under
that key). Rendered whenever kagent is on, so an organization's binding never
names a missing role.
*/ -}}
{{- if include "agent-platform.componentEnabled" (dict "root" . "name" "kagent") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform-tenant-flux
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  # Helm's Secret storage driver calls get, list, create, update and delete in
  # the release's storage namespace. RBAC cannot narrow a list, so this
  # identity reads every Secret of an organization namespace it is bound in.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "remotemcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
