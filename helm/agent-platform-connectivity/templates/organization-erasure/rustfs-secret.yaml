{{- if and (include "agent-platform.organizations.enabled" .) (dig "rustfs" "enabled" false (.Values.substrate | default dict)) }}
{{- $store := .Values.substrate.rustfs }}
{{- $operator := include "agent-platform.organizations.operatorServiceAccount" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-platform.organizationErasure.snapshotSecret" . }}
  namespace: {{ $operator.namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
type: Opaque
stringData:
  accessKeyId: {{ required "organizations with RustFS need substrate.rustfs.accessKey" $store.accessKey | quote }}
  secretAccessKey: {{ required "organizations with RustFS need substrate.rustfs.secretKey" $store.secretKey | quote }}
{{- end }}
