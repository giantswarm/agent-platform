{{- /*
The IAM role agent-platform-operator deletes a deleted organization's worker
snapshots with, through IRSA, beside Substrate's (substrate/crossplane-aws.yaml),
on the same bucket. An organization's snapshots live under
s3://<bucket>/<its UID>/, so the role lists the bucket only with a prefix that
starts with a UID (the s3:prefix condition) and deletes only keys under one:
never the platform Harness's own snapshots, nor anything else in the bucket.
It reads and writes nothing.
*/ -}}
{{- if and (dig "enabled" false (.Values.organizationErasure | default dict)) (eq (include "agent-platform.substrateStore.crossplane" .) "aws") }}
{{- $xp := (include "agent-platform.substrateStore.block" . | fromJson).crossplane }}
{{- $bucket := $xp.aws.bucketName }}
{{- $partition := include "agent-platform.crossplane.awsPartition" (dict "xp" $xp) }}
{{- $roleName := include "agent-platform.organizationErasure.awsRoleName" . }}
{{- $uid := include "agent-platform.organizationErasure.uidPattern" . }}
{{- $sa := include "agent-platform.organizationErasure.serviceAccount" . | fromJson }}
{{- $tags := include "agent-platform.crossplane.tags" (dict "xp" $xp "app" "agent-platform-operator" "name" $roleName) | fromYaml }}
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: iam
  annotations:
    crossplane.io/external-name: {{ $roleName }}
spec:
  managementPolicies:
    {{- include "agent-platform.crossplane.managementPolicies" (dict "xp" $xp) | nindent 4 }}
  forProvider:
    description: {{ printf "agent-platform-operator's erasure of deleted organizations' snapshots in %s (agent-platform)" $bucket | quote }}
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {{- include "agent-platform.crossplane.aws.trustStatement" (dict "xp" $xp "sub" (printf "system:serviceaccount:%s:%s" $sa.namespace $sa.name)) | nindent 10 }}
        ]
      }
    inlinePolicy:
      - name: {{ $roleName }}
        policy: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["s3:ListBucket"],
                "Resource": ["{{ $partition }}:s3:::{{ $bucket }}"],
                "Condition": {
                  "StringLike": {
                    "s3:prefix": ["{{ $uid }}/*"]
                  }
                }
              },
              {
                "Effect": "Allow",
                "Action": ["s3:DeleteObject"],
                "Resource": ["{{ $partition }}:s3:::{{ $bucket }}/{{ $uid }}/*"]
              }
            ]
          }
    tags:
      {{- toYaml $tags | nindent 6 }}
  providerConfigRef:
    name: {{ $xp.providerConfigRef }}
{{- end }}
