{{- /*
Render-time guards of the workspace-manager component: fail `helm template`
with an actionable message instead of shipping a server that cannot validate
its callers, an MCPServer CR without its CRD, or a policy that cannot name a
provider's hosts.
*/ -}}
{{- if (include "agent-platform.workspaceManager.enabled" .) }}
  {{- $wm := .Values.workspaceManager }}
  {{- $chart := include "agent-platform.workspaceManager.chartValues" . | fromJson }}
  {{- $_ := include "agent-platform.workspaceManager.fullname" . }}
  {{- $_ := include "agent-platform.workspaceManager.providerHosts" . }}

  {{- /* The MCP endpoint is the server's only surface: without muster nothing
         calls the tools (the MCPServer CRD ships with muster). */ -}}
  {{- if and (dig "muster" "mcpServer" "enabled" false $chart) (not (include "agent-platform.componentEnabled" (dict "root" . "name" "muster"))) }}
    {{- fail "workspace-manager.muster.mcpServer.enabled is true but components.muster.enabled is false: the MCPServer CRD ships with muster, so the CR has no API to map to. Turn on muster (the workspace-manager's tools reach the portal and the agents through it) or set workspace-manager.muster.mcpServer.enabled: false" }}
  {{- end }}

  {{- /* The component release resolves its OAuth inputs through the chart's
         global.identity / global.domain fallbacks; a missing one fails inside
         the child release, out of sight. Fail here, naming both keys. */ -}}
  {{- if (include "agent-platform.workspaceManager.oauthEnabled" .) }}
    {{- $oauth := dig "oauth" dict $chart }}
    {{- if and (not (dig "baseURL" "" $oauth)) (not .Values.global.domain) }}
      {{- fail "workspace-manager.oauth.enabled is true but workspace-manager.oauth.baseURL is empty and global.domain is not set: the resource server needs its public base URL" }}
    {{- end }}
    {{- if eq (dig "provider" "dex" $oauth) "dex" }}
      {{- if not (include "agent-platform.workspaceManager.issuerUrl" .) }}
        {{- fail "workspace-manager.oauth.enabled is true but workspace-manager.oauth.dex.issuerURL is empty and global.identity.issuerUrl is not set: the resource server needs the login issuer" }}
      {{- end }}
      {{- if and (not (dig "dex" "clientID" "" $oauth)) (not .Values.global.identity.clientId) }}
        {{- fail "workspace-manager.oauth.enabled is true but workspace-manager.oauth.dex.clientID is empty and global.identity.clientId is not set: the resource server needs the platform OAuth client" }}
      {{- end }}
      {{- if and (not (dig "existingSecret" "" $oauth)) (not (dig "dex" "clientSecret" "" $oauth)) (not .Values.global.identity.existingSecret) }}
        {{- fail "workspace-manager.oauth.enabled is true but none of workspace-manager.oauth.existingSecret, workspace-manager.oauth.dex.clientSecret or global.identity.existingSecret is set: the resource server needs the platform client's secret (key dex-client-secret)" }}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- range ($wm.networkPolicy.egress.cidrs | default list) }}
    {{- if not (regexMatch `^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$` .) }}
      {{- fail (printf "workspaceManager.networkPolicy.egress.cidrs: %q is not an IPv4 CIDR" .) }}
    {{- end }}
  {{- end }}
  {{- range $wm.networkPolicy.ingress.additionalPeers }}
    {{- if or (not (kindIs "map" .)) (not .) }}
      {{- fail (printf "workspaceManager.networkPolicy.ingress.additionalPeers: every item is a non-empty pod label map (matchLabels), e.g. {app.kubernetes.io/name: backstage}; got %v" .) }}
    {{- end }}
  {{- end }}
{{- end }}
