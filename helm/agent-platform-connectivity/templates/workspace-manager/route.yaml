{{- /*
The grants' key set, the workspace-manager's only public surface. The grants
the manager signs name the base URL as their issuer, so the key set that
verifies them, <baseURL>/.well-known/jwks.json, is served on its host: a key set
is public by design. That path, and only it, is routed on the base URL's host;
MCP and the manager's own OAuth server (its /.well-known/oauth-* metadata
included) are not, and stay reachable in-cluster only. Without a host (no
workspace-manager.oauth.baseURL and no global.domain) nothing renders: a route
without hostnames would take the path on every host of the Gateway.
*/ -}}
{{- $host := include "agent-platform.workspaceManager.routeHost" . }}
{{- if $host }}
# Proxies straight to the manager's Service: the key set carries no JWT for the
# agentgateway policy and is public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workspace-manager-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.workspaceManager.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "agent-platform.parentRefs" (dict "ctx" . "override" (include "agent-platform.workspaceManager.routeParentRefs" . | fromJsonArray) "key" "workspaceManager.route.parentRefs") | nindent 4 }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/jwks.json
      {{- with (include "agent-platform.routeTimeouts" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      backendRefs:
        - name: {{ include "agent-platform.workspaceManager.fullname" . }}
          port: {{ include "agent-platform.workspaceManager.servicePort" . }}
{{- end }}
