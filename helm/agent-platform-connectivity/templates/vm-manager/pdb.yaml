{{- /* PodDisruptionBudget on the vm-manager pod (the same shape as
agentManager.podDisruptionBudget, giantswarm/agent-platform#431). The component
chart has no knob of its own, so the umbrella renders the budget next to the
component's network policies, selecting the pod the way those do. With the
component's one replica — whose children are the running VMs — minAvailable: 1
refuses every voluntary eviction, and AlwaysAllow keeps a pod that is not
Ready evictable. */ -}}
{{- $pdb := .Values.vmManager.podDisruptionBudget }}
{{- if and (include "agent-platform.vmManager.enabled" .) $pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agent-platform.vmManager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.vmManager.labels" . | nindent 4 }}
spec:
  {{- include "agent-platform.podDisruptionBudget.spec" (dict "path" "vmManager.podDisruptionBudget" "pdb" $pdb) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "agent-platform.vmManager.podSelector" . | nindent 6 }}
{{- end }}
