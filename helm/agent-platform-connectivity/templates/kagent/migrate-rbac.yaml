{{- /*
The identity of the cut-over (migrate-cronjob.yaml): the ServiceAccount of the
migration's name in the kagent namespace, which the run and its start hook run
as, and nothing else does. Its Role there holds what the run and the hook call:
read and update the Generic-chart HelmReleases and their OCIRepositories, read
the Agents and AgentTemplates of both kagent groups and delete the leftover
kagent.dev AgentTemplates, list Events for an Agent's status, write the report
ConfigMap agent-manager-migrate-report, read the installation's skills
credential by name, and create the run's Job from the CronJob. Plain objects of
the release, rendered while the migration is on and retired with it in a later
4.x release. On this line the Job moves Generic chart 1.x releases to 2.x and
deletes no CRD, so it holds no cluster-scoped right but the tenants' below.

Per namespace in agentManager.migration.gitopsNamespaces (the fleet:
flux-giantswarm, where the GitOps-owned agents' HelmReleases and
OCIRepositories live with targetNamespace: kagent), a Role + RoleBinding with
get and list on those two kinds, so the Job can emit their rewrite as a diff.
Never write.

With tenants.organizations on, the run also covers the Organization namespaces
(AGENT_MANAGER_MULTI_TENANT, migrate-cronjob.yaml). RBAC cannot select
namespaces by label, so the ClusterRole <name>-tenants grants the migration's
identity get, list on namespaces (to find the labelled ones) and get, list,
update, patch on HelmReleases — never create or delete. The
ValidatingAdmissionPolicy of the same name holds every HelmRelease write of that
identity outside the kagent namespace to what the run does: an update, in a
namespace labelled giantswarm.io/organization, from a pod of the run (the
pod-name claim of the pod's ServiceAccount token), that changes spec.values and
nothing else of the spec (the chart, the identity it runs as, its sources stay).
*/ -}}
{{- if (include "agent-platform.kagent.migration" .) }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $name := include "agent-platform.kagent.migration.name" . }}
{{- $sa := $name }}
{{- $skillsAuth := include "agent-platform.agentManager.skillsGitAuth" . | fromJson }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
rules:
  # The run covers the namespaces where it may create a HelmRelease (a
  # SelfSubjectAccessReview per namespace); it creates none.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "update"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "agenttemplates"]
    verbs: ["get", "list"]
  - apiGroups: ["kagent.dev"]
    resources: ["agenttemplates"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # RBAC cannot name the object of a create.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["agent-manager-migrate-report"]
    verbs: ["get", "update"]
  {{- with $skillsAuth.current }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get"]
  {{- end }}
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
{{- range .Values.agentManager.migration.gitopsNamespaces }}
{{- if not . }}
{{- fail "agentManager.migration.gitopsNamespaces: every entry is a non-empty namespace name" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
{{- end }}
{{- if (include "agent-platform.tenants.organizations" .) }}
{{- $tenants := printf "%s-tenants" $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $tenants }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $tenants }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $tenants }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $tenants }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [{{ $kagentNs | quote }}]
    resourceRules:
      - apiGroups: ["helm.toolkit.fluxcd.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["helmreleases"]
  matchConditions:
    - name: tenant-identity
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" $kagentNs $sa | quote }}
  variables:
    - name: pods
      expression: "has(request.userInfo.extra) && 'authentication.kubernetes.io/pod-name' in request.userInfo.extra ? request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []"
  validations:
    - expression: "has(namespaceObject.metadata.labels) && 'giantswarm.io/organization' in namespaceObject.metadata.labels"
      reason: Forbidden
      messageExpression: {{ printf "'%s writes HelmReleases only in the Organization namespaces (giantswarm.io/organization) and %s; refused in ' + request.namespace" $sa $kagentNs | quote }}
    - expression: "request.operation == 'UPDATE'"
      reason: Forbidden
      messageExpression: {{ printf "'%s only updates HelmReleases in an Organization namespace; refused: ' + request.operation" $sa | quote }}
    - expression: {{ printf "size(variables.pods) == 1 && variables.pods[0].startsWith('%s-')" $name | quote }}
      reason: Forbidden
      messageExpression: {{ printf "'%s writes HelmReleases in an Organization namespace only from a pod of the agent-manager migrate run (%s-*)'" $sa $name | quote }}
    - expression: >-
        request.operation != 'UPDATE' || (
{{- range $i, $f := list "chart" "chartRef" "serviceAccountName" "kubeConfig" "targetNamespace" "storageNamespace" "releaseName" "valuesFrom" "postRenderers" "dependsOn" "suspend" "install" "upgrade" "driftDetection" }}
        {{ if $i }}&& {{ end }}has(object.spec.{{ $f }}) == has(oldObject.spec.{{ $f }}) && (!has(object.spec.{{ $f }}) || object.spec.{{ $f }} == oldObject.spec.{{ $f }})
{{- end }})
      reason: Forbidden
      messageExpression: {{ printf "'%s changes only spec.values of a HelmRelease in an Organization namespace; refused for ' + request.name" $sa | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $tenants }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
spec:
  policyName: {{ $tenants }}
  validationActions: [Deny]
{{- end }}
{{- end }}
