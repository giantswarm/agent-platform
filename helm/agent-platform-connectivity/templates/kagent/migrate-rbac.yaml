{{- /*
The migration-only rights of the cut-over Job (migrate-cronjob.yaml), on top of the
namespace admin the tenant identity already holds in the kagent namespace
(flux-service-account.yaml: HelmReleases, OCIRepositories, the Agents and
AgentTemplates of both kagent groups, the report ConfigMap). On this line the
Job moves Generic chart 1.x releases to 2.x and deletes no CRD, so it holds no
cluster-scoped right. Plain objects of the release, like the Job (a hook's
lifetime would not cover the Job's re-runs), rendered while the migration is
on and retired with it in a later 4.x release: a Role + RoleBinding per
namespace in agentManager.migration.gitopsNamespaces (the fleet:
flux-giantswarm, where the GitOps-owned agents' HelmReleases and
OCIRepositories live with targetNamespace: kagent), get and list on those two
kinds, so the Job can emit their rewrite as a diff. Never write.
*/ -}}
{{- if (include "agent-platform.kagent.migration" .) }}
{{- $sa := include "agent-platform.kagent.fluxServiceAccountName" . }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $name := include "agent-platform.kagent.migration.name" . }}
{{- range .Values.agentManager.migration.gitopsNamespaces }}
{{- if not . }}
{{- fail "agentManager.migration.gitopsNamespaces: every entry is a non-empty namespace name" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
{{- end }}
{{- end }}
