{{- /*
The identity of the cut-over (migrate-cronjob.yaml): the ServiceAccount of the
migration's name in the kagent namespace, which the run and its start hook run
as, and nothing else does. Its Role there holds what the run and the hook call:
read and update the Generic-chart HelmReleases and their OCIRepositories, read
the Agents and AgentTemplates of both kagent groups and delete the leftover
kagent.dev AgentTemplates, list Events for an Agent's status, write the report
ConfigMap agent-manager-migrate-report, read the installation's skills
credential by name, and create the run's Job from the CronJob. Plain objects of
the release, rendered while the migration is on and retired with it in a later
4.x release. On this line the Job moves Generic chart 1.x releases to 2.x.

An installation that jumped from the 0.x line (meta chart 3.x) straight to 4.x
still has the 0.x kagent.dev CRDs, which its contract phase deletes, each only
while it holds no object. ONE ClusterRole (the name plus -crds), bound by ONE
ClusterRoleBinding to this ServiceAccount, holds exactly that: get and delete
on customresourcedefinitions confined by resourceNames to those nine CRDs, and
a cluster-wide list on their kagent.dev resources, which proves a CRD empty
before it goes. verify-flux-identity asserts these rights and no other
cluster-scoped binding of the identity.

Per namespace in agentManager.migration.gitopsNamespaces (the fleet:
flux-giantswarm, where the GitOps-owned agents' HelmReleases and
OCIRepositories live with targetNamespace: kagent), a Role + RoleBinding with
get and list on those two kinds, so the Job can emit their rewrite as a diff.
Never write.

*/ -}}
{{- if (include "agent-platform.kagent.migration" .) }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $name := include "agent-platform.kagent.migration.name" . }}
{{- $sa := $name }}
{{- $skillsAuth := include "agent-platform.agentManager.skillsGitAuth" . | fromJson }}
{{- /* The 0.x kagent.dev CRDs the api.kagent.dev line no longer serves (agent-manager's LegacyCRDs). */}}
{{- $legacyCRDs := list "agents" "sandboxagents" "agentharnesses" "memories" "toolservers" "modelconfigs" "remotemcpservers" "modelproviderconfigs" "mcpservers" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
rules:
  # The run covers the namespaces where it may create a HelmRelease (a
  # SelfSubjectAccessReview per namespace); it creates none.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "create", "update"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "update"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "agenttemplates"]
    verbs: ["get", "list"]
  - apiGroups: ["kagent.dev"]
    resources: ["agenttemplates"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # RBAC cannot name the object of a create.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["agent-manager-migrate-report"]
    verbs: ["get", "update"]
  {{- with $skillsAuth.current }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get"]
  {{- end }}
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-crds
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      {{- range $legacyCRDs }}
      - {{ . }}.kagent.dev
      {{- end }}
    verbs: ["get", "delete"]
  - apiGroups: ["kagent.dev"]
    resources: {{ $legacyCRDs | toJson }}
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-crds
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-crds
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
{{- range .Values.agentManager.migration.gitopsNamespaces }}
{{- if not . }}
{{- fail "agentManager.migration.gitopsNamespaces: every entry is a non-empty namespace name" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
{{- end }}
{{- end }}
