{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.kagent.modelConfigs }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $routed := include "agent-platform.llmRouting" $ }}
{{- $listenerProviders := include "agent-platform.llmRouting.providers" $ | fromJsonArray }}
{{- range .Values.kagent.modelConfigs }}
{{- $name := required "kagent.modelConfigs[].name is required" .name }}
{{- /* The CRD's enum, checked at render time: the API server refuses any other
spelling at admission, after the render has said nothing. */}}
{{- $provider := include "agent-platform.modelConfigProvider" . }}
{{- /* The block that carries baseUrl is the CRD's key for the provider (openAI,
not openai), and three providers have one. */}}
{{- $urlKey := include "agent-platform.modelConfigBaseUrlKey" $provider }}
{{- if and .baseUrl (not $urlKey) }}
{{- fail (printf "kagent.modelConfigs[].baseUrl is set on %q, whose provider %s has no baseUrl in ModelConfigSpec (Anthropic, Mistral, OpenAI and SAPAICore have one; every other provider names its upstream through its own fields)" .name $provider) }}
{{- end }}
{{- /* An entry rides the listener when an llmRouting.models entry serves its
provider (agent-platform.llmRouting.providers), at the URL that provider's
client expects (agent-platform.llmListenerUrl: an OpenAI entry's ends in /v1).
An entry for any other provider keeps the direct path even with routing on. */}}
{{- $baseUrl := .baseUrl }}
{{- if and (not $baseUrl) $routed (has (lower $provider) $listenerProviders) }}
{{- $baseUrl = include "agent-platform.llmListenerUrl" (dict "root" $ "provider" $provider) }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns }}
  {{- with .displayName }}
  annotations:
    ui.giantswarm.io/display-name: {{ . | quote }}
  {{- end }}
spec:
  provider: {{ $provider | quote }}
  model: {{ required "kagent.modelConfigs[].model is required" .model | quote }}
  apiKeySecret: {{ required "kagent.modelConfigs[].apiKeySecret is required" .apiKeySecret | quote }}
  apiKeySecretKey: {{ .apiKeySecretKey | default "ANTHROPIC_API_KEY" | quote }}
  {{- /* Traffic through the LLM listener, so the gateway meters this model's
  usage. The block is this entry's own provider, not the chart's default
  provider: the two differ once a catalog holds more than one provider. An
  explicit baseUrl wins, which is how a model reaches any other upstream. The
  default ModelConfig is redirected through the forwarded
  kagent.providers.<default>.config.baseUrl instead, which this chart does not
  render. */}}
  {{- /* Prompt caching (the kagent line's carried patch kagent-dev/kagent#2788): an
  entry's own promptCaching / cacheTTL win, `false` included; an Anthropic entry
  that sets neither inherits the platform's default from
  kagent.providers.anthropic.config — the block the kagent chart renders into
  the default ModelConfig — so the catalog's Anthropic models are cached the way
  the default model is, without a value per entry. Bedrock takes the entry's own
  keys only. Any other provider has neither field in ModelConfigSpec: the API
  server would prune them and the model would stay uncached in silence, so the
  render refuses them naming the entry; cacheTTL is held to the CRD's enum here
  for the same reason. */}}
  {{- $cacheKey := include "agent-platform.modelConfigCacheKey" $provider }}
  {{- $inherit := dict }}
  {{- if eq $cacheKey "anthropic" }}
  {{- $inherit = dig "providers" "anthropic" "config" (dict) ($.Values.kagent | default dict) }}
  {{- end }}
  {{- if and (not $cacheKey) (or (not (kindIs "invalid" .promptCaching)) .cacheTTL) }}
  {{- fail (printf "kagent.modelConfigs[].promptCaching / cacheTTL is set on %q, whose provider %s has neither in ModelConfigSpec (Anthropic and Bedrock have them; the API server would prune the fields and the model would stay uncached)" .name $provider) }}
  {{- end }}
  {{- $promptCaching := .promptCaching }}
  {{- if kindIs "invalid" $promptCaching }}{{ $promptCaching = $inherit.promptCaching }}{{ end }}
  {{- $cacheTTL := .cacheTTL | default $inherit.cacheTTL }}
  {{- /* An entry that turns caching off inherits no TTL. */}}
  {{- if and (not (kindIs "invalid" $promptCaching)) (not $promptCaching) }}{{ $cacheTTL = .cacheTTL }}{{ end }}
  {{- if and $cacheTTL (not (has (toString $cacheTTL) (list "5m" "1h"))) }}
  {{- fail (printf "kagent.modelConfigs[].cacheTTL %q on %q is not one of the CRD's values 5m, 1h" (toString $cacheTTL) .name) }}
  {{- end }}
  {{- /* The output bound: an entry's own maxTokens wins; an Anthropic entry
  without one inherits kagent.providers.anthropic.config.maxTokens like the
  cache keys, so the catalog's models answer as long as the default model does
  instead of stopping at kagent's built-in 8192 (thinking included). A provider
  whose block has no maxTokens refuses it naming the entry. */}}
  {{- $maxTokensKey := include "agent-platform.modelConfigMaxTokensKey" $provider }}
  {{- if and .maxTokens (not $maxTokensKey) }}
  {{- fail (printf "kagent.modelConfigs[].maxTokens is set on %q, whose provider %s has no maxTokens in ModelConfigSpec (Anthropic, AnthropicVertexAI, AzureOpenAI, Mistral and OpenAI have one; the API server would prune it)" .name $provider) }}
  {{- end }}
  {{- $maxTokens := .maxTokens | default $inherit.maxTokens }}
  {{- /* The OpenAI HTTP API (openAI.apiFormat): responses for a model a codex
  agent uses, which the codex compiler requires; chatCompletions is the CRD's
  default. Held to the CRD's enum and to OpenAI here, where the API server
  would refuse or prune it after a silent render. */}}
  {{- if and .apiFormat (not (include "agent-platform.modelConfigApiFormatKey" $provider)) }}
  {{- fail (printf "kagent.modelConfigs[].apiFormat is set on %q, whose provider %s has no apiFormat in ModelConfigSpec (OpenAI has one)" .name $provider) }}
  {{- end }}
  {{- if and .apiFormat (not (has (toString .apiFormat) (list "chatCompletions" "responses"))) }}
  {{- fail (printf "kagent.modelConfigs[].apiFormat %q on %q is not one of the CRD's values chatCompletions, responses" (toString .apiFormat) .name) }}
  {{- end }}
  {{- $fields := dict }}
  {{- with .apiFormat }}{{ $_ := set $fields "apiFormat" (toString .) }}{{ end }}
  {{- if not (kindIs "invalid" $promptCaching) }}{{ $_ := set $fields "promptCaching" $promptCaching }}{{ end }}
  {{- with $cacheTTL }}{{ $_ := set $fields "cacheTTL" (toString .) }}{{ end }}
  {{- with $maxTokens }}{{ $_ := set $fields "maxTokens" (int .) }}{{ end }}
  {{- if or $baseUrl $fields }}
  {{ $urlKey | default $cacheKey | default $maxTokensKey }}:
    {{- with $baseUrl }}
    baseUrl: {{ . | quote }}
    {{- end }}
    {{- with $fields }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
