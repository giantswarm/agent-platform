{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.kagent.modelConfigs }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- range .Values.kagent.modelConfigs }}
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: {{ required "kagent.modelConfigs[].name is required" .name | quote }}
  namespace: {{ $ns }}
  {{- with .displayName }}
  annotations:
    ui.giantswarm.io/display-name: {{ . | quote }}
  {{- end }}
spec:
  provider: {{ required "kagent.modelConfigs[].provider is required" .provider | quote }}
  model: {{ required "kagent.modelConfigs[].model is required" .model | quote }}
  apiKeySecret: {{ required "kagent.modelConfigs[].apiKeySecret is required" .apiKeySecret | quote }}
  apiKeySecretKey: {{ .apiKeySecretKey | default "ANTHROPIC_API_KEY" | quote }}
  {{- /* Route this ModelConfig's traffic through the LLM listener too. Without
  it an extra ModelConfig calls the provider directly and its usage never
  reaches the gateway's metrics — the default ModelConfig is redirected through
  the forwarded kagent.providers.<default>.config.baseUrl instead, which this
  chart does not render. The key is the lower-cased provider name. */}}
  {{- with .baseUrl }}
  {{ $.Values.kagent.providers.default | lower }}:
    baseUrl: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
