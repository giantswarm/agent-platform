{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $musterUrl := printf "http://%s.%s.svc.cluster.local:%v/mcp" (include "agent-platform.musterFullname" .) .Release.Namespace (include "agent-platform.musterServicePort" .) }}
{{- if .Values.muster.enabled }}
{{/* Shared platform gateway, in the kagent namespace ($ns) with the
AgentTemplates that bind it: on kagent main a template's tools[].mcp.server
({kind: RemoteMCPServer, name}) has no namespace field and resolves in the
template's own namespace, and allowedNamespaces opens nothing (a v1alpha2
cross-namespace grant, inert on main), so the server has to live where the
templates do. Its name is the platform contract: agent-manager and the portal
write AgentTemplates in the kagent namespace that bind
{kind: RemoteMCPServer, name: muster} — the whole server, since a per-tool
selection needs controller-side discovery, which is off here — or the per-agent
toolset copy (muster-<agent>, headersFrom X-Muster-Toolset) agent-manager
derives from it. Rendered whenever kagent + muster are enabled: the CR is inert
until a template binds it.
No headersFrom, so the caller token forwarded by kagent (KAGENT_PROPAGATE_TOKEN)
is the only Authorization reaching muster — a static header here is applied
LAST by the runtime on every agent's MCP calls, overriding the propagated
caller token, so every agent would act as that static identity
(docs/authentication.md, "Tool discovery by the kagent controller"). For the
same reason the kagent controller has no credential muster accepts when it
lists the server's tools for its status (muster is an OAuth resource server,
the request carries no bearer, muster answers 401): while muster runs with
OAuth on, the server opts out of controller-side tool discovery with
kagent.dev/discovery=disabled — the controller Accepts it without a tool
listing (kagent controller with kagent-dev/kagent#2752; an older controller
ignores the label and keeps reporting Accepted=False, ReconcileFailed …
Unauthorized). Agents resolve the tool list at run time as the caller. With
muster's OAuth off (dev installs) the controller can list tools anonymously,
so the label is not rendered. */}}
---
apiVersion: kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: muster
  namespace: {{ $ns }}
  {{- if dig "muster" "oauth" "server" "enabled" true .Values.muster }}
  labels:
    kagent.dev/discovery: disabled
  {{- end }}
spec:
  description: "Shared muster MCP gateway for platform agents"
  url: {{ $musterUrl | quote }}
  protocol: STREAMABLE_HTTP
{{- end }}
{{- range .Values.kagent.remoteMcpServers }}
---
apiVersion: kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ required "kagent.remoteMcpServers[].name is required" .name | quote }}
  namespace: {{ $ns }}
spec:
  description: {{ .description | default (printf "%s MCP server" .name) | quote }}
  url: {{ required "kagent.remoteMcpServers[].url is required" .url | quote }}
  protocol: STREAMABLE_HTTP
  {{- with .tokenSecret }}
  headersFrom:
  - name: Authorization
    valueFrom:
      type: Secret
      name: {{ . | quote }}
      key: token
  {{- end }}
{{- end }}
{{- end }}
