{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.kagent.remoteMcpServers }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{/* Operator-owned RemoteMCPServers (kagent.remoteMcpServers[]), kagent API v2
(kagent.dev/v1alpha3), in the kagent namespace: an AgentTemplate binds a
RemoteMCPServer of its own namespace only (tools[].mcp.server is a local
reference), so every server an agent can use lives where the templates do.

There is NO shared muster server here any more. The Generic agent chart 1.x
renders one RemoteMCPServer per agent — named after the agent, in the agent's
namespace, muster's in-cluster URL (chart value muster.url, composed by
agent-manager from the agent-platform.musterMcpUrl helper's value),
STREAMABLE_HTTP, the toolset header X-Muster-Toolset in headersFrom and the
discovery opt-out label kagent.dev/discovery=disabled while muster's OAuth is
on — and binds it (docs/authentication.md, "Tool discovery by the kagent
controller"). Nothing the platform renders for muster carries a static header:
the caller token propagated by the Harness (KAGENT_PROPAGATE_TOKEN) is the only
Authorization that reaches muster.

tokenSecret renders a static Authorization header for servers that need a
credential of their own. The runtime applies static headersFrom values LAST, so
on such a server every agent acts as that credential, not as the caller — fine
for a server that has no notion of the caller, wrong for one that should see
the person (docs/authentication.md explains). */}}
{{- range .Values.kagent.remoteMcpServers }}
---
apiVersion: kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: {{ required "kagent.remoteMcpServers[].name is required" .name | quote }}
  namespace: {{ $ns }}
spec:
  description: {{ .description | default (printf "%s MCP server" .name) | quote }}
  url: {{ required "kagent.remoteMcpServers[].url is required" .url | quote }}
  protocol: STREAMABLE_HTTP
  {{- with .tokenSecret }}
  headersFrom:
  - name: Authorization
    valueFrom:
      type: Secret
      name: {{ . | quote }}
      key: token
  {{- end }}
{{- end }}
{{- end }}
