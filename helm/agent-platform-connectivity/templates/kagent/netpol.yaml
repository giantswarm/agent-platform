{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.networkPolicy.enabled }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $controllerPort := "8083" }}
{{- /* kagent's built-in tool server (the kagent-tools subchart of the kagent chart).
     The kagent chart renders a RemoteMCPServer for it at
     http://kagent-tools.<tools namespace>:<port>/mcp; the controller discovers its
     tools there and every agent that references it calls it there. The kagent
     wrapper chart pins the subchart to the kagent namespace; an explicit
     kagent.kagent-tools.namespaceOverride wins. */}}
{{- $toolsValues := index .Values.kagent "kagent-tools" | default dict }}
{{- $toolsEnabled := $toolsValues.enabled }}
{{- $toolsNs := $toolsValues.namespaceOverride | default $kagentNs }}
{{- $toolsPort := dig "service" "ports" "tools" "targetPort" "8084" $toolsValues | toString }}
{{- $clusterName := .Values.postgres.clusterName }}

{{- if eq (include "agent-platform.networkPolicyFlavor" .) "cilium" }}
---
# Egress from agentgateway data-plane to the kagent controller (cross-namespace).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-dataplane-to-kagent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: controller
            app.kubernetes.io/name: kagent
            io.kubernetes.pod.namespace: {{ $kagentNs }}
      toPorts:
        - ports:
            - port: {{ $controllerPort | quote }}
              protocol: TCP
---
# Ingress to the kagent controller: the agentgateway data plane (cross-namespace)
# and the kagent UI, nothing else. Both are authentication boundaries the
# controller relies on — agentgateway validates the JWT and sets x-user-id, the
# UI's route strips it and oauth2-proxy supplies the bearer — while the
# controller itself decodes the bearer without verifying it, so every other pod
# is kept off the API port. Agent pods do not call the controller from inside
# the namespace any more (the Substrate actors' egress is a separate policy).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-kagent-from-agentgateway
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: kagent
  ingress:
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: ui
            io.kubernetes.pod.namespace: {{ $kagentNs }}
      toPorts:
        - ports:
            - port: {{ $controllerPort | quote }}
              protocol: TCP
---
# Egress from the kagent controller: DNS, Postgres, Kubernetes API, OTLP, muster,
# the agent pods, and the built-in tool server when it is enabled.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-kagent-controller-egress
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: kagent
  egress:
    {{- include "agent-platform.dnsEgress" . | nindent 4 }}
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.muster.enabled }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: muster
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ include "agent-platform.musterServicePort" . | quote }}
              protocol: TCP
    {{- end }}
    - toEndpoints:
        - matchLabels:
            app: kagent
            io.kubernetes.pod.namespace: {{ $kagentNs }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    {{- if $toolsEnabled }}
    # Tool discovery (MCP initialize + tools/list) against the built-in tool
    # server's RemoteMCPServer URL; without it the RemoteMCPServer never becomes
    # Accepted and the agents that reference it run without tools.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent-tools
            io.kubernetes.pod.namespace: {{ $toolsNs }}
      toPorts:
        - ports:
            - port: {{ $toolsPort | quote }}
              protocol: TCP
    {{- end }}
{{- if .Values.postgres.enabled }}
---
# CNPG cluster policies: inter-instance egress for streaming replication,
# and ingress from the kagent controller. The selector also covers a Cluster
# named <clusterName>-restore: the scratch Cluster a restore test bootstraps
# from the backup store (its full-recovery Job needs the Kubernetes API and the
# store, and the operator's cluster-wide CNPG policies cover instance, initdb
# and join pods but not recovery Jobs). It never selects the live Cluster's
# pods for anything the restore Cluster could not do on its own.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $clusterName }}-cluster
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values:
          - {{ $clusterName }}
          - {{ $clusterName }}-restore
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: In
              values:
                - {{ $clusterName }}
                - {{ $clusterName }}-restore
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    {{- if and (include "agent-platform.postgres.backupEnabled" .) (eq .Values.postgres.backup.method "plugin") }}
    {{- $np := .Values.postgres.backup.networkPolicy }}
    # The Barman Cloud plugin sidecar reaches the object store: DNS, the world on
    # the store's ports, the cluster entity when endpointURL names an in-cluster
    # store, and any names or blocks the installation pins.
    {{- if $np.fqdns }}
    {{- include "agent-platform.dnsEgressWithProxy" . | nindent 4 }}
    {{- else }}
    {{- include "agent-platform.dnsEgress" . | nindent 4 }}
    {{- end }}
    - toEntities:
        - world
        {{- if .Values.postgres.backup.objectStore.endpointURL }}
        - cluster
        {{- end }}
      toPorts:
        - ports:
            {{- range $np.ports }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- with $np.fqdns }}
    - toFQDNs:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            {{- range $np.ports }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- with $np.cidrs }}
    - toCIDR:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            {{- range $np.ports }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- end }}
    {{- end }}
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: cnpg.io/cluster
              operator: In
              values:
                - {{ $clusterName }}
                - {{ $clusterName }}-restore
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: controller
            app.kubernetes.io/name: kagent
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
{{- end }}

{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.muster.enabled }}
---
# Egress from all kagent-managed agent pods to muster (MCP tool calls), to the
# built-in tool server when it is enabled (MCP tool calls), and to the Anthropic
# API (model inference). DNS included.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-kagent-agent-muster-egress
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: kagent
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: muster
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ include "agent-platform.musterServicePort" . | quote }}
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: controller
            app.kubernetes.io/name: kagent
            io.kubernetes.pod.namespace: {{ $kagentNs }}
      toPorts:
        - ports:
            - port: {{ $controllerPort | quote }}
              protocol: TCP
    {{- if (include "agent-platform.llmRouting" .) }}
    # Model inference through the agentgateway LLM listener. Additive: the
    # world:443 rule below still stands, so a direct call to the provider keeps
    # working. Egress tightening is a separate change.
    - toEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
            io.kubernetes.pod.namespace: {{ .Release.Namespace }}
      toPorts:
        - ports:
            - port: {{ .Values.llmRouting.listener.port | quote }}
              protocol: TCP
    {{- end }}
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # muster's OAuth/STS endpoints (well-known + /oauth/token) are served only on
    # the public ingress hostname, which resolves to the internal Envoy LB VIP (a
    # private IP, classified as cluster). The agent's STS token exchange for OBO
    # needs this path. 443 = LB VIP; 10443 = Envoy listener after Azure LB DNAT.
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    {{- if $toolsEnabled }}
    # The agents call the built-in tool server's MCP endpoint directly, the same
    # way they call muster.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent-tools
            io.kubernetes.pod.namespace: {{ $toolsNs }}
      toPorts:
        - ports:
            - port: {{ $toolsPort | quote }}
              protocol: TCP
    {{- end }}
    {{- include "agent-platform.dnsEgress" . | nindent 4 }}
{{- end }}
{{- if index .Values.kagent "oauth2-proxy" "enabled" }}
{{- /* Extra callers admitted on oauth2-proxy's proxy port next to the public
Gateway's Envoy pods (kagent.oauth2ProxyIngress.additionalPeers): pod label maps,
each rendered as one more fromEndpoints entry. A peer outside the kagent
namespace carries its own io.kubernetes.pod.namespace label. */ -}}
{{- $o2pPeers := dig "oauth2ProxyIngress" "additionalPeers" (list) .Values.kagent }}
{{- range $o2pPeers }}
{{- if or (not (kindIs "map" .)) (not .) }}
{{- fail (printf "kagent.oauth2ProxyIngress.additionalPeers: every item is a non-empty pod label map (matchLabels), e.g. {app: teleport-kube-agent, io.kubernetes.pod.namespace: kube-system}; got %v" .) }}
{{- end }}
{{- end }}
---
# Ingress to oauth2-proxy: envoy (proxy port), the installation's extra callers
# (kagent.oauth2ProxyIngress.additionalPeers, proxy port) + Prometheus (metrics port).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-oauth2-proxy-ingress
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
    {{- range $o2pPeers }}
    - fromEndpoints:
        - matchLabels:
            {{- toYaml . | nindent 12 }}
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
    {{- end }}
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "44180"
              protocol: TCP
---
# Allow oauth2-proxy: DNS, Dex OIDC (world:443), kagent UI backend.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-oauth2-proxy-egress
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  egress:
    {{- include "agent-platform.dnsEgress" . | nindent 4 }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kagent
            app.kubernetes.io/component: ui
            io.kubernetes.pod.namespace: {{ $kagentNs }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # world: public Dex hostname resolves to a public IP (e.g. AWS public NLB).
    # cluster: same hostname resolves to a private-range LB VIP (e.g. Azure
    # internal LB at 10.x) — Cilium classifies private IPs as cluster, not world.
    # Port 443 covers world (direct TLS) and cluster (LB VIP before DNAT).
    # Port 10443 covers cluster after Azure LB DNAT: kube-proxy rewrites
    # LB:443 → nodeport → Envoy pod:10443 (Envoy Gateway uses listener+10000
    # internally to avoid root-privilege ports), so Cilium intercepts port 10443.
    - toEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
---
# Allow oauth2-proxy to reach the kagent UI.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-kagent-ui-ingress
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kagent
      app.kubernetes.io/component: ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: oauth2-proxy
            io.kubernetes.pod.namespace: {{ $kagentNs }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
{{- end }}
{{- else if eq (include "agent-platform.networkPolicyFlavor" .) "kubernetes" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "name" . }}-kagent-controller-ingress
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: kagent
  policyTypes: [Ingress]
  # The agentgateway data-plane pods of the release namespace and the kagent UI
  # only — the two authentication boundaries the controller relies on (see the
  # cilium policy above for why nothing else is admitted).
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
              app.kubernetes.io/component: ui
      ports:
        - port: {{ $controllerPort | int }}
          protocol: TCP
{{- end }}

{{- end }}
