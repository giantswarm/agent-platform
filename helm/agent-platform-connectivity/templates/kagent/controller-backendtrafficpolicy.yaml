{{- /* Targets the outer public GRPCRoute, so it is suppressed with it when the
edge is the data plane (controller-route.yaml). A GRPCRoute rule carries no
timeouts field, and Envoy's default route timeout would cut every A2A
SendStreamingMessage turn; the same ingress.backendTrafficPolicy knob that keeps
the /mcp streams alive applies here. */ -}}
{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.kagent.controllerRoute.enabled (not (include "agent-platform.edgeIsDataPlane" .)) .Values.ingress.backendTrafficPolicy.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kagent-controller-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    {{- with .Values.ingress.backendTrafficPolicy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.backendTrafficPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: kagent-controller-public
      namespace: {{ .Release.Namespace }}
  timeout:
    http:
      requestTimeout: {{ .Values.ingress.backendTrafficPolicy.timeout | quote }}
{{- end }}
