{{- /*
The tenant identity of the agents' Flux HelmReleases. The portal's create flow
and agent-manager write one HelmRelease (plus the shared OCIRepository) per
agent into the kagent namespace; under a multi-tenancy lockdown (helm-controller
with --no-cross-namespace-refs and a rights-less default ServiceAccount, or the
Flux multi-tenancy admission policy on Giant Swarm management clusters) such a
HelmRelease executes as the ServiceAccount it names and fails without one
("secrets is forbidden ... :default"). Creating the HelmRelease stays the
caller's identity; executing it is the tenant's.

ONE value, kagent.fluxServiceAccountName, names the ServiceAccount, is the
RoleBinding's subject and is exported to the portal's app-config through the
agent-platform.kagent.fluxServiceAccountName helper; on the release line the
meta chart also derives agent-manager's flux.helmReleaseServiceAccount from it.
On this line (kagent API v2) agent-manager and the portal write AgentTemplates
as the caller and the meta chart forwards no flux key to agent-manager (its
chart's closed schema has none); the identity stays rendered — a
namespace-scoped ServiceAccount + RoleBinding is harmless and the portal's
app-config still names it — until the portal's HelmRelease path is retired too.
Rendered whenever kagent is on. A management cluster that carried the
same two objects by hand adopts them: identical spec, so helm-controller's
take-ownership is a no-op and a kustomize-controller that still applies the
hand-written copy writes the same fields.
*/ -}}
{{- $sa := include "agent-platform.kagent.fluxServiceAccountName" . }}
{{- if $sa }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
---
# Namespace-scoped admin: a RoleBinding to the built-in cluster-admin ClusterRole
# grants full control of every resource (custom resources included) within the
# kagent namespace only — an agent HelmRelease installs its Agent, the shared
# OCIRepository and the Helm release Secret there and nothing anywhere else. The
# built-in `admin` role would not do: it covers only the CRDs that aggregate
# into it, and the kagent.dev kinds do not.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
{{- end }}
