{{- /*
The tenant identity of the agents' Flux HelmReleases. The portal's create flow
and agent-manager write one HelmRelease (plus the shared OCIRepository) per
agent into the kagent namespace; under a multi-tenancy lockdown (helm-controller
with --no-cross-namespace-refs and a rights-less default ServiceAccount, or the
Flux multi-tenancy admission policy on Giant Swarm management clusters) such a
HelmRelease executes as the ServiceAccount it names and fails without one
("secrets is forbidden ... :default"). Creating the HelmRelease stays the
caller's identity; executing it is the tenant's.

ONE value, kagent.fluxServiceAccountName, names the ServiceAccount, is the
RoleBinding's subject, is derived into agent-manager's
flux.helmReleaseServiceAccount by the meta chart and is exported to the
portal's app-config through the agent-platform.kagent.fluxServiceAccountName
helper. Rendered whenever kagent is on.
*/ -}}
{{- $sa := include "agent-platform.kagent.fluxServiceAccountName" . }}
{{- if $sa }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
---
# helm-controller impersonates this identity for every agent HelmRelease of the
# kagent namespace, and the HelmRelease's writer picks the chart. So it holds
# what the Generic agent chart 2.x installs there and nothing else: the two
# kinds the chart renders, an Agent and its RemoteMCPServer, and Helm's release
# Secrets (the Secret storage driver calls get, list, create, update and delete
# in the release's storage namespace, the HelmRelease's).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}-agent-releases
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "remotemcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# A RoleBinding's roleRef is immutable, so this binding is named apart from the
# ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}-agent-releases
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}-agent-releases
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $kagentNs }}
{{- end }}
