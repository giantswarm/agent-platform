{{- /*
Render-time guards for the kagent / postgres wiring. These fail `helm template`
(and therefore CI lint + install) early with an actionable message instead of
producing a silently-broken release.
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
  {{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}

  {{- /* An HTTPRoute with no hostname on the shared public Gateway matches ALL
         traffic to that Gateway and forwards it to the kagent UI/oauth2-proxy.
         The hostname helper derives kagent.<global.domain> when the override
         is empty, and fails the render when neither is set. */ -}}
  {{- if .Values.kagent.uiRoute.enabled }}
    {{- $_ := include "agent-platform.hostname" (dict "ctx" . "prefix" "kagent" "override" .Values.kagent.uiRoute.hostname "key" "kagent.uiRoute.hostname") }}
  {{- end }}

  {{- /* Same footgun on the agentgateway path. */ -}}
  {{- if .Values.kagent.controllerRoute.enabled }}
    {{- $_ := include "agent-platform.hostname" (dict "ctx" . "prefix" "agentgateway" "override" .Values.kagent.controllerRoute.hostname "key" "kagent.controllerRoute.hostname") }}
  {{- end }}

  {{- /* A parentRef override needs both halves: a route with namespace ""
         is rejected by the Gateway API CRD, silently breaking the install. */ -}}
  {{- range $key, $route := dict "uiRoute" .Values.kagent.uiRoute "controllerRoute" .Values.kagent.controllerRoute }}
    {{- if and $route.enabled $route.parentRef.name (not $route.parentRef.namespace) }}
      {{- fail (printf "kagent.%s.parentRef.name is set but .namespace is empty. Set both (the Gateway API CRD rejects an empty namespace), or clear .name to fall back to the chart-owned edge / global.gatewayApi.parentRefs." $key) }}
    {{- end }}
  {{- end }}

  {{- /* A JWT policy without an issuer validates nothing dex-shaped. The
         issuer defaults from global.identity.issuerUrl; the helper fails the
         render when both are empty. */ -}}
  {{- if and .Values.kagent.controllerRoute.enabled ((.Values.kagent.controllerRoute.jwtAuthentication).enabled) (not .Values.kagent.controllerRoute.jwtAuthentication.issuer) }}
    {{- $_ := include "agent-platform.issuerUrl" (dict "ctx" . "for" "kagent.controllerRoute.jwtAuthentication (or set its .issuer)") }}
  {{- end }}

  {{- /* The data plane can only fetch the JWKS from dex on 5556 when jwksEgress
         is on; without it Strict/Optional validation fails closed on every token. */ -}}
  {{- if and .Values.kagent.controllerRoute.enabled ((.Values.kagent.controllerRoute.jwtAuthentication).enabled) (not .Values.gateway.jwksEgress.enabled) }}
    {{- fail "kagent.controllerRoute.jwtAuthentication.enabled is true but gateway.jwksEgress.enabled is false. The agentgateway data plane cannot reach dex on 5556 to fetch the JWKS, so signature validation fails closed. Set gateway.jwksEgress.enabled: true." }}
  {{- end }}

  {{- /* The CNPG-generated DSN Secret lands in the Cluster's namespace; kagent
         mounts it by name, so the two namespaces must match. */ -}}
  {{- if .Values.postgres.enabled }}
    {{- $pgNs := .Values.postgres.namespace | default .Release.Namespace }}
    {{- if ne $pgNs $kagentNs }}
      {{- fail (printf "postgres.namespace (%s) must equal kagent.namespaceOverride (%s) so the CNPG-generated DSN Secret is co-located with the kagent controller that mounts it." $pgNs $kagentNs) }}
    {{- end }}
  {{- end }}
{{- end }}
