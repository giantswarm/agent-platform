{{- /*
Render-time guards for the kagent / postgres wiring. These fail `helm template`
(and therefore CI lint + install) early with an actionable message instead of
producing a silently-broken release.
*/ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
  {{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}

  {{- /* An HTTPRoute with no hostname on the shared public Gateway matches ALL
         traffic to that Gateway and forwards it to the kagent UI/oauth2-proxy.
         The hostname helper derives kagent.<global.domain> when the override
         is empty, and fails the render when neither is set. */ -}}
  {{- if .Values.kagent.uiRoute.enabled }}
    {{- $_ := include "agent-platform.hostname" (dict "ctx" . "prefix" "kagent" "override" .Values.kagent.uiRoute.hostname "key" "kagent.uiRoute.hostname") }}
  {{- end }}

  {{- /* Same footgun on the agentgateway path. */ -}}
  {{- if .Values.kagent.controllerRoute.enabled }}
    {{- $_ := include "agent-platform.kagent.controllerHostname" . }}
  {{- end }}

  {{- /* The controller route is a GRPCRoute matched by gRPC service since 4.0:
         there is no REST on the controller, no path prefix and nothing to
         strip. A pathPrefix left in an installation's values is a stale
         3.x shape — it would be forwarded silently (the kagent block is
         additionalProperties: true), so fail the render and say so. */ -}}
  {{- if hasKey .Values.kagent.controllerRoute "pathPrefix" }}
    {{- fail "kagent.controllerRoute.pathPrefix was retired with 4.0: the controller is a GRPCRoute matched by gRPC service (kagent.api.v1alpha1.*, lf.a2a.v1.A2AService) on kagent.controllerRoute.hostname with no path prefix; remove the key. Clients dial https://<hostname> (gRPC origin) or grpc://agentgateway.<release namespace>.svc.cluster.local:8080 in-cluster." }}
  {{- end }}

  {{- /* The identity header the gateway sets is `jwt.<claim>` in CEL, so the
         claim must be a bare identifier; Dex claims are (email, sub, name). */ -}}
  {{- if and .Values.kagent.controllerRoute.enabled ((.Values.kagent.controllerRoute.jwtAuthentication).enabled) }}
    {{- $claim := include "agent-platform.kagent.userIdClaim" . }}
    {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $claim) }}
      {{- fail (printf "kagent.controller.auth.userIdClaim %q is not a plain claim name ([A-Za-z_][A-Za-z0-9_]*); the controller route's identity transformation reads it as jwt.<claim>" $claim) }}
    {{- end }}
  {{- end }}

  {{- /* A parentRef override needs both halves: a route with namespace ""
         is rejected by the Gateway API CRD, silently breaking the install. */ -}}
  {{- range $key, $route := dict "uiRoute" .Values.kagent.uiRoute "controllerRoute" .Values.kagent.controllerRoute }}
    {{- if and $route.enabled $route.parentRef.name (not $route.parentRef.namespace) }}
      {{- fail (printf "kagent.%s.parentRef.name is set but .namespace is empty. Set both (the Gateway API CRD rejects an empty namespace), or clear .name to fall back to the chart-owned edge / global.gatewayApi.parentRefs." $key) }}
    {{- end }}
  {{- end }}

  {{- /* A JWT policy without an issuer validates nothing dex-shaped. The
         issuer defaults from global.identity.issuerUrl; the helper fails the
         render when both are empty. */ -}}
  {{- if and .Values.kagent.controllerRoute.enabled ((.Values.kagent.controllerRoute.jwtAuthentication).enabled) (not .Values.kagent.controllerRoute.jwtAuthentication.issuer) }}
    {{- $_ := include "agent-platform.issuerUrl" (dict "ctx" . "for" "kagent.controllerRoute.jwtAuthentication (or set its .issuer)") }}
  {{- end }}

  {{- /* An in-cluster JWKS endpoint needs jwksEgress; an external one is
         covered by the controller policy's own rules, on the port the route names. The
         shared helper carries every JWKS guard. */ -}}
  {{- if and .Values.kagent.controllerRoute.enabled ((.Values.kagent.controllerRoute.jwtAuthentication).enabled) }}
    {{- $_ := include "agent-platform.jwks.validate" (dict "ctx" . "path" "kagent.controllerRoute.jwtAuthentication" "jwks" .Values.kagent.controllerRoute.jwtAuthentication.jwks) }}
  {{- end }}

  {{- /* The oauth2-proxy callback must land on the UI hostname the route
         serves. An installation that derives redirect-url from global.domain
         (the standalone umbrella's contract did, through the oauth2-proxy
         chart's tpl of extraArgs) and overrides kagent.uiRoute.hostname renders
         green and breaks login at runtime: the oauth2-proxy chart cannot see
         the route's hostname. Fail the render instead. */ -}}
  {{- $proxy := index .Values.kagent "oauth2-proxy" | default dict }}
  {{- $redirect := dig "extraArgs" "redirect-url" "" $proxy | toString }}
  {{- if and .Values.kagent.uiRoute.hostname (dig "enabled" false $proxy) (contains ".Values.global.domain" $redirect) }}
    {{- fail (printf "kagent.uiRoute.hostname is %q but kagent.oauth2-proxy.extraArgs.redirect-url still derives from global.domain; set redirect-url: https://%s/oauth2/callback" .Values.kagent.uiRoute.hostname .Values.kagent.uiRoute.hostname) }}
  {{- end }}

  {{- /* The CNPG-generated DSN Secret lands in the Cluster's namespace; kagent
         mounts it by name, so the two namespaces must match. */ -}}
  {{- if .Values.postgres.enabled }}
    {{- $pgNs := .Values.postgres.namespace | default .Release.Namespace }}
    {{- if ne $pgNs $kagentNs }}
      {{- fail (printf "postgres.namespace (%s) must equal kagent.namespaceOverride (%s) so the CNPG-generated DSN Secret is co-located with the kagent controller that mounts it." $pgNs $kagentNs) }}
    {{- end }}
  {{- end }}
{{- end }}
