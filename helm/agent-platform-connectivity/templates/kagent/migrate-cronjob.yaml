{{- /*
The cut-over of one installation's agents to the kagent API v2 line
(giantswarm/agent-platform#346; bumblebee-plans#51 D11, expand–contract):
`agent-manager migrate`, run once per pod template, in the kagent namespace,
as the tenant identity of the agents' Flux HelmReleases
(kagent.fluxServiceAccountName — never the literal; verify-identity forbids
it). The command rewrites every portal-created Generic-chart release to chart
1.x values (removed keys dropped, muster.toolNames → muster.tools, every git
skill pinned to a commit, the per-namespace OCIRepository moved to 1.x), emits
the same rewrite as a diff for every GitOps-owned release (read in the
namespaces of agentManager.migration.gitopsNamespaces, never written), records
its report in the ConfigMap agent-manager-migrate-report of the kagent
namespace, and — once every AgentTemplate is Ready on the platform Harness and
no release is left on 0.x — deletes the leftover kagent.dev/v1alpha2 Agents and
the five removed CRDs (agents, sandboxagents, agentharnesses, memories,
toolservers), which the kagent upgrade leaves in place (helm.sh/resource-policy:
keep). Every phase is idempotent and gated on the previous one; a failed phase
leaves the v1alpha2 objects in place; a run that finds nothing left changes
nothing.

A suspended CronJob, started by a hook, deliberately not a Job of the
release: this release also renders the platform Harness, and a migrate
failure (the API refused, kagent v2 not served, the report not writable — the
command's non-zero exits) must never fail the upgrade that carries it and let
helm-controller remediate the platform's wiring. Helm's readiness check reads
a Failed Job of the release as Failed whether or not it waits for Jobs
(disableWaitForJobs only stops the wait for completion), and a regular Job
applied with the release starts before the CRD-backed CiliumNetworkPolicy
that gives it egress (Helm applies kinds it does not know last), so on a
default-deny cluster its pod reached nothing, failed, and stalled every
upgrade until the Job's TTL removed it (giantswarm/agent-platform#378). So:

1. The CronJob agent-manager-migrate holds the run's template and is never
   scheduled (suspend: true): a CronJob reads Current to the readiness check
   whatever its Jobs do, and it is the source of every run — the hook's and a
   hand re-run's (`kubectl create job --from=cronjob/…`, UPGRADE.md).
2. The post-install / post-upgrade hook agent-manager-migrate-start
   (templates/_hooks.tpl) creates the run from it once the release's
   manifests — the migration's network policy, the tenant identity and its
   namespace admin among them — are applied: the run's pod starts under its
   egress. The hook runs as the tenant identity in the kagent namespace under
   the migration's component label, so it needs no right and no policy of its
   own. The hook only creates; it ends before the run does, so the run's
   outcome never reaches the release. A Failed run is reported where a
   successful one is: its Job (owned by the CronJob), its log and the report
   ConfigMap.

The run's name carries an 8-hex hash of its rendered pod template — image,
args, environment, identity, labels: an upgrade that changes any of it starts
a new run, an upgrade that changes none finds the run of that name and starts
nothing (the hook skips an existing name, finished or not). The pod template
carries the stable labels only (never helm.sh/chart or
app.kubernetes.io/version), so a chart release alone starts no run
(giantswarm/agent-platform#399). So the command's expand phase runs when
connectivity 4.0 first renders the migration, and the contract phase — once
the templates are Ready — is a re-run: by hand from the CronJob, or the next
upgrade after ttlSecondsAfterFinished removed the finished run
(giantswarm/agentlab#143 rehearses the sequence; `migrate` exits 0 while
something is pending, so no in-Job waiting).

The run takes its inputs the way `agent-manager serve` does, as environment:
the kagent namespace, the further managed namespaces, the agent chart's OCI URL
and range (1.x on the 4.0 meta chart), the GitOps namespaces the GitOps-owned
releases are read from, and the platform Harness name. It reads no GitHub
token: public skill repositories resolve, private refs are reported as
pending (agents read private skills through agent-manager's minted
agent-manager-skills-token, whose Basic form `migrate` cannot use). The
CronJob, its start hook, its migration-only bindings (migrate-rbac.yaml) and
this note retire in a later 4.x release once the last installation is cut
over.
*/ -}}
{{- if (include "agent-platform.kagent.migration" .) }}
{{- $sa := include "agent-platform.kagent.fluxServiceAccountName" . }}
{{- if not $sa }}
{{- fail "agentManager.migration.enabled is true but kagent.fluxServiceAccountName is empty: the agent-manager migrate Job runs as the tenant identity of the agents' HelmReleases and has no other identity. Set kagent.fluxServiceAccountName (the tenant ServiceAccount the fleet's agent HelmReleases run as), or set agentManager.migration.enabled: false" }}
{{- end }}
{{- $m := .Values.agentManager.migration }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $am := include "agent-platform.agentManager.chartValues" . | fromJson }}
{{- $image := include "agent-platform.kagent.migration.image" . }}
{{- $args := list "migrate" }}
{{- if $m.dryRun }}{{- $args = append $args "--dry-run" }}{{- end }}
{{- $env := list
      (dict "name" "KUBERNETES_IN_CLUSTER" "value" "true")
      (dict "name" "KAGENT_NAMESPACE" "value" $kagentNs) }}
{{- with (dig "kagent" "additionalNamespaces" list $am) }}
{{- $env = append $env (dict "name" "AGENT_MANAGER_MANAGED_NAMESPACES" "value" (join "," .)) }}
{{- end }}
{{- $env = append $env (dict "name" "AGENT_CHART_OCI_URL" "value" (dig "agentChart" "ociUrl" "oci://gsoci.azurecr.io/charts/giantswarm/agent" $am)) }}
{{- $env = append $env (dict "name" "AGENT_CHART_SEMVER" "value" (dig "agentChart" "semver" "1.x" $am | toString)) }}
{{- with (dig "agentChart" "semverFilter" "" $am) }}
{{- $env = append $env (dict "name" "AGENT_CHART_SEMVER_FILTER" "value" .) }}
{{- end }}
{{- with $m.gitopsNamespaces }}
{{- /* The namespaces the GitOps-owned releases are read from (the Roles of
migrate-rbac.yaml grant exactly that read there). */ -}}
{{- $env = append $env (dict "name" "AGENT_MANAGER_MIGRATE_GITOPS_NAMESPACES" "value" (join "," .)) }}
{{- end }}
{{- /* The platform Harness every migrated template must become Ready on. Its
name is fixed by the kagent API v2 contract (the Harness `kagent`, admission
label agent-platform.giantswarm.io/harness: kagent), so it is written here,
not read from kagent.harness. */ -}}
{{- $env = append $env (dict "name" "AGENT_HARNESS_NAME" "value" "kagent") }}
{{- /* The chart's schema and the skill resolver cache under $HOME; the root
filesystem is read-only. */ -}}
{{- $env = append $env (dict "name" "HOME" "value" "/tmp") }}
{{- $template := include "agent-platform.kagent.migration.podTemplate" (dict "root" . "serviceAccountName" $sa "image" $image "args" $args "env" $env) }}
{{- $hash := $template | sha256sum | trunc 8 }}
{{- $name := printf "%s-%s" (include "agent-platform.kagent.migration.name" .) $hash }}
{{- $about := "agent-manager migrate: the cut-over of this installation's agents to chart 1.x on the kagent API v2 line; re-run with kubectl create job --from=cronjob/<this> (UPGRADE.md)" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "agent-platform.kagent.migration.name" . }}
  namespace: {{ $kagentNs }}
  labels:
    {{- include "agent-platform.kagent.migration.labels" . | nindent 4 }}
  annotations:
    agent-platform.giantswarm.io/about: {{ $about | quote }}
spec:
  # Never scheduled: every run is created from this template, by the start
  # hook or by hand. The schedule names a day that does not exist.
  suspend: true
  schedule: "0 0 31 2 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        {{- include "agent-platform.kagent.migration.labels" . | nindent 8 }}
      annotations:
        agent-platform.giantswarm.io/about: {{ $about | quote }}
    spec:
      # The command is idempotent, so a retry after a transient API error is
      # safe.
      backoffLimit: 2
      activeDeadlineSeconds: 900
      # A finished run stays a day for the report's context and the hand
      # re-run; an upgrade after that starts it again (idempotent).
      ttlSecondsAfterFinished: 86400
      template:
        {{- $template | nindent 8 }}
---
{{ include "agent-platform.hooks.job" (dict
      "root" .
      "name" "agent-manager-migrate-start"
      "hook" "post-install,post-upgrade"
      "about" "starts the agent-manager migrate run from its CronJob once the release's manifests (its network policy among them) are applied; the run's outcome never reaches the release"
      "identity" (dict "namespace" $kagentNs "serviceAccountName" $sa "component" "agent-manager-migrate")
      "script" (include "agent-platform.kagent.migration.startScript" (dict "namespace" $kagentNs "cronJob" (include "agent-platform.kagent.migration.name" .) "job" $name))) }}
{{- end }}
