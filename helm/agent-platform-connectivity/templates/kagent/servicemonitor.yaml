{{- /* Both gates apply: global.observability.metrics.serviceMonitor.enabled
switches every monitor object this chart renders (a vanilla cluster has no
monitoring.coreos.com CRDs); kagent.serviceMonitor.enabled keeps working
underneath as this object's own toggle. */ -}}
{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) (include "agent-platform.serviceMonitor" .) .Values.kagent.serviceMonitor.enabled }}
{{- $kagentNs := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $releaseName := .Release.Name }}
{{- $monitor := .Values.global.observability.metrics.serviceMonitor }}
# Service exposing the kagent controller metrics port (:8080).
# The upstream controller-service.yaml only exposes port 8083 (API). We add a
# separate Service here so the ServiceMonitor below can target it without
# patching the kagent chart's single-port Service template.
#
# The Service is THIS chart's object (named and labelled after this release,
# which is what the ServiceMonitor's matchLabels select), but it selects the
# kagent chart's pods, which carry kagent's OWN release name in their instance
# label — `kagent`, the component key the meta chart fixes as the kagent release
# name (agent-platform.kagent.releaseName). Selecting this release's name here
# matched nothing under the meta chart: the Service had no endpoints and the
# controller was never scraped (giantswarm/agent-platform#305).
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $releaseName }}-kagent-controller-metrics
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: kagent-metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kagent
    app.kubernetes.io/instance: {{ include "agent-platform.kagent.releaseName" . }}
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# ServiceMonitor for the kagent controller's controller-runtime Prometheus metrics.
# Requires the Prometheus Operator CRD (monitoring.coreos.com/v1).
# The controller exposes metrics at :8080/metrics (HTTP, no TLS) when
# METRICS_BIND_ADDRESS=:8080 and METRICS_SECURE=false are set.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "name" . }}-kagent-controller
  namespace: {{ $kagentNs }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    {{- with ($monitor.labels | default .Values.kagent.serviceMonitor.labels) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "name" . | quote }}
      app.kubernetes.io/instance: {{ $releaseName | quote }}
      app.kubernetes.io/component: kagent-metrics
  namespaceSelector:
    matchNames:
      - {{ $kagentNs }}
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: {{ $monitor.interval | default .Values.kagent.serviceMonitor.interval | default "60s" }}
{{- end }}
