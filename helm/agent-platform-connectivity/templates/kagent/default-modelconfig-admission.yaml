{{- /*
At most one ModelConfig per namespace carries the default label
(agent-platform.defaultModelConfigLabel, value "true"). The binding's paramRef
selects the labelled ModelConfigs of the request's own namespace (no
paramRef.namespace), and the API server ANDs the validation over every match,
so a labelled ModelConfig is admitted only while it is the namespace's sole
labelled one. No labelled ModelConfig in the namespace: no params, admitted.
Every namespace is matched: the rule is per namespace, and ModelConfigs live in
the kagent namespace and in the organizations' namespaces alike. Removing the
label, the status subresource and an object being deleted are not held, so a
namespace that already holds two can be repaired.
*/ -}}
{{- if include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent") }}
{{- $label := include "agent-platform.defaultModelConfigLabel" . }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-platform-default-model-config
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: api.kagent.dev/v1alpha3
    kind: ModelConfig
  matchConstraints:
    resourceRules:
      - apiGroups: ["api.kagent.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["modelconfigs"]
  matchConditions:
    - name: labelled-default
      expression: {{ printf "has(object.metadata.labels) && '%s' in object.metadata.labels && object.metadata.labels['%s'] == 'true'" $label $label | quote }}
    - name: not-deleting
      expression: "!has(object.metadata.deletionTimestamp)"
  validations:
    - expression: "params.metadata.name == object.metadata.name"
      reason: Invalid
      messageExpression: >-
        {{ printf "'namespace ' + request.namespace + ' already has a default ModelConfig, ' + params.metadata.name + ' (label %s=true); remove the label there first. Refused: ' + object.metadata.name" $label }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-platform-default-model-config
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  policyName: agent-platform-default-model-config
  paramRef:
    selector:
      matchLabels:
        {{ $label }}: "true"
    parameterNotFoundAction: Allow
  validationActions: [Deny]
{{- end }}
