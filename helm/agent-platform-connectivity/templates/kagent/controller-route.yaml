{{- if and (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) .Values.kagent.controllerRoute.enabled }}
{{- $route := .Values.kagent.controllerRoute }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $kagentFullname := include "agent-platform.kagent.fullname" . }}
# AgentgatewayBackend — registers the kagent controller as a backend that
# agentgateway proxies to after JWT validation (controller-jwt-policy.yaml).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kagent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  policies:
    auth:
      # The gateway strips the JWT after validation; passthrough re-injects it
      # so the bearer reaches the controller: the controller re-derives the
      # caller from it (trusted-proxy authenticator, the second layer) and
      # forwards it to the actor unchanged (KAGENT_PROPAGATE_TOKEN — the person
      # at muster).
      passthrough: {}
    # No policies.http.version: agentgateway infers the backend protocol per
    # request — HTTP/2 (h2c) for gRPC, the original HTTP/1.1 for gRPC-Web —
    # and the controller needs exactly that split: it serves both on one port
    # and hands every HTTP/2 request whose content-type starts with
    # application/grpc to its native gRPC server, so gRPC-Web pinned onto HTTP/2
    # is answered 415 (invalid gRPC request content-type). Verified in the lab.
  static:
    host: {{ printf "%s-controller.%s.svc.cluster.local" $kagentFullname $ns }}
    port: 8083
---
# GRPCRoute — the kagent controller API on the agentgateway Gateway, matched by
# gRPC service and method (kagent.controllerRoute.grpc.services: the kagent API
# v2 services and A2A v1, one rule per service, one exact match per RPC), never
# by path prefix: there is no REST on the controller and no prefix to strip.
# The same route carries gRPC-Web (application/grpc-web+proto over HTTP/1.1
# POST at the same /<service>/<method> paths) for browsers.
#
# This is the internal data-plane hop. It is deliberately NOT hostname-scoped:
# the in-cluster callers (klaus-gateway's a2a.url, the Dev Portal backend) dial
# the agentgateway Service by its cluster-DNS name, so their :authority is
# agentgateway.<ns>.svc.cluster.local:8080, which no public hostname matches. The
# matches are exact service/method paths, so a hostname-less route captures
# nothing else and outranks the MCP catch-all's PathPrefix.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: kagent-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    {{- include "agent-platform.kagent.grpcRules" (dict "ctx" . "backendRefs" "- name: kagent\n  kind: AgentgatewayBackend\n  group: agentgateway.dev") | trim | nindent 4 }}
{{- if not (include "agent-platform.edgeIsDataPlane" .) }}
---
# GRPCRoute — the same services on the outer public Gateway (TLS-terminating),
# forwarded to the agentgateway Service, which applies the JWT policy and the
# identity transformation before the controller. A GRPCRoute makes the outer
# Gateway speak HTTP/2 to the agentgateway Service, so native gRPC survives the
# hop end to end. Not rendered when the data plane is the edge itself: the
# inner route above then serves the public hostname on the HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: kagent-controller-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  parentRefs:
    {{- $override := list }}
    {{- if $route.parentRef.name }}
    {{- $override = list (dict "name" $route.parentRef.name "namespace" $route.parentRef.namespace "group" "gateway.networking.k8s.io" "kind" "Gateway") }}
    {{- end }}
    {{- include "agent-platform.parentRefs" (dict "ctx" . "override" $override "key" "kagent.controllerRoute.parentRef") | nindent 4 }}
  hostnames:
    - {{ include "agent-platform.kagent.controllerHostname" . | quote }}
  rules:
    {{- include "agent-platform.kagent.grpcRules" (dict "ctx" . "backendRefs" (printf "- name: %s\n  port: 8080" .Values.gateway.name)) | trim | nindent 4 }}
{{- end }}
{{- end }}
