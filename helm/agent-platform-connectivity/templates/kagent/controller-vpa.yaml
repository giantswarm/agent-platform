{{- /* VerticalPodAutoscaler on the kagent controller Deployment (the #439
pattern: the kagent chart has no VPA knob, so the umbrella renders the object
the way it does the muster-valkey budget, naming the Deployment the way the
kagent chart names it — <fullname>-controller in the kagent namespace).
kagent.controller.vpa.enabled is a cluster-shape knob: `auto` follows whether
autoscaling.k8s.io/v1 is served (the VPA CRD is not part of Kubernetes
conformance), an explicit true / false wins. The controller is one replica
behind a PodDisruptionBudget with minAvailable: 1 and karpenter.sh/do-not-disrupt,
so an evicting update mode could never apply: InPlaceOrRecreate (VPA 1.5+ on
Kubernetes 1.33+ with in-place pod resize) resizes the running pod's requests
without an eviction, and a resize that cannot apply in place falls back to an
eviction the budget refuses — the pod keeps its requests until its next roll.
minReplicas: 1 makes the single replica eligible whatever the updater's
--min-replicas flag says. RequestsOnly leaves the chart's limits alone, and
maxAllowed stays under them: requests equal to limits on both resources would
turn the Burstable pod Guaranteed, a QoS change no resize may make. */ -}}
{{- if (include "agent-platform.componentEnabled" (dict "root" $ "name" "kagent")) }}
{{- /* dig, not .Values.kagent.controller.vpa: an installation that deletes the
controller block leaves no `controller` to dereference, and the render would
die on a nil pointer instead of quietly rendering nothing. */ -}}
{{- $vpa := dig "controller" "vpa" dict (.Values.kagent | default dict) }}
{{- /* The spelling guard sits OUTSIDE the enabled check on purpose (the #373
lesson): the kagent block is open in the schema, so a misspelt key would be
dropped in silence — and inside the check it would pass today and fail the
render on the day somebody turns the VPA on. */ -}}
{{- $keys := list "enabled" "updateMode" "controlledValues" "minAllowed" "maxAllowed" }}
{{- range $key, $_ := $vpa }}
{{- if not (has $key $keys) }}
{{- fail (printf "kagent.controller.vpa.%s is not a key of the controller's VerticalPodAutoscaler knob (%s); the kagent block is open in the schema, so the spelling is this guard's to check" $key (join ", " $keys)) }}
{{- end }}
{{- end }}
{{- if (include "agent-platform.kagentControllerVpa" .) }}
{{- /* A null set through the meta chart deletes the key at that layer, so it
arrives here as unset — say so instead of quoting "<nil>". */ -}}
{{- $modes := list "Off" "Initial" "Recreate" "InPlaceOrRecreate" "Auto" }}
{{- if kindIs "invalid" $vpa.updateMode }}
{{- fail (printf "kagent.controller.vpa.updateMode is unset (a null set through the meta chart deletes the key rather than passing it on); set one of %s" (join ", " $modes)) }}
{{- end }}
{{- if not (has (toString $vpa.updateMode) $modes) }}
{{- fail (printf "kagent.controller.vpa.updateMode=%q is not a VerticalPodAutoscaler update mode (%s)" (toString $vpa.updateMode) (join ", " $modes)) }}
{{- end }}
{{- $controlled := list "RequestsAndLimits" "RequestsOnly" }}
{{- if kindIs "invalid" $vpa.controlledValues }}
{{- fail (printf "kagent.controller.vpa.controlledValues is unset (a null set through the meta chart deletes the key rather than passing it on); set one of %s" (join ", " $controlled)) }}
{{- end }}
{{- if not (has (toString $vpa.controlledValues) $controlled) }}
{{- fail (printf "kagent.controller.vpa.controlledValues=%q is not a VerticalPodAutoscaler controlledValues (%s)" (toString $vpa.controlledValues) (join ", " $controlled)) }}
{{- end }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "agent-platform.kagent.fullname" . }}-controller
  namespace: {{ .Values.kagent.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
    app.kubernetes.io/component: kagent-controller-vpa
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agent-platform.kagent.fullname" . }}-controller
  updatePolicy:
    updateMode: {{ $vpa.updateMode }}
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: controller
        controlledValues: {{ $vpa.controlledValues }}
        {{- with $vpa.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $vpa.maxAllowed }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
{{- end }}
