{{- /* Everything that reaches the LLM listener goes to the provider. The route
pins itself to that listener with sectionName: the kagent controller route
attaches to every listener of its parent, and in edge mode that would put agent
inference on the public HTTPS listener. */ -}}
{{- if (include "agent-platform.llmRouting" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "name" . }}-llm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
      group: gateway.networking.k8s.io
      kind: Gateway
      sectionName: {{ .Values.llmRouting.listener.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- /* Streamed completions stay open under the shared route timeouts
      (request: 0s asks the implementation to disable the request timeout). */}}
      {{- with (include "agent-platform.routeTimeouts" .) }}
      {{- . | nindent 6 }}
      {{- end }}
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: {{ .Values.llmRouting.backend.name }}
{{- end }}
