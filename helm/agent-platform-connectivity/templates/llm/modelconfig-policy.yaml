{{- /* Sends a ModelConfig through the LLM listener, whoever declares it:
GitOps, Backstage, agent-manager or kubectl. Without it the model calls the
provider directly and its usage never reaches the gateway's metrics.

Rendered only where the API server serves the GA group. On a beta API server
(1.34, 1.35) the object is accepted and the admission plugin stays off behind
its feature gate, so the policy would exist and mutate nothing. An absent object
is honest; a silent one is not. Confirm with:

  kubernetes_feature_enabled{name="MutatingAdmissionPolicy", job="apiserver"}

Every write marks the baseUrl it sets (agent-platform.llmRouting.baseUrlMark):
turning routing off removes these policies and the listener, and the reconcile
hook (modelconfig-routing-hook.yaml) takes exactly the marked baseUrls off
again, which Helm cannot: it never owned them.

With agentPlatformOrganizations.enabled (agent-platform.tenants.modelConfigs)
the policies also fill in the listener in every organization namespace
(agent-platform.orgNamespaces.label: a second binding each; the reconcile hook
still reads the kagent namespace only): an organization's ModelConfig may omit
baseUrl. There an explicit baseUrl that is
not the listener is refused by agent-platform-tenant-model-routing
(templates/tenants/modelconfig-admission.yaml), and so is an empty one when
this policy fails: Ignore here fails closed there. With a serving
model-manager (agent-platform.modelManager.serves) the organizations' list
(agent-platform.tenants.providers) adds OpenAI, the format its models are
called in on the listener; a provider only that list has gets the
organizations' binding alone, so an OpenAI ModelConfig in the kagent namespace
keeps calling its provider directly. */ -}}
{{- if and (include "agent-platform.llmRouting" .) (include "agent-platform.llmRouting.modelConfigs" .) }}
{{- $mark := include "agent-platform.llmRouting.baseUrlMark" . }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- $organizations := include "agent-platform.tenants.modelConfigs" . }}
{{- $platform := include "agent-platform.llmRouting.providers" . | fromJsonArray }}
{{- $providers := $platform }}
{{- if $organizations }}
{{- $providers = include "agent-platform.tenants.providers" . | fromJsonArray }}
{{- end }}
{{- /* One policy per provider the listener serves: the block that carries
baseUrl and the URL differ by provider (an OpenAI ModelConfig's ends in /v1).
The first keeps the unsuffixed name. */}}
{{- range $i, $provider := $providers }}
{{- $urlKey := include "agent-platform.modelConfigBaseUrlKey" $provider }}
{{- $url := include "agent-platform.llmListenerUrl" (dict "root" $ "provider" $provider) }}
{{- $name := printf "%s-modelconfig-llm-routing" (include "name" $) }}
{{- if $i }}{{ $name = printf "%s-%s" $name $provider }}{{ end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  {{- /* A model that keeps the direct path costs unmetered usage. A model that
  cannot be created costs an outage. Ignore is the cheaper failure. */}}
  failurePolicy: Ignore
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ["api.kagent.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["modelconfigs"]
    {{- /* With the Organizations' namespaces, the bindings select. */}}
    {{- if not $organizations }}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
    {{- end }}
  matchConditions:
    - name: provider-matches
      expression: >-
        has(object.spec.provider) &&
        object.spec.provider.lowerAscii() == {{ $provider | quote }}
    {{- /* An explicit baseUrl stays untouched. In the kagent namespace that is
    the escape hatch: a model reaches the provider directly by naming the
    provider URL itself. In an Organization namespace there is no escape:
    agent-platform-tenant-model-routing refuses a baseUrl that is not the
    listener. */}}
    - name: base-url-absent
      expression: >-
        !has(object.spec.{{ $urlKey }}) ||
        !has(object.spec.{{ $urlKey }}.baseUrl)
    {{- /* A ChatGPT login stays off the listener, whose OpenAI route serves the
    OpenAI API: kagent sends the login to the baseUrl it finds, and without one
    to the ChatGPT Codex backend. */}}
    {{- if eq $urlKey "openAI" }}
    - name: not-chatgpt-login
      expression: >-
        !has(object.spec.openAI) ||
        !has(object.spec.openAI.credentialType) ||
        object.spec.openAI.credentialType != "chatgptOAuth"
    {{- end }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{annotations: { {{ $mark | quote }}: {{ $url | quote }} }},
            spec: Object.spec{ {{ $urlKey }}: Object.spec.{{ $urlKey }}{
              baseUrl: {{ $url | quote }}
            }}}
{{- if has $provider $platform }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  policyName: {{ $name }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
{{- end }}
{{- if $organizations }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-organizations
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  policyName: {{ $name }}
  matchResources:
    namespaceSelector:
      {{- include "agent-platform.orgNamespaces.selector" $ | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
