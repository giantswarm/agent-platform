{{- /* Sends a ModelConfig this chart does not render through the LLM listener.
The chart's own entries already carry the baseUrl, so this policy only reaches
objects created elsewhere: Backstage, agent-manager, or kubectl. Without it such
a model calls the provider directly and its usage never reaches the gateway's
metrics.

Rendered only where the API server serves the GA group. On a beta API server
(1.34, 1.35) the object is accepted and the admission plugin stays off behind
its feature gate, so the policy would exist and mutate nothing. An absent object
is honest; a silent one is not. Confirm with:

  kubernetes_feature_enabled{name="MutatingAdmissionPolicy", job="apiserver"}

Every write marks the baseUrl it sets (agent-platform.llmRouting.baseUrlMark):
turning routing off removes these policies and the listener, and the reconcile
hook (modelconfig-routing-hook.yaml) takes exactly the marked baseUrls off
again, which Helm cannot: it never owned them. */ -}}
{{- if and (include "agent-platform.llmRouting" .) (include "agent-platform.llmRouting.modelConfigs" .) }}
{{- $mark := include "agent-platform.llmRouting.baseUrlMark" . }}
{{- $ns := .Values.kagent.namespaceOverride | default .Release.Namespace }}
{{- /* One policy per provider the listener serves
(agent-platform.llmRouting.providers): the block that carries baseUrl and the
URL differ by provider (an OpenAI ModelConfig's ends in /v1). The first keeps
the unsuffixed name. */}}
{{- range $i, $provider := include "agent-platform.llmRouting.providers" . | fromJsonArray }}
{{- $urlKey := include "agent-platform.modelConfigBaseUrlKey" $provider }}
{{- $url := include "agent-platform.llmListenerUrl" (dict "root" $ "provider" $provider) }}
{{- $name := printf "%s-modelconfig-llm-routing" (include "name" $) }}
{{- if $i }}{{ $name = printf "%s-%s" $name $provider }}{{ end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  {{- /* A model that keeps the direct path costs unmetered usage. A model that
  cannot be created costs an outage. Ignore is the cheaper failure. */}}
  failurePolicy: Ignore
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ["api.kagent.dev"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["modelconfigs"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
  matchConditions:
    - name: provider-matches
      expression: >-
        has(object.spec.provider) &&
        object.spec.provider.lowerAscii() == {{ $provider | quote }}
    {{- /* An explicit baseUrl stays untouched. That is the escape hatch: a model
    reaches the provider directly by naming the provider URL itself. */}}
    - name: base-url-absent
      expression: >-
        !has(object.spec.{{ $urlKey }}) ||
        !has(object.spec.{{ $urlKey }}.baseUrl)
    {{- /* A ChatGPT login stays off the listener, whose OpenAI route serves the
    OpenAI API: kagent sends the login to the baseUrl it finds, and without one
    to the ChatGPT Codex backend. */}}
    {{- if eq $urlKey "openAI" }}
    - name: not-chatgpt-login
      expression: >-
        !has(object.spec.openAI) ||
        !has(object.spec.openAI.credentialType) ||
        object.spec.openAI.credentialType != "chatgptOAuth"
    {{- end }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{annotations: { {{ $mark | quote }}: {{ $url | quote }} }},
            spec: Object.spec{ {{ $urlKey }}: Object.spec.{{ $urlKey }}{
              baseUrl: {{ $url | quote }}
            }}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  policyName: {{ $name }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
{{- end }}
{{- end }}
