{{- /* The LLM path's Gateway-scoped policy: the route-type map.

`backend.ai.routes` maps the client path to the body format the gateway parses.
It is mandatory: without it an `ai` backend parses every body as OpenAI
Completions and mis-parses Anthropic bodies. Selection matches the client path
against the keys by suffix, so the "*" entry forwards any other path unchanged
instead of falling back to Completions. A Gateway-scoped backend.ai section
applies to AI backends only, and the LLM route is the only AI route here.

No `frontend.metrics` here: the data plane honours ONE metrics policy per
Gateway (custom labels replace rather than merge; of two policies one is kept
and the other dropped in silence, and which one has changed between
agentgateway releases), and the labels — the calling agent, the person —
describe every route, not the LLM path, so they live in the Gateway's own
policy, templates/agentgateway/metrics-policy.yaml (gateway.metricLabels),
rendered whether or not this one is. */ -}}
{{- if (include "agent-platform.llmRouting" .) }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "name" . }}-llm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  backend:
    ai:
      routes:
        {{- range $path, $type := .Values.llmRouting.routes }}
        {{ $path | quote }}: {{ $type }}
        {{- end }}
{{- end }}
