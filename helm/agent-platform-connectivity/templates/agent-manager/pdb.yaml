{{- /* PodDisruptionBudget on the agent-manager pods (giantswarm/agent-platform#431).
The component chart has no knob of its own, so the umbrella renders the budget
next to the component's route and network policies, selecting the pods the way
those do (agent-platform.agentManager.podSelector). With the component's one
replica, minAvailable: 1 refuses every voluntary eviction — Karpenter's
consolidation reports DisruptionBlocked, a node drain waits for its drain
timeout — and AlwaysAllow keeps a pod that is not Ready evictable. */ -}}
{{- $pdb := .Values.agentManager.podDisruptionBudget }}
{{- if and (include "agent-platform.agentManager.enabled" .) $pdb.enabled }}
{{- $hasMin := not (kindIs "invalid" $pdb.minAvailable) }}
{{- $hasMax := not (kindIs "invalid" $pdb.maxUnavailable) }}
{{- if and $hasMin $hasMax }}
{{- fail "agentManager.podDisruptionBudget sets both minAvailable and maxUnavailable; a PodDisruptionBudget takes exactly one" }}
{{- end }}
{{- if not (or $hasMin $hasMax) }}
{{- fail "agentManager.podDisruptionBudget.enabled is true but neither minAvailable nor maxUnavailable is set; set exactly one" }}
{{- end }}
{{- with $pdb.unhealthyPodEvictionPolicy }}
{{- if not (has . (list "IfHealthyBudget" "AlwaysAllow")) }}
{{- fail (printf "agentManager.podDisruptionBudget.unhealthyPodEvictionPolicy=%q is not a PodDisruptionBudget eviction policy (IfHealthyBudget, AlwaysAllow)" .) }}
{{- end }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agent-platform.agentManager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.agentManager.labels" . | nindent 4 }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
  {{- with $pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-platform.agentManager.podSelector" . | nindent 6 }}
{{- end }}
