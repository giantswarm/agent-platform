{{- /* PodDisruptionBudget on the agent-manager pods (giantswarm/agent-platform#431).
The component chart has no knob of its own, so the umbrella renders the budget
next to the component's route and network policies, selecting the pods the way
those do (agent-platform.agentManager.podSelector). With the component's one
replica, minAvailable: 1 refuses every voluntary eviction — Karpenter's
consolidation reports DisruptionBlocked, a node drain waits for its drain
timeout — and AlwaysAllow keeps a pod that is not Ready evictable. */ -}}
{{- $pdb := .Values.agentManager.podDisruptionBudget }}
{{- if and (include "agent-platform.agentManager.enabled" .) $pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "agent-platform.agentManager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-platform.agentManager.labels" . | nindent 4 }}
spec:
  {{- include "agent-platform.podDisruptionBudget.spec" (dict "path" "agentManager.podDisruptionBudget" "pdb" $pdb) | nindent 2 }}
  selector:
    matchLabels:
      {{- include "agent-platform.agentManager.podSelector" . | nindent 6 }}
{{- end }}
