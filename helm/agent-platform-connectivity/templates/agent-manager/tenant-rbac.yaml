{{- /*
The RBAC of agent-manager's tenant reconciler (giantswarm/agent-platform#706,
giantswarm/agent-manager#71). The reconciler watches the namespaces labelled
giantswarm.io/organization and keeps, in each, what an agent needs there: the
network policies (of the platform's flavor, networkPolicy.flavor), the agent
chart's OCIRepository, the ServiceAccount the
agents' HelmReleases run as (kagent.fluxServiceAccountName) and its
RoleBinding, and, while the namespace holds an agent, the Harness, its
WorkerPool and the default ModelConfig. It is background work, so it runs as
agent-manager's own ServiceAccount, which oauth.downstream otherwise leaves
without RBAC.

RBAC cannot select namespaces by label, so the ClusterRoleBinding grants these
rights in every namespace; the reconciler acts on labelled namespaces only.
The ServiceAccount it binds gets agent-platform-tenant-flux, the rights an
agent's release needs in its namespace (the Helm release Secrets and the
objects the agent chart renders), and agent-manager may bind that role and no
other: in the kagent namespace the same identity keeps its namespace-scoped
cluster-admin (templates/kagent/flux-service-account.yaml).
*/ -}}
{{- if (include "agent-platform.agentManager.enabled" .) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform-tenant-flux
  labels:
    {{- include "labels.common" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "agenttemplates", "remotemcpservers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-manager-tenants
  labels:
    {{- include "agent-platform.agentManager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "agenttemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["api.kagent.dev"]
    resources: ["harnesses", "modelconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ate.dev"]
    resources: ["workerpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The network policies of the platform's flavor (networkPolicy.flavor).
  {{- if eq (include "agent-platform.networkPolicyFlavor" .) "cilium" }}
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- else }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["agent-platform-tenant-flux"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-manager-tenants
  labels:
    {{- include "agent-platform.agentManager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-manager-tenants
subjects:
  - kind: ServiceAccount
    name: {{ include "agent-platform.agentManager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
