{{- if (include "agent-platform.ingress.agentgateway" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
    {{- if (include "agent-platform.llmRouting" .) }}
    # LLM listener: agent inference traffic to the provider. Cluster-internal —
    # the data-plane NetworkPolicy admits world traffic on 443 only, and the
    # models (templates/llm/models.yaml) attach here by sectionName, never to
    # the public HTTPS listener below. The listener admits AgentgatewayModels
    # only: the controller refuses a model on a listener whose allowedRoutes
    # do not name the kind (NotAllowedByListeners), and no HTTPRoute — the
    # agent-platform-mcps catch-all included — attaches here.
    - name: {{ .Values.llmRouting.listener.name }}
      port: {{ .Values.llmRouting.listener.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: agentgateway.dev
            kind: AgentgatewayModel
    {{- end }}
    {{- if (include "agent-platform.llmRouting.externalListener" .) }}
    # The external LLM route's listener, behind a public Gateway that forwards
    # <llmRouting.external.hostPrefix>.<global.domain> here: that route matches
    # `/`, which the agentgateway controller refuses on the LLM listener above,
    # where models attach directly (templates/llm/external.yaml).
    - name: {{ .Values.llmRouting.external.listener.name }}
      port: {{ .Values.llmRouting.external.listener.port }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- if (include "agent-platform.edgeIsDataPlane" .) }}
    # Public edge listener: terminates TLS for *.<global.domain>. Routes from
    # every namespace attach here (the kagent UI route lives in the kagent
    # namespace). The umbrella-owned public routes pin themselves to this
    # listener via sectionName, so the plaintext listener above never serves
    # public hostnames through the edge's LoadBalancer Service (the
    # data-plane NetworkPolicy admits world traffic on 443 only).
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ printf "*.%s" (include "agent-platform.domain" (dict "ctx" . "for" "gatewayApi.gateway.create")) | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gatewayApi.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
  {{- if .Values.gateway.parameters.enabled }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ include "agent-platform.parametersName" . }}
  {{- end }}
{{- end }}
