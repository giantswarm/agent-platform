{{- if and (include "agent-platform.agentgateway.controller" .) .Values.networkPolicy.enabled (eq (include "agent-platform.networkPolicyFlavor" .) "kubernetes") }}
{{- $externalPorts := include "agent-platform.jwks.externalPorts" . | fromJsonArray }}
{{- $extra := (.Values.gateway.jwksEgress).external | default dict }}
{{- $extraCidrs := $extra.cidrs | default list }}
{{- $extraPort := $extra.port | default 443 | int }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "name" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  podSelector:
    # agentgateway runs as its own release; `agentgateway: agentgateway` is
    # unique to the controller, so do not scope by the connectivity release name.
    matchLabels:
      agentgateway: agentgateway
      app.kubernetes.io/name: agentgateway
  policyTypes: [Ingress, Egress]
  ingress:
    # xDS from the provisioned data-plane pods. They carry
    # `gateway.networking.k8s.io/gateway-name`; `agentgateway: agentgateway`
    # is on the controller only, so select the data plane by gateway-name.
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
        # Every other data plane this controller provisions: a Gateway of the
        # platform's class in any namespace (the serving slice's models
        # Gateway in the cluster's org namespace, #495).
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-class-name: {{ .Values.gateway.gatewayClassName }}
      ports:
        - port: 9978
          protocol: TCP
    - from:
        - namespaceSelector: {}
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetes.apiServerCIDR | quote }}
    {{- with .Values.gateway.jwksEgress }}
    {{- if .enabled }}
    # The controller fetches remote JWKS centrally (and distributes the keys to
    # the data plane via xDS), so it needs the same JWKS egress as the data plane.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          {{- with .podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
    {{- end }}
    {{- /* Vanilla NetworkPolicy selects addresses, never names: an external
    issuer the routes name, and the platform's identity provider on 443 (the
    models Gateway's default JWKS source), reach the controller as every public
    destination on their JWKS ports, minus
    networkPolicy.kubernetes.worldExcludedCIDRs — the pattern the manager
    policies use. */}}
    {{- if $externalPorts }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{ toYaml .Values.networkPolicy.kubernetes.worldExcludedCIDRs | nindent 14 }}
      ports:
        {{- range $externalPorts }}
        - port: {{ . | int }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- /* gateway.jwksEgress.external.cidrs: an issuer the routes do not name,
    or one this flavour's IPv4 wide rule cannot reach. Its sibling
    external.fqdns is a name selector and this flavour has none, so an issuer
    reached by name belongs in the blocks here. */}}
    {{- if $extraCidrs }}
    - to:
        {{- range $extraCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: {{ $extraPort | int }}
          protocol: TCP
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values: [kube-dns, coredns, k8s-dns-node-cache]
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 1053
          protocol: UDP
        - port: 1053
          protocol: TCP
{{- end }}
