{{- if and (include "agent-platform.ingress.agentgateway" .) .Values.networkPolicy.enabled (eq (include "agent-platform.networkPolicyFlavor" .) "cilium") }}
{{- $external := include "agent-platform.jwks.externalTargets" . | fromJsonArray }}
{{- $extra := (.Values.gateway.jwksEgress).external | default dict }}
{{- $extraCidrs := $extra.cidrs | default list }}
{{- $extraFqdns := $extra.fqdns | default list }}
{{- $extraPort := $extra.port | default 443 | int }}
{{- /* A toFQDNs selector matches nothing without the DNS proxy clause, so the
policy renders the proxy variant of the DNS rule as soon as one name is
selected, and the plain variant otherwise. */}}
{{- $needsDnsProxy := or (gt (len (include "agent-platform.jwks.externalNamedPorts" . | fromJsonArray)) 0) (gt (len $extraFqdns) 0) }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "name" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  endpointSelector:
    # agentgateway runs as its own release; `agentgateway: agentgateway` is
    # unique to the controller, so do not scope by the connectivity release name.
    matchLabels:
      agentgateway: agentgateway
      app.kubernetes.io/name: agentgateway
  ingress:
    # xDS from data-plane pods spawned by this controller. The provisioned
    # data-plane pods carry `gateway.networking.k8s.io/gateway-name`; only the
    # controller itself carries `agentgateway: agentgateway`, so the source
    # selector here must use the gateway-name label to match the data plane.
    - fromEndpoints:
        - matchLabels:
            gateway.networking.k8s.io/gateway-name: {{ .Values.gateway.name }}
      toPorts:
        - ports:
            - port: "9978"
              protocol: TCP
    # Prometheus / health scrape from cluster monitoring.
    - fromEntities: ["cluster"]
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
            - port: "9093"
              protocol: TCP
  egress:
    - toEntities: ["kube-apiserver"]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ include "agent-platform.musterFullname" . }}
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
    {{- with .Values.gateway.jwksEgress }}
    {{- if .enabled }}
    # The controller fetches remote JWKS centrally (and distributes the keys to
    # the data plane via xDS), so it needs the same JWKS egress as the data plane.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ .namespace | quote }}
            {{- with .podSelector }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      toPorts:
        - ports:
            - port: {{ .port | toString | quote }}
              protocol: TCP
    {{- end }}
    {{- end }}
    {{- /* Each external issuer the routes name, on its own JWKS port: by name,
    or as a single-address block for an address literal. */}}
    {{- range $external }}
    {{- if .cidr }}
    - toCIDR:
        - {{ .cidr | quote }}
    {{- else }}
    - toFQDNs:
        - matchName: {{ .host | quote }}
    {{- end }}
      toPorts:
        - ports:
            - port: {{ .port | toString | quote }}
              protocol: TCP
    {{- end }}
    {{- /* gateway.jwksEgress.external.fqdns: an issuer the routes do not name,
    selected by name. Cilium FQDN selectors verbatim (matchName, matchPattern).
    */}}
    {{- if $extraFqdns }}
    - toFQDNs:
        {{- toYaml $extraFqdns | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ $extraPort | toString | quote }}
              protocol: TCP
    {{- end }}
    {{- /* gateway.jwksEgress.external.cidrs: an issuer the routes do not name,
    or one the kubernetes flavour's IPv4 wide rule cannot reach. */}}
    {{- if $extraCidrs }}
    - toCIDR:
        {{- toYaml $extraCidrs | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ $extraPort | toString | quote }}
              protocol: TCP
    {{- end }}
    {{- if $needsDnsProxy }}
    {{- include "agent-platform.dnsEgressWithProxy" . | nindent 4 }}
    {{- else }}
    {{- include "agent-platform.dnsEgress" . | nindent 4 }}
    {{- end }}
{{- end }}
