{{- /* The data plane's access log fields: gateway.accessLog.attributes, a map
keyed by field name, each entry {expression, enabled}, in name order, added to
every access log line. Gateway-scoped like the metrics and tracing policies,
each frontend section in a policy of its own. The expression goes through tpl
(the default agent_instance_id entry includes agent-platform.substrate.egressCall);
an entry without an expression, or one that renders empty or on more than one
line, fails the render naming it. Not rendered without a data plane or with
every entry off. */ -}}
{{- if (include "agent-platform.ingress.agentgateway" .) }}
{{- $root := . }}
{{- $attributes := list }}
{{- range $name, $entry := (dig "accessLog" "attributes" dict (.Values.gateway | default dict)) }}
{{- $entry = $entry | default dict }}
{{- if dig "enabled" true $entry }}
{{- $raw := toString (dig "expression" "" $entry) }}
{{- if not $raw }}
{{- fail (printf "gateway.accessLog.attributes.%s has no expression; every entry is {expression: <one-line CEL>, enabled: <bool>}" $name) }}
{{- end }}
{{- $expr := tpl $raw $root }}
{{- if not $expr }}
{{- fail (printf "gateway.accessLog.attributes.%s: the expression %q renders empty (it goes through tpl)" $name $raw) }}
{{- end }}
{{- if contains "\n" $expr }}
{{- fail (printf "gateway.accessLog.attributes.%s spans more than one line; write the CEL expression on one line" $name) }}
{{- end }}
{{- $attributes = append $attributes (dict "name" $name "expression" $expr) }}
{{- end }}
{{- end }}
{{- if $attributes }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ include "name" . }}-access-log
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  frontend:
    accessLog:
      attributes:
        add:
          {{- range $attributes }}
          - name: {{ .name | toYaml }}
            expression: {{ .expression | replace "'" "''" | squote }}
          {{- end }}
{{- end }}
{{- end }}
