# app-build-suite config for the agent-platform-connectivity chart.
#
# abs prefers `<chart-dir>/.abs/main.yaml` over the repo-root `.abs/main.yaml`
# and reads only one of them, so this file fully replaces the root config for
# the connectivity chart builds. Everything the root file sets (chart-dir,
# destination, generate-metadata) is also passed on the command line by the
# architect orb's `package-helm-with-abs`, so only the chart-specific bit below
# is actually needed here.
#
# app-build-suite's HelmTemplateValidator renders the chart with `helm template`
# using values.yaml only. `ingress.parentRefs` is deliberately empty there and
# the chart fails fast on it (an empty parentRefs renders a route bound to no
# Gateway, leaving muster unreachable while install reports success), so a
# default-values render cannot succeed. Point the validator at the same values
# file `ct lint` uses.
helm-template-extra-values: helm/agent-platform-connectivity/ci/ci-values.yaml
