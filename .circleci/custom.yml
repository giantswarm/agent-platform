# Repo-specific CircleCI jobs. The dynamic-config setup workflow in
# .circleci/config.yml deep-merges this file into the generated
# .circleci/workflows.yml at pipeline runtime (yq `*+`: maps merge, job lists
# append). devctl never touches this file.
#
# Generated job names available to reference in `requires`: build-chart,
# execute-chart-tests, execute-chart-tests-release, push-chart-release (all for
# the primary `agent-platform` chart).
#
# What this file carries beyond the golden (single-chart) pipeline:
#   - test-ingress-modes: `make verify-all`, every offline assertion of the
#     chart's render (Makefile.custom.mk's verify-* targets, listed by
#     `make help`)
#   - the standalone agent-platform-connectivity chart (build, branch dev push,
#     tag push), the consumer-side wiring rendered by the meta-package as a
#     HelmRelease versioned in lockstep with agent-platform off the same git
#     commit. This repo has no Dockerfile, so no chart depends on an image build.
#   - verify-release-floors (tags only): `make verify-release-floors`, the strict
#     run of tests/verify-components-charts.py — every component range and BOM
#     pin resolves to a chart that is pullable from its registry, no fallback
#     (giantswarm/agent-platform#624). A meta chart release naming an unpublished
#     component chart fails every installation's HelmRelease on the line, so the
#     release is refused before either chart is pushed: push-connectivity-chart-release
#     requires it here; the generated push-chart-release requires it through
#     gen.ci.chartReleaseGateJob in giantswarm/github (a repo-owned job the
#     generator gates the release push on, the way image.preBuildJob gates the
#     image). A release refused this way is recovered by rerunning the tag's
#     workflow from failed once the component chart is out, without a new tag.
#
# The agent-platform-crds chart has been RETIRED — every component now ships
# its own CRDs (app-owned CRDs), so there is no longer a CRD-bundle chart to
# build/test/publish here.
version: 2.1

jobs:
  test-ingress-modes:
    # cimg/base: CircleCI's convenience image (no custom entrypoint, passwordless
    # sudo). We install a recent Helm here rather than reuse the lint-chart ct
    # image — ct v3.0.0-rc.1 bundles Helm ~3.3, which predates OCI dependency
    # support (GA in Helm 3.8), so `helm dependency build` of the oci:// sub-charts
    # fails with "no repository definition for oci://…".
    docker:
    - image: cimg/base:current
    steps:
    - checkout
    - run:
        name: install helm + kyverno + make + PyYAML
        command: |
          # python3 is in cimg/base, PyYAML is not: tests/verify-kagent-crds.py
          # and tests/verify-kyverno.py parse rendered objects (and the kagent
          # line's CRDs) with it. Every network call here is bounded and retried:
          # a stalled apt mirror or get.helm.sh download used to sit silently until
          # CircleCI's 10-minute no-output timeout killed the job (twice on one PR,
          # 2026-09-11) — `set -x` shows which command a future stall is in.
          set -x
          for attempt in 1 2 3; do
            (command -v make >/dev/null 2>&1 && python3 -c 'import yaml' 2>/dev/null) && break
            (sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y -qq make python3-yaml) && break
            echo "apt attempt $attempt failed or stalled; retrying" >&2; sleep 15
          done
          command -v make && python3 -c 'import yaml'
          # Pinned (not `main`) so a mid-queue Helm minor can't change behaviour;
          # 3.17.x is well past OCI dependency GA (3.8). Avoids the curl|bash pattern.
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 5 --retry-delay 10 --retry-all-errors https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
          # The kyverno CLI, pinned: tests/verify-model-serving-policies.py runs
          # `kyverno apply` of the rendered model-serving mutations over a pod
          # of each shape (the tarball holds `kyverno` and LICENSE at its root).
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 5 --retry-delay 10 --retry-all-errors https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz | tar xz -C /tmp kyverno
          sudo mv /tmp/kyverno /usr/local/bin/kyverno
          kyverno version
    - run:
        name: verify every render assertion (make verify-all)
        # Every verify-* target of Makefile.custom.mk, which is the set
        # `make verify-all` derives from that file: a new target reaches this
        # job by existing, and nothing names the set twice. `make help` lists
        # what each one asserts. They are the single source of truth for the
        # chart's render, also run locally. The meta chart's one dependency is
        # the flux-engine subchart, a directory in its charts/, which needs no
        # `helm dependency build`.
        command: make verify-all

  verify-release-floors:
    # The tag pipeline's gate (giantswarm/agent-platform#624). Same image and the
    # same bounded, retried installs as test-ingress-modes, without kyverno: the
    # strict check needs helm (to pull each component chart at the version the
    # range and the BOM resolve to, the pullability proof) and PyYAML (the roster
    # and the BOM are read from values.yaml and examples/customer-bom.yaml).
    docker:
    - image: cimg/base:current
    steps:
    - checkout
    - run:
        name: install helm + make + PyYAML
        command: |
          set -x
          for attempt in 1 2 3; do
            (command -v make >/dev/null 2>&1 && python3 -c 'import yaml' 2>/dev/null) && break
            (sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y -qq make python3-yaml) && break
            echo "apt attempt $attempt failed or stalled; retrying" >&2; sleep 15
          done
          command -v make && python3 -c 'import yaml'
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 5 --retry-delay 10 --retry-all-errors https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
    - run:
        name: every component floor and BOM pin is published (make verify-release-floors)
        # Red here names the component and the version the release waits for.
        # Recovery: `devctl release wait` on the component, then rerun this
        # workflow from failed — the tag stands, no new release.
        command: make verify-release-floors

workflows:
  build:
    jobs:
    # ---- Release gate (giantswarm/agent-platform#624): tags only. The chart
    #      pushes of the tag wait on it — the connectivity push below by its
    #      requires, the generated push-chart-release through the generator's
    #      chart release gate (gen.ci.chartReleaseGateJob).
    - verify-release-floors:
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/

    # ---- Ingress-mode guard (was the standalone `test` workflow before
    #      generation). Branch-only; the tag-publish flow is the chart jobs.
    - test-ingress-modes:
        filters:
          tags:
            ignore: /.*/

    # ---- agent-platform-connectivity: the consumer-side wiring chart, versioned
    #      in lockstep with agent-platform off the same git tag. Build + lint
    #      (persist, no push) on branches; push on tags. No ATS smoke job: like the
    #      generated agent-platform pipeline this repo does not kind-install, and
    #      the chart renders CRs whose CRDs (agentgateway/kagent) are absent on bare
    #      kind — build-chart is the gate. No Dockerfile, so no image dependency.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: build-connectivity-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: agent-platform-connectivity
        explicit_allow_chart_name_mismatch: true
        push_to_appcatalog: false
        push_to_oci_registry: false
        persist_chart_archive: true
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore:
            - main

    # Branch (branchPublish): publish the connectivity dev chart in lockstep with
    # the generated push-chart -- same commit, same gitsemver version, same gsoci
    # repository and giantswarm-test-catalog -- so a lab can follow a PR's
    # connectivity chart (agentlab: components.agent-platform-connectivity
    # versionRange + semverFilter). Gated on the meta chart's kind tests too.
    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-connectivity-chart
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: agent-platform-connectivity
        explicit_allow_chart_name_mismatch: true
        requires:
        - build-connectivity-chart
        - execute-chart-tests
        filters:
          branches:
            ignore:
            - main

    - architect/push-to-app-catalog:
        executor: app-build-suite
        context: architect
        name: push-connectivity-chart-release
        app_catalog: giantswarm-catalog
        app_catalog_test: giantswarm-test-catalog
        chart: agent-platform-connectivity
        explicit_allow_chart_name_mismatch: true
        requires:
        - build-connectivity-chart
        - verify-release-floors
        filters:
          tags:
            only: /^v.*/
          branches:
            ignore: /.*/
